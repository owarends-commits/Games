<title>Extrecated Item Modeler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an inspection bench. Item shelf left, the 3D bench centre (edit or player view), inspector right, status strip below. Same committed dark look as the Map Designer. */
:root {
  --bg: #0b0d0c; --panel: #131715; --panel2: #1a1f1c; --panel3: #222823; --line: #2c332e; --fg: #dcd6c6; --dim: #8f8d81; --mute: #5d5f57;
  --accent: #b5562c; --accent2: #d07a44; --warn: #c9a23a; --ok: #7fa35a; --cam: #59a6c9; --note: #c9a23a; --exam: #6fb6d6;
  --display: "Chakra Petch", "Arial Narrow", sans-serif; --body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 14px; margin: 0; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-block: 8px; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
textarea { background: var(--panel2); border: 1px solid var(--line); padding: 5px 7px; width: 100%; resize: vertical; }
.app { height: 100%; display: grid; grid-template-columns: 220px minmax(0, 1fr) 330px; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
@media (max-width: 980px) { body { overflow: auto; } .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 64vh auto auto; } .shelf { max-height: 240px; } }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; }
.brand { font-family: var(--display); font-weight: 600; letter-spacing: .08em; font-size: 17px; white-space: nowrap; }
.brand span { color: var(--accent); }
.sep { width: 1px; height: 22px; background: var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 4px 9px; font-family: var(--mono); font-size: 12px; letter-spacing: .05em; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #150b05; }
.seg button:focus-visible, .btn:focus-visible, .shape:focus-visible, .itm:focus-visible { outline: 2px solid var(--warn); outline-offset: 1px; }
.btn { all: unset; cursor: pointer; padding: 5px 11px; border: 1px solid var(--line); background: var(--panel2); font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #150b05; font-weight: 600; }
.btn.small { padding: 2px 7px; font-size: 12px; }
.btn.danger { color: #e08a72; }
.btn[disabled] { opacity: .4; pointer-events: none; }
label.inl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); font-family: var(--mono); }
select, input[type="number"], input[type="text"] { background: var(--panel2); border: 1px solid var(--line); padding: 3px 6px; min-width: 0; }
input[type="number"] { width: 64px; font-family: var(--mono); font-size: 12.5px; }
input[type="color"] { width: 34px; height: 24px; border: 1px solid var(--line); background: var(--panel2); padding: 0; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.shelf { background: var(--panel); border: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.shelf h3, .pane h3 { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .08em; margin: 0; }
.shelfHead { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.items { overflow-y: auto; padding: 8px; display: grid; gap: 6px; align-content: start; }
.itm { all: unset; cursor: pointer; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px; background: var(--panel2); border: 1px solid var(--line); }
.itm[aria-selected="true"] { border-color: var(--accent); background: #24180f; }
.itm img { width: 64px; height: 48px; image-rendering: pixelated; background: #050606; display: block; }
.itm b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itm small { color: var(--mute); font-family: var(--mono); font-size: 10.5px; }
.shelfFoot { padding: 8px; border-top: 1px solid var(--line); display: grid; gap: 6px; }

.bench { position: relative; background: #070908; border: 1px solid var(--line); min-height: 0; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.shape { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 34px; height: 30px; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); }
.shape:hover { color: var(--fg); border-color: var(--dim); }
.shape svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.view { position: relative; min-height: 0; }
.view canvas.main { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.view canvas.main.pixel { image-rendering: pixelated; }
.pinLabel { position: absolute; transform: translate(10px, -50%); font-family: var(--mono); font-size: 11px; padding: 2px 6px; background: rgba(7,9,8,.88); border: 1px solid var(--line); pointer-events: none; white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.pinLabel.note { color: var(--note); border-color: #5a4a1e; }
.pinLabel.examine { color: var(--exam); border-color: #24485a; }
.hint { position: absolute; left: 8px; bottom: 8px; right: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); pointer-events: none; text-shadow: 0 1px 0 #000; white-space: pre-line; }
.ruler { position: absolute; right: 10px; top: 10px; font-family: var(--mono); font-size: 11px; color: var(--dim); pointer-events: none; text-align: right; }
/* player view: the in-game inspection screen */
.pv { position: absolute; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; }
.pv .pvTop { padding: 14px 18px; display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.pv .pvName { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .1em; color: #e8dfc8; text-shadow: 0 2px 0 #000; }
.pv .pvKey { font-family: var(--mono); font-size: 11px; color: #8f8d81; text-align: right; line-height: 1.5; }
.pv .pvBox { margin: 0 auto 16px; width: min(560px, calc(100% - 32px)); background: rgba(6,7,7,.9); border: 1px solid #3a3a34; border-top: 2px solid #8a6a3a; padding: 10px 14px; font-family: var(--mono); font-size: 13px; color: #e6e0cf; line-height: 1.5; min-height: 64px; }
.pv .pvBox em { color: var(--exam); font-style: normal; }

.side { display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; color: var(--dim); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; padding: 10px; display: grid; gap: 10px; align-content: start; min-height: 0; }
.label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.form { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 8px; align-items: center; }
.form > label { font-size: 12.5px; color: var(--dim); }
.form .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; min-width: 0; }
.muted { color: var(--dim); font-size: 12.5px; margin: 0; line-height: 1.45; }
.list { display: grid; gap: 4px; }
.list .it { display: flex; align-items: center; gap: 6px; padding: 5px 7px; background: var(--panel2); border: 1px solid var(--line); font-size: 12.5px; min-width: 0; cursor: pointer; }
.list .it[aria-selected="true"] { border-color: var(--accent); }
.list .it span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swatch { width: 14px; height: 14px; border: 1px solid var(--line); flex: none; }
.dot { width: 9px; height: 9px; transform: rotate(45deg); flex: none; }
.texrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; }
.texrow button { all: unset; cursor: pointer; aspect-ratio: 1; border: 1px solid var(--line); background-size: cover; image-rendering: pixelated; position: relative; }
.texrow button[aria-pressed="true"] { outline: 2px solid var(--warn); outline-offset: 1px; }
.texrow button.none { display: grid; place-items: center; font-family: var(--mono); font-size: 10px; color: var(--dim); background: var(--panel2); }
footer.status { grid-column: 1 / -1; display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 11.5px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); padding: 5px 10px; }
footer.status b { color: var(--fg); font-weight: 500; }
/* painter */
.modal { position: fixed; inset: 0; background: rgba(5,6,6,.84); display: grid; place-items: center; z-index: 50; padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--accent); width: min(980px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 10px; padding: 12px; }
.sheet header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sheet h2 { font-family: var(--display); font-weight: 600; letter-spacing: .08em; font-size: 18px; margin: 0; flex: 1; }
.texgrid { display: grid; grid-template-columns: minmax(0, auto) minmax(220px, 1fr); gap: 14px; }
@media (max-width: 760px) { .texgrid { grid-template-columns: minmax(0, 1fr); } }
#pCanvas { width: min(448px, 80vw); height: min(448px, 80vw); image-rendering: pixelated; background: repeating-conic-gradient(#1c1c1c 0 25%, #2e2e2e 0 50%) 0 0 / 16px 16px; cursor: crosshair; border: 1px solid var(--line); touch-action: none; max-width: 100%; }
.palette { display: grid; grid-template-columns: repeat(8, 26px); gap: 4px; }
.palette button { all: unset; width: 26px; height: 26px; border: 1px solid var(--line); cursor: pointer; }
.palette button[aria-pressed="true"] { outline: 2px solid var(--warn); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">EXTRECATED <span>ITEM MODELER</span></div>
    <div class="sep"></div>
    <div class="seg" role="group" aria-label="Mode">
      <button id="mEdit" aria-pressed="true">EDIT</button><button id="mPlayer" aria-pressed="false">PLAYER VIEW</button>
    </div>
    <button class="btn" id="undo" title="Ctrl+Z">Undo</button>
    <button class="btn" id="redo" title="Ctrl+Y">Redo</button>

  <aside class="shelf">

    <div class="items" id="items"></div>
    <div class="shelfFoot">
      <select id="newFrom" aria-label="New item from"></select>
      <div style="display:flex; gap:6px; flex-wrap:wrap"><button class="btn small" id="newItem">New item</button><button class="btn small" id="dupItem">Duplicate</button><button class="btn small danger" id="delItem">Delete</button></div>
    </div>

  <section class="bench">

        <button data-tm="translate" aria-pressed="true" title="W">MOVE</button><button data-tm="rotate" aria-pressed="false" title="E">ROTATE</button><button data-tm="scale" aria-pressed="false" title="R">SIZE</button><button data-tm="pin" aria-pressed="false" title="P">PIN NOTE</button>

        <div class="pvTop"><div class="pvName" id="pvName"></div><div class="pvKey">DRAG · TURN THE ITEM<br>WHEEL · CLOSER<br>CLICK A GLINT · EXAMINE</div></div>

  <aside class="side">

      <button role="tab" data-tab="pins" aria-selected="false">NOTES &amp; EXAMINE</button>

    <div class="pane" id="pane-pins" hidden></div>
    <div class="pane" id="pane-file" hidden></div>
  </aside>

  <footer class="status" id="status"></footer>
</div>

<!-- texture painter -->
<div class="modal" id="paint" hidden>
  <div class="sheet" role="dialog" aria-labelledby="pTitle">
    <header><h2 id="pTitle">TEXTURE PAINTER</h2>

        <div><div class="label" style="margin-bottom:6px">Bring in a picture</div><input type="file" id="pFile" accept="image/*"><p class="muted" style="margin-top:6px">Labels, photos, engravings. The picture is shrunk to the size above, pixel for pixel, the way the game shows it.</p></div>
      </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script>
"use strict";
// =====================================================================================================
// Units: metres in the data, centimetres in the inspector. +Y up. Long items lie along X (muzzle / lens toward -X).
// A part is a unit shape scaled by its size d, rotated by r (degrees, XYZ), placed at p.
// Pins are stored on a part, in that part's unit space, so they move and turn with it.
// =====================================================================================================
const $ = id => document.getElementById(id);
const uid = p => p + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const cm = v => Math.round(v * 1000) / 10;          // metres -> cm (1 decimal)
const r3 = v => Math.round(v * 10000) / 10000;

// ----------------------------------------------------------------------------------- built-in item textures (32 px)
function rnd(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(fn, s = 32) { const c = document.createElement("canvas"); c.width = c.height = s; const g = c.getContext("2d"); fn(g, s); return c; }
function noise(g, s, amt, seed) { const r = rnd(seed); const d = g.getImageData(0, 0, s, s); for (let i = 0; i < d.data.length; i += 4) { const n = (r() - .5) * amt; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; } g.putImageData(d, 0, 0); }
function streaks(g, s, col, n, seed, vertical) { const r = rnd(seed); g.fillStyle = col; for (let i = 0; i < n; i++) { const a = Math.floor(r() * s), b = Math.floor(r() * s), L = 3 + Math.floor(r() * s * .6); vertical ? g.fillRect(a, b, 1, L) : g.fillRect(b, a, L, 1); } }
const TEXGEN = {
  "Brushed metal": (g, s) => { g.fillStyle = "#8c9096"; g.fillRect(0, 0, s, s); streaks(g, s, "#a6aab0", 40, 1); streaks(g, s, "#6e7278", 30, 2); noise(g, s, 8, 3); },
  "Blued steel": (g, s) => { g.fillStyle = "#2a2e36"; g.fillRect(0, 0, s, s); streaks(g, s, "#3c4250", 30, 4); noise(g, s, 10, 5); g.fillStyle = "#5a5e66"; for (let i = 0; i < 6; i++) g.fillRect(rnd(i)() * s | 0, rnd(i + 9)() * s | 0, 2, 1); },
  "Brass": (g, s) => { g.fillStyle = "#b08a3a"; g.fillRect(0, 0, s, s); streaks(g, s, "#d0aa58", 30, 6); streaks(g, s, "#7a5a24", 16, 7); noise(g, s, 10, 8); },
  "Chrome": (g, s) => { const gr = g.createLinearGradient(0, 0, 0, s); gr.addColorStop(0, "#e8ecf0"); gr.addColorStop(.45, "#8a9098"); gr.addColorStop(.55, "#cfd4da"); gr.addColorStop(1, "#5a6068"); g.fillStyle = gr; g.fillRect(0, 0, s, s); noise(g, s, 6, 9); },
  "Rust": (g, s) => { g.fillStyle = "#6a3a22"; g.fillRect(0, 0, s, s); noise(g, s, 46, 10); const r = rnd(11); for (let i = 0; i < 40; i++) { g.fillStyle = r() < .5 ? "#8a4a26" : "#3e2416"; g.fillRect(r() * s | 0, r() * s | 0, 2, 2); } },
  "Black plastic": (g, s) => { g.fillStyle = "#1c1d20"; g.fillRect(0, 0, s, s); noise(g, s, 10, 12); },
  "Rubber grip": (g, s) => { g.fillStyle = "#18181a"; g.fillRect(0, 0, s, s); g.fillStyle = "#2a2a2e"; for (let y = 0; y < s; y += 4) for (let x = (y / 4) % 2 * 2; x < s; x += 4) g.fillRect(x, y, 2, 2); },
  "Wood": (g, s) => { const r = rnd(13); for (let y = 0; y < s; y++) { const t = Math.sin(y * .7 + Math.sin(y * .13) * 3) * 14; g.fillStyle = `rgb(${118 + t},${80 + t * .8},${50 + t * .5})`; g.fillRect(0, y, s, 1); } noise(g, s, 10, 14); g.fillStyle = "#4a3020"; g.fillRect(r() * s | 0, 0, 1, s); },
  "Dark walnut": (g, s) => { for (let y = 0; y < s; y++) { const t = Math.sin(y * .9 + Math.sin(y * .2) * 2) * 10; g.fillStyle = `rgb(${70 + t},${44 + t * .7},${28 + t * .4})`; g.fillRect(0, y, s, 1); } noise(g, s, 10, 15); },
  "Checkered grip": (g, s) => { g.fillStyle = "#4a2e1c"; g.fillRect(0, 0, s, s); g.strokeStyle = "#2a1a10"; for (let i = -s; i < s * 2; i += 3) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + s, s); g.moveTo(i, s); g.lineTo(i + s, 0); g.stroke(); } noise(g, s, 8, 16); },
  "Leather": (g, s) => { g.fillStyle = "#5a3424"; g.fillRect(0, 0, s, s); noise(g, s, 30, 17); g.fillStyle = "#3e2216"; const r = rnd(18); for (let i = 0; i < 24; i++) g.fillRect(r() * s | 0, r() * s | 0, 1 + (r() * 3 | 0), 1); },
  "Black leather": (g, s) => { g.fillStyle = "#1e1a18"; g.fillRect(0, 0, s, s); noise(g, s, 18, 19); },
  "Paper": (g, s) => { g.fillStyle = "#e6dfcc"; g.fillRect(0, 0, s, s); noise(g, s, 10, 20); },

for (const [k, v] of Object.entries(SHAPES)) { const b = document.createElement("button"); b.className = "shape"; b.title = "Add " + v.name.toLowerCase(); b.setAttribute("aria-label", "Add " + v.name); b.innerHTML = `<svg viewBox="0 0 24 24">${v.icon}</svg>`; b.onclick = () => addPart(k); $("shapes").appendChild(b); }

// ----------------------------------------------------------------------------------- texture painter
let pc = $("pCanvas"), pg = pc.getContext("2d"), brush = "pen", pcol = "#8a6a40";
const PAL = ["#000000", "#1c1d20", "#3a3c40", "#6e7278", "#a6aab0", "#e8e4d8", "#ffffff", "#d8b49a", "#5a3424", "#8a5a34", "#b08a3a", "#d0aa58", "#7a1e1a", "#c83a2a", "#d8701c", "#e0c048", "#2e4a26", "#5a7a3a", "#2a3a5a", "#5a7a9a", "#6a4a7a", "#c8a070", "#9a8a70", "#4a4038"];

document.querySelectorAll("[data-brush]").forEach(b => b.onclick = () => { brush = b.dataset.brush; document.querySelectorAll("[data-brush]").forEach(x => x.setAttribute("aria-pressed", x === b)); });

}
$("pSize").onchange = () => { const s = +$("pSize").value; const old = document.createElement("canvas"); old.width = pc.width; old.height = pc.height; old.getContext("2d").drawImage(pc, 0, 0); pc.width = pc.height = s; pg.imageSmoothingEnabled = false; pg.drawImage(old, 0, 0, s, s); };
