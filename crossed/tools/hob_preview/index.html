<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hob Animation Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* layout: the stage beside a rail of animations; the same dark review-bay look as the Brute, ACROSS and Runner previews */
:root{
  --bg:#141312; --panel:#1d1b19; --line:#34302b; --fg:#e7e1d6; --dim:#9b9284; --accent:#d8723a; --gold:#e8c77a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:.06em;text-transform:uppercase;margin:0}
header p{margin:0;color:var(--dim);max-width:80ch;line-height:1.45}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.stage{position:relative;min-height:340px;border:1px solid var(--line);background:#0e0d0c;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:2px;pointer-events:none}
.hud b{font-family:var(--display);font-size:30px;letter-spacing:.08em;color:var(--fg);font-weight:600;line-height:1}
.hud .ph{color:var(--accent)}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-family:var(--mono);text-align:center;padding:16px}
.load[hidden]{display:none}
.cams{position:absolute;right:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.rail{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.anim{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);padding:10px 12px;cursor:pointer}
.anim:hover{border-color:#5a5045}
.anim[aria-pressed="true"]{border-color:var(--accent);background:#261e18}
.anim .k{grid-row:span 2;font-family:var(--mono);color:var(--dim);font-size:12px;padding-top:3px;font-style:normal}
.anim strong{font-family:var(--display);font-size:20px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.anim span{color:var(--dim);font-size:12.5px;line-height:1.4}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button.t{font:inherit;font-size:12.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:6px 9px;cursor:pointer}
button.t[aria-pressed="true"]{border-color:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.note{font-size:12px;color:var(--dim);line-height:1.45;margin:0}
#cue{position:absolute;left:12px;bottom:16px;font-family:var(--mono);font-size:13px;color:var(--gold);opacity:0;transition:opacity .5s;pointer-events:none;max-width:70%}
.dmg{position:absolute;right:14px;bottom:16px;opacity:0;pointer-events:none}
@media (max-width:820px){ .wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:56vh auto} .stage{min-height:300px} .cams button.t{padding:4px 7px} }
@media (prefers-reduced-motion:reduce){ #cue{transition:none} }
</style>
<div class="wrap">
  <div class="stage">
    <canvas id="c" aria-label="Hob animation preview"></canvas>
    <div class="hud"><b id="hName">Crawl</b><span>phase <span class="ph" id="hPh">—</span></span><span id="hSp"></span></div>
    <div class="cams" role="group" aria-label="Camera">
      <button class="t" data-cam="side" aria-pressed="true">Side</button><button class="t" data-cam="three">¾</button><button class="t" data-cam="front">Front (her view)</button><button class="t" data-cam="top">Top</button><button class="t" data-cam="back">Back</button><button class="t" data-cam="skin">Torso close</button><button class="t" data-cam="pov">Her eyes</button>
    </div>
    <div class="dmg" id="dmg"></div>
    <div id="cue"></div>
    <div class="load" id="load">Loading and rigging the Hob…</div>
  </div>
  <div class="rail">
    <button class="anim" data-a="crawl" aria-pressed="true"><i class="k">1</i><strong>Crawl</strong><span>Hand over hand. One hand reaches ahead and digs its fingers in, then hauls, dragging the whole starved body forward along the floor. Meanwhile the other hand swings through. The torso sags and ripples behind, the back legs trail and scrape, and the face stays level.</span></button>
    <button class="anim" data-a="fast"><i class="k">2</i><strong>Fast crawl</strong><span>The same pull, quick and frantic: short, hard hauls one after another. The body surges between them and the legs bounce, while the swellings inside slosh back with every surge.</span></button>
    <button class="anim" data-a="screech"><i class="k">3</i><strong>Screech</strong><span>It tenses and the swellings bulge. It shoves up onto straight arms with the face tipping back, the jaw drops open, and it screams. The head shudders and everything under the skin goes frantic. Then it settles.</span></button>
    <button class="anim" data-a="grabL"><i class="k">4</i><strong>Grab · left hand</strong><span>A chase. Norah walks away ahead, glancing back. The Hob drags itself after her on its right hand alone while the left arm stays stretched out in front, hand open, inching closer until the fingertips just reach her back. Then the fingers close right round her, it lifts her, squeezes down hard three times and drops her.</span></button>
    <button class="anim" data-a="grabR"><i class="k">5</i><strong>Grab · right hand</strong><span>The same chase on the other side: it crawls on its left hand while the long right arm reaches out after her, slowly, until it just reaches her back. Then it closes on her, lifts her, squeezes down hard three times and drops her.</span></button>
    <button class="anim" data-a="throne"><i class="k">6</i><strong>Throne grab</strong><span>While crawling at her it plants both hands and shoves off once, hard, launching itself forward fast and a little into the air. Both arms stretch out for her, and as the body crashes flat both hands close on her. Its arms come round both sides of the head and hold her centred in front of its face. It lies still, head up, looking at her, then slowly draws her toward its mouth. The burning cross on its right upper arm, just below the shoulder, is in plain view from her position: Two ways out: <b>2 shots to the cross</b>, or <b>2 shots to its eyes</b> (one in each). Either way it spasms, lets go, and she scrambles clear.</span></button>
    <div class="opts">
      <button class="t" id="oSlow" aria-pressed="false">Slow ×0.25</button>
      <button class="t" id="oAll" aria-pressed="false">Play all in order</button>
      <button class="t" id="oBones" aria-pressed="false">Show bones</button>
    </div>
    <label class="note" for="oEscape" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">Throne grab escape <select id="oEscape" style="font:inherit;font-size:12.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:6px 9px"><option value="alt">Alternate</option><option value="cross">Shoot the cross (2)</option><option value="eyes">Shoot the eyes (2)</option></select></label>
  </div>
</div>

<script>
"use strict";
// ---------------------------------------------------------------- scene: a plain floor marked in metres
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0e0d0c); scene.fog=new THREE.Fog(0x0e0d0c,16,36);
const cam=new THREE.PerspectiveCamera(38,1,0.05,100);
scene.add(new THREE.HemisphereLight(0xd8dce6,0x2a2218,0.8));
const sun=new THREE.DirectionalLight(0xfff0dd,0.7); sun.position.set(-3,7,5); scene.add(sun);

function piv(p,pos){ const o=new THREE.Object3D(); o.position.copy(pos); p.add(o); return o; }

  const model=THREE.SkeletonUtils.clone(gltf.scene); const B={}; model.traverse(o=>{ if(o.isBone) B[o.name]=o; if(o.isMesh){ o.frustumCulled=false; } });
  model.traverse(o=>{ if(o.isMesh){ const map=o.material.map; if(map) map.encoding=THREE.LinearEncoding; o.material=new THREE.MeshLambertMaterial({map,side:THREE.DoubleSide,skinning:!!o.isSkinnedMesh}); } });

  const R={}; R.root=piv(top,new THREE.Vector3()); R.hips=piv(R.root,B.hips.position); R.hip0=B.hips.position.y;
  R.chest=piv(R.hips,B.chest.position); R.neck=piv(R.chest,B.neck.position); R.head=piv(R.neck,B.head.position);
  const ax={};
  for(const s of ["L","R"]){
    R["arm"+s]=piv(R.chest,B["upperarm_"+s].position);
    R["elbow"+s]=piv(R["arm"+s],new THREE.Vector3(0,-B["forearm_"+s].position.length(),0));
    R["wrist"+s]=piv(R["elbow"+s],new THREE.Vector3(0,-B["hand_"+s].position.length(),0));
    R["leg"+s]=piv(R.hips,B["thigh_"+s].position);
    R["knee"+s]=piv(R["leg"+s],new THREE.Vector3(0,-B["shin_"+s].position.length(),0));
    R["ankle"+s]=piv(R["knee"+s],new THREE.Vector3(0,-B["foot_"+s].position.length(),0));
    ax["upperarm_"+s]=B["forearm_"+s].position.clone().normalize(); ax["forearm_"+s]=B["hand_"+s].position.clone().normalize(); ax["hand_"+s]=ax["forearm_"+s];
    ax["thigh_"+s]=B["shin_"+s].position.clone().normalize(); ax["shin_"+s]=B["foot_"+s].position.clone().normalize(); }
  const map=[["chest","ori",R.chest],["neck","ori",R.neck],["head","ori",R.head]];
  for(const s of ["L","R"]) map.push(["upperarm_"+s,"pts",R["arm"+s],R["elbow"+s]],["forearm_"+s,"pts",R["elbow"+s],R["wrist"+s]],["hand_"+s,"axis",R["wrist"+s],AXD],
    ["thigh_"+s,"pts",R["leg"+s],R["knee"+s]],["shin_"+s,"pts",R["knee"+s],R["ankle"+s]],["foot_"+s,"ori",R["ankle"+s]]);

  const B=C.B,R=C.R; C.group.updateMatrixWorld(true);

    else { if(kind==="pts"){ src.getWorldPosition(_v2); b.getWorldPosition(_v3); _v3.sub(_v2); } else { src.getWorldQuaternion(_q2); _v3.copy(b).applyQuaternion(_q2); }

// ---------------------------------------------------------------- physics guard
// Every character is a real mass: its centre of mass comes from the mesh's volume (voxelised once, carried by the
// bones), the floor can only push, and anything unsupported falls at g. Each frame, after a clip has posed a body:
//  · vertical: the body sits at the higher of "resting on what supports it" and "its centre of mass continuing on a
//    ballistic arc". So it can't hover, can't sink, can't be pulled down faster than gravity, and leaves the floor by itself
//    when it pushes off hard enough; in the air the centre of mass is a parabola whatever the limbs do.
//  · horizontal: airborne the centre of mass keeps its velocity; on the floor the zero-moment point (where the floor's
//    reaction must act) has to lie inside the support polygon, so a body that would tip is moved back over its support
//    (the Brute shifts its body over its planted stumps; the jointed bodies use the ankle strategy and tip about the edge of their feet).
const PHYS=(function(){
  const V=THREE.Vector3, G=9.8; const GC=['getX','getY','getZ','getW']; const comp=(A,i,w)=>A[GC[w]](i);
  // --- mass model: fill the closed mesh with points (vertical rays, inside = between hit pairs) and give each one to the bones of the nearest vertex
  function massModel(mesh,cell){ const g=mesh.geometry, P=g.attributes.position, SI=g.attributes.skinIndex, SW=g.attributes.skinWeight, idx=g.index?g.index.array:null;
    const nT=idx?idx.length/3:P.count/3, vi=k=>idx?idx[k]:k; const bb=new THREE.Box3().setFromBufferAttribute(P), size=bb.getSize(new V());
    cell=cell||Math.max(size.x,size.y,size.z)/48; const nx=Math.ceil(size.x/cell)+1, nz=Math.ceil(size.z/cell)+1, cols=new Map();
    const a=new V(),b=new V(),c=new V();
    for(let t=0;t<nT;t++){ a.fromBufferAttribute(P,vi(3*t)); b.fromBufferAttribute(P,vi(3*t+1)); c.fromBufferAttribute(P,vi(3*t+2));
      const x0=Math.max(0,Math.floor((Math.min(a.x,b.x,c.x)-bb.min.x)/cell)), x1=Math.min(nx-1,Math.ceil((Math.max(a.x,b.x,c.x)-bb.min.x)/cell));
      const z0=Math.max(0,Math.floor((Math.min(a.z,b.z,c.z)-bb.min.z)/cell)), z1=Math.min(nz-1,Math.ceil((Math.max(a.z,b.z,c.z)-bb.min.z)/cell));
      const d=(b.z-c.z)*(a.x-c.x)+(c.x-b.x)*(a.z-c.z); if(Math.abs(d)<1e-12) continue;
      for(let i=x0;i<=x1;i++) for(let j=z0;j<=z1;j++){ const px=bb.min.x+(i+0.5)*cell, pz=bb.min.z+(j+0.5)*cell;
        const l1=((b.z-c.z)*(px-c.x)+(c.x-b.x)*(pz-c.z))/d, l2=((c.z-a.z)*(px-c.x)+(a.x-c.x)*(pz-c.z))/d, l3=1-l1-l2; if(l1<0||l2<0||l3<0) continue;
        const k=i*nz+j; let L=cols.get(k); if(!L) cols.set(k,L=[]); L.push(l1*a.y+l2*b.y+l3*c.y); } }

    const hc=cell*2, H=new Map(), key=(x,y,z)=>`${Math.floor(x/hc)},${Math.floor(y/hc)},${Math.floor(z/hc)}`;

  // --- contact points: the extreme vertices of every bone's part (corners are what touch the floor) plus a spread sample
  function contactSet(mesh){ const g=mesh.geometry, P=g.attributes.position, SI=g.attributes.skinIndex, SW=g.attributes.skinWeight, by=new Map();
    for(let i=0;i<P.count;i++){ let bi=0,bw=-1; for(let w=0;w<4;w++){ const x=comp(SW,i,w); if(x>bw){ bw=x; bi=comp(SI,i,w); } } let L=by.get(bi); if(!L) by.set(bi,L=[]); L.push(i); }
    const dirs=[]; for(const x of [-1,0,1]) for(const y of [-1,0,1]) for(const z of [-1,0,1]) if(x||y||z) dirs.push(new V(x,y,z).normalize());
    const S=new Set(); const v=new V(); for(const [,L] of by){ for(const d of dirs){ let best=-1,bd=-1e18; for(const i of L){ v.fromBufferAttribute(P,i); const s=v.dot(d); if(s>bd){ bd=s; best=i; } } S.add(best); } }
    const step=Math.max(1,Math.floor(P.count/400)); for(let i=0;i<P.count;i+=step) S.add(i); return [...S]; }
