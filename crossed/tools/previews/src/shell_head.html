<title>Crossed Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen, two modes. BUILD: top bar, tool rail left, plan / 3D view centre, inspector right, status strip below.
   PLAY: the combat playground full screen, with its tuning panel. One committed dark look shared with the Map Designer. */
:root{
  --bg:#0b0d0c; --panel:#131715; --panel2:#1a1f1c; --panel3:#222823; --line:#2c332e; --fg:#dcd6c6; --dim:#8f8d81; --mute:#5d5f57;
  --accent:#b5562c; --accent2:#d07a44; --warn:#c9a23a; --ok:#7fa35a; --cam:#59a6c9; --gold:#e8c77a; --danger:#e08a72;
  --display:"Chakra Petch","Arial Narrow",sans-serif; --body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:46px; --rail:72px; --side:340px; --status:26px; --toolsH:0px;
  color-scheme:dark;
}
body{background:var(--bg); color:var(--fg)}
#ed{display:none}
body.build #ed{display:block}
body.build .hud, body.build #panel, body.build #toggle, body.build #help, body.build #result, body.build #dead, body.build #replaybar, body.build #touch, body.build #tags, body.build #toBuildBtn, body.build #prompt, body.build #searchbar, body.build #toast, body.build #inv, body.build #grabVig, body.build #qteResult{display:none!important}
body.build #view{left:var(--rail)!important; right:var(--side)!important; top:var(--top)!important; bottom:calc(var(--status) + var(--toolsH))!important; width:calc(100% - var(--rail) - var(--side))!important; height:calc(100% - var(--top) - var(--status) - var(--toolsH))!important; image-rendering:auto; cursor:crosshair}
body.build.pixel #view{image-rendering:pixelated}
#edTop{position:fixed; left:0; right:0; top:0; height:var(--top); box-sizing:border-box; display:flex; align-items:center; gap:8px 12px; padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px)); background:var(--panel); border-bottom:1px solid var(--line); font-family:var(--body); font-size:13px; z-index:30; overflow-x:auto; white-space:nowrap}
.brand{font-family:var(--display); font-weight:600; letter-spacing:.08em; font-size:16px}
.brand span{color:var(--accent)}
.sep{width:1px; height:22px; background:var(--line); flex:none}
.seg{display:inline-flex; border:1px solid var(--line); flex:none}
.seg button{all:unset; cursor:pointer; padding:4px 10px; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#150b05}
.btn{all:unset; cursor:pointer; padding:5px 11px; border:1px solid var(--line); background:var(--panel2); font-family:var(--body); font-size:13px; color:var(--fg); white-space:nowrap; box-sizing:border-box}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#150b05; font-weight:600}
.btn.small{padding:3px 8px; font-size:12px}
.btn.danger{color:var(--danger)}
.btn:focus-visible,.seg button:focus-visible,.tool:focus-visible,.libitem:focus-visible,.preset:focus-visible,.sw:focus-visible{outline:2px solid var(--warn); outline-offset:1px}
.chipset{display:inline-flex; gap:10px; font-family:var(--mono); font-size:11.5px; color:var(--dim); flex:none}
.chipset label{display:inline-flex; gap:5px; align-items:center; cursor:pointer}
#edName{width:170px; font-family:var(--body); font-size:13px}
#edTop select,#ed input[type=text],#ed input[type=search],#ed input[type=number],#ed select,#ed textarea{background:var(--panel2); color:var(--fg); border:1px solid var(--line); padding:3px 6px; font-family:var(--body); font-size:12.5px; box-sizing:border-box; min-width:0}
#ed input[type=number]{font-family:var(--mono); font-size:12px; width:100%}
#ed textarea{width:100%; min-height:56px; resize:vertical}
#ed textarea.mono{font-family:var(--mono); font-size:11px}
#ed input[type=color]{width:38px; height:24px; padding:0; border:1px solid var(--line); background:var(--panel2)}
#edPlay{margin-left:auto}
#edPanelBtn{display:none}
#edTools{position:fixed; left:0; top:var(--top); bottom:var(--status); width:var(--rail); box-sizing:border-box; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; display:flex; flex-direction:column; gap:2px; padding:5px 4px; z-index:20; padding-left:max(4px,env(safe-area-inset-left,0px))}
.tool{all:unset; cursor:pointer; display:grid; justify-items:center; gap:1px; padding:5px 2px; border:1px solid transparent; font-family:var(--body); font-size:10.5px; color:var(--dim); text-align:center; flex:none}
.tool svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.6}
.tool kbd{font-family:var(--mono); font-size:9px; color:var(--mute)}
.tool:hover{color:var(--fg); border-color:var(--line)}
.tool[aria-pressed="true"]{color:var(--fg); background:#3a2116; border-color:var(--accent)}
#edPlan{position:fixed; left:var(--rail); right:var(--side); top:var(--top); bottom:calc(var(--status) + var(--toolsH)); width:calc(100% - var(--rail) - var(--side)); height:calc(100% - var(--top) - var(--status) - var(--toolsH)); z-index:5; display:block; touch-action:none; outline:none}
#edPlan[hidden]{display:none}
#edHint{position:fixed; left:calc(var(--rail) + 10px); bottom:calc(var(--status) + var(--toolsH) + 8px); right:calc(var(--side) + 10px); font-family:var(--mono); font-size:11.5px; color:var(--dim); pointer-events:none; text-shadow:0 1px 0 #000; z-index:6}
#edSide{position:fixed; right:0; top:var(--top); bottom:var(--status); width:var(--side); box-sizing:border-box; background:var(--panel); border-left:1px solid var(--line); display:grid; grid-template-rows:auto minmax(0,1fr); z-index:20; font-family:var(--body); font-size:13px; padding-right:env(safe-area-inset-right,0px)}
#edTabs{display:flex; border-bottom:1px solid var(--line); overflow-x:auto}
#edTabs button{all:unset; cursor:pointer; padding:8px 11px; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--dim); border-bottom:2px solid transparent; white-space:nowrap}
#edTabs button[aria-selected="true"]{color:var(--fg); border-bottom-color:var(--accent)}
#edTabs button:focus-visible{outline:2px solid var(--warn)}
#edSide .pane{overflow-y:auto; padding:10px 12px 24px; display:grid; gap:8px; align-content:start; min-height:0}
#edSide .pane[hidden]{display:none}
.fhead h3{font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:.08em; margin:0; text-transform:uppercase}
.fhead p{margin:3px 0 0}
.muted{color:var(--dim); font-size:12.5px; margin:0; line-height:1.45}
.muted b{color:var(--fg); font-weight:500}
.label{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-top:8px; padding-top:8px; border-top:1px solid var(--line)}
.frow{display:grid; grid-template-columns:104px minmax(0,1fr); gap:3px 8px; align-items:center}
.frow > label{font-size:12.5px; color:var(--dim)}
.frow .fhint{grid-column:2; color:var(--mute); font-size:11.5px; line-height:1.35}
.val{font-family:var(--mono); font-size:12px}
.pair{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px; align-items:center}
.trio{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px}
.fchk{display:flex; gap:7px; align-items:center; font-size:12.5px; cursor:pointer}
.fbtns{display:flex; flex-wrap:wrap; gap:5px}
.card{border:1px solid var(--line); background:var(--panel2); padding:8px; display:grid; gap:6px}
.card.on{border-color:var(--accent)}
.entry{display:grid; grid-template-columns:minmax(0,1fr) 58px auto; gap:4px; align-items:center}
.entrySub{grid-column:1 / -1; display:grid; gap:4px; padding-left:8px; border-left:2px solid var(--line)}
details summary{cursor:pointer; font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; padding:4px 0}
details[open]{display:grid; gap:6px}
.swatches{display:grid; grid-template-columns:repeat(6,1fr); gap:4px}
.sw{all:unset; cursor:pointer; aspect-ratio:1; border:1px solid var(--line)}
.sw[aria-pressed="true"]{outline:2px solid var(--gold); outline-offset:1px}
.bigthumb{width:100%; max-width:256px; image-rendering:auto; border:1px solid var(--line)}
.lib{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px}
.libitem{all:unset; cursor:pointer; display:grid; gap:3px; justify-items:center; padding:5px 3px; background:var(--panel2); border:1px solid var(--line); text-align:center; font-size:11.5px; position:relative}
.libitem img{width:96px; height:72px; background:#101312; display:block; max-width:100%}
.libitem span{line-height:1.2}
.libitem .dims{font-family:var(--mono); font-size:10px; color:var(--mute)}
.libitem[aria-pressed="true"]{border-color:var(--accent); background:#24180f}
.libitem .tag{position:absolute; top:4px; left:4px; font-family:var(--mono); font-size:8.5px; background:var(--warn); color:#150b05; padding:0 3px; font-weight:600; letter-spacing:.04em}
.presets{display:grid; gap:5px}
.preset{all:unset; cursor:pointer; display:grid; gap:2px; padding:7px 9px; background:var(--panel2); border:1px solid var(--line)}
.preset b{font-weight:600; font-size:13px}
.preset span{color:var(--dim); font-size:12px; line-height:1.35}
.preset:hover{border-color:var(--dim)}
.preset.armed{border-color:var(--accent)}
.preset.armed span{color:var(--gold)}
.saved{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:5px; align-items:center; font-size:12.5px}
.saved span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#edStatus{position:fixed; left:0; right:0; bottom:0; height:var(--status); box-sizing:border-box; display:flex; gap:18px; align-items:center; padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px)); background:var(--panel); border-top:1px solid var(--line); font-family:var(--mono); font-size:11px; color:var(--dim); z-index:20; overflow:hidden; white-space:nowrap}
#edStatus b{color:var(--fg); font-weight:500; font-variant-numeric:tabular-nums}
#edLoading{position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); color:var(--dim); font-family:var(--mono); font-size:13px; letter-spacing:.1em; z-index:40}
#edLoading[hidden]{display:none}
@media (max-width:820px){
  :root{--rail:0px; --side:0px; --toolsH:58px; --top:46px}
  #edTools{top:auto; bottom:var(--status); left:0; right:0; width:auto; height:var(--toolsH); flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:0; border-top:1px solid var(--line); padding:4px max(4px,env(safe-area-inset-left,0px))}
  .tool{min-width:52px}
  #edSide{display:none; width:min(380px,100%); bottom:calc(var(--status) + var(--toolsH)); box-shadow:-8px 0 24px rgba(0,0,0,.5)}
  body.sideOpen #edSide{display:grid}
  #edPanelBtn{display:inline-block}
  .chipset{display:none}
  #edName{width:120px}
}
/* play-mode additions */
#toBuildBtn{position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:11; font-family:"Courier New",monospace}
#paused{top:46px!important}
#prompt{left:50%; bottom:150px; transform:translateX(-50%); font-size:14px; color:#f0e6c8; background:rgba(0,0,0,.55); padding:3px 10px; white-space:nowrap}
#prompt:empty{display:none}
#searchbar{left:50%; bottom:110px; transform:translateX(-50%); width:280px; display:none; font-size:12px; color:#e8c77a; text-align:center}
#searchbar .track{height:8px; background:#3a3530; border:1px solid #6b6357; margin-top:4px}
#searchbar .fill{height:100%; width:0; background:#e8c77a}
#toast{position:fixed; left:50%; top:22%; transform:translateX(-50%); background:rgba(10,8,6,.9); border:1px solid #6b5c3e; color:#e8dcc0; padding:8px 14px; font:14px "Courier New",monospace; pointer-events:none; opacity:0; transition:opacity .4s; z-index:9; max-width:80vw; text-align:center}
#flashline{font-size:12px; color:#e8d898}
#bagline{font-size:12px; color:#9a9283}
#inv{position:fixed; inset:0; background:rgba(4,4,3,.82); z-index:25; display:grid; place-items:center; font-family:"Courier New",monospace; color:#e6e0cf; padding:16px}
#inv[hidden]{display:none}
#inv .sheet{width:min(760px,100%); max-height:100%; overflow:auto; background:rgba(12,10,8,.97); border:1px solid #4a4236; border-top:2px solid #8a6a3a; display:grid; gap:10px; padding:14px 16px}
#inv header{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap}
#inv h2{margin:0; font-size:18px; letter-spacing:4px; color:#e8c77a}
#invHead{font-size:12px; color:#9a9283}
#inv .cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:14px}
@media (max-width:600px){ #inv .cols{grid-template-columns:minmax(0,1fr)} }
#invList{display:grid; gap:4px; align-content:start}
.invItem{all:unset; cursor:pointer; display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 8px; border:1px solid #2e2820; background:#16120e; font-size:13px}
.invItem i{width:12px; height:12px; display:block; border:1px solid #000}
.invItem small{color:#857c6b; font-size:11px}
.invItem[aria-pressed="true"]{border-color:#c9a24a; background:#2a2016}
.invItem:focus-visible,.invBtn:focus-visible{outline:2px solid #e8c77a}
.invEmpty{color:#9a9283; font-size:13px; line-height:1.5}
#invDetail h3{margin:0 0 6px; font-size:16px; color:#f0e6c8}
#invDetail p{margin:0 0 10px; font-size:13px; line-height:1.55; color:#cfc6b2}
.invActs{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.invBtn{all:unset; cursor:pointer; font-size:13px; padding:5px 10px; border:1px solid #5a5040; background:#2a241c}
.invBtn:hover{background:#3a3226}
.invNote{font-size:12px; color:#9a9283}
/* grab prompts */
#reticle.on{border-color:#ff5a4a!important; box-shadow:0 0 0 1px rgba(255,90,74,.35)}
#reticle.on:after{background:#ff5a4a}
#grabVig{position:fixed; inset:0; pointer-events:none; opacity:0; z-index:7; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(70,6,4,.35) 85%, rgba(40,0,0,.6) 100%)}
#grabmsg{position:fixed; left:50%; bottom:22%; transform:translateX(-50%); z-index:8; display:none; text-align:center; font-family:"Courier New",monospace; color:#d8d2c4; cursor:pointer; text-shadow:1px 1px 0 #000}
#grabmsg .qKey{position:relative; display:inline-grid; place-items:center}
#grabmsg .qKey b{position:absolute; font-size:18px; font-weight:normal; min-width:30px; padding:5px 7px; border:1px solid #6b6357; background:rgba(20,16,12,.7); color:#e6e0d0; letter-spacing:1px}
#grabmsg .qKey svg .trk{fill:none; stroke:rgba(26,22,18,.75); stroke-width:3}
#grabmsg .qKey svg .arc{fill:none; stroke:#c9a24a; stroke-width:3}
#grabmsg.low .qKey svg .arc{stroke:#b03a2a}
#grabmsg.pulse .qKey b{border-color:#e6e0d0; color:#fff; background:rgba(60,50,36,.8)}
#grabmsg.wrong .qKey b{border-color:#b03a2a}
#grabmsg .qMeter{height:4px; margin:0 auto; width:48px; background:#1a1612; border:1px solid #6b6357}
#grabmsg .qMeter i{display:block; height:100%; background:#c9a24a}
@keyframes qshake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 8px))}75%{transform:translateX(calc(-50% + 8px))}}
#qteResult{position:fixed; left:50%; top:38%; transform:translate(-50%,-50%) scale(.9); z-index:9; font:bold 28px "Courier New",monospace; letter-spacing:6px; text-shadow:2px 2px 0 #000; opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; white-space:nowrap}
#qteResult.show{opacity:1; transform:translate(-50%,-50%) scale(1)}
#qteResult.ok{color:#9ed08a} #qteResult.bad{color:#ff5a4a}
/* title, controls, setup and the in-simulation menu: the game's own look */
body.menu .hud, body.menu #panel, body.menu #toggle, body.menu #help, body.menu #result, body.menu #dead, body.menu #replaybar, body.menu #touch, body.menu #tags, body.menu #toBuildBtn, body.menu #prompt, body.menu #searchbar, body.menu #toast, body.menu #inv, body.menu #grabVig, body.menu #qteResult, body.menu #grabmsg{display:none!important}
#mm{position:fixed; inset:0; z-index:30; font-family:"Courier New",monospace; color:#d8d2c4; background:radial-gradient(ellipse at 50% 45%, rgba(4,5,8,.2) 0%, rgba(4,5,8,.75) 70%, rgba(2,2,4,.95) 100%)}
#mm[hidden]{display:none}
.mmScreen{position:absolute; inset:0; padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); box-sizing:border-box}
.mmScreen[hidden]{display:none}
#mmTitle{display:grid; place-content:center; justify-items:center; gap:36px; text-align:center}
.mmLogo span{display:block; font-size:clamp(44px,10vw,92px); letter-spacing:.32em; color:#e6e0d0; text-shadow:0 0 24px rgba(160,20,10,.45), 3px 3px 0 #000; padding-left:.32em}
.mmLogo small{display:block; font-size:clamp(12px,2.2vw,16px); letter-spacing:.6em; color:#c9a24a; margin-top:6px; padding-left:.6em}
.mmButtons{display:grid; gap:10px; width:min(280px,80vw)}
.mmButtons button,.mmBack,.go{font:inherit; letter-spacing:.3em; font-size:16px; padding:12px 18px; color:#e6e0d0; background:rgba(14,11,8,.82); border:1px solid #6b5c3e; cursor:pointer}
.mmButtons button:hover,.mmButtons button:focus-visible,.mmBack:hover,.go:hover,.go:focus-visible{border-color:#e8c77a; color:#fff; background:rgba(60,40,20,.85); outline:none}
.mmFoot{color:#857c6b; font-size:12px; letter-spacing:.08em; margin:0}
#mmCtl{display:grid; place-items:center; overflow:auto}
.mmPanel{width:min(980px,100%); background:rgba(10,8,6,.93); border:1px solid #4a4236; border-top:2px solid #8a6a3a; padding:18px 20px; display:grid; gap:14px; box-sizing:border-box}
.mmPanel h2,.suTop h1{margin:0; font-size:20px; letter-spacing:.35em; color:#e8c77a; font-weight:normal}
.ctlCols{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; align-items:start}
.ctlCols table{border-collapse:collapse; width:100%; font-size:12.5px}
.ctlCols caption{text-align:left; color:#c9a24a; letter-spacing:.15em; padding-bottom:6px; font-size:12px}
.ctlCols th{text-align:left; font-weight:normal; color:#9a9283; padding:4px 8px 4px 0; border-bottom:1px solid #2e2820}
.ctlCols td{color:#e6e0d0; padding:4px 0; border-bottom:1px solid #2e2820}
.mmBack{justify-self:start; font-size:13px; padding:7px 12px; letter-spacing:.2em}
#mmSetup{display:grid; grid-template-columns:210px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto; gap:12px}
.suTop{grid-column:1/-1; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.suTop h1{flex:1; font-size:18px}
#suNav{display:grid; gap:3px; align-content:start; overflow:auto; background:rgba(10,8,6,.88); border:1px solid #3d362c; padding:6px}
.suTab{font:inherit; font-size:13px; text-align:left; padding:8px 10px; color:#b7ad98; background:none; border:1px solid transparent; cursor:pointer; letter-spacing:.04em}
.suTab:hover{color:#e6e0d0}
.suTab[aria-pressed="true"]{color:#fff; border-color:#8a6a3a; background:rgba(60,40,20,.6)}
.suTab:focus-visible,.suBtn:focus-visible,.suCard:focus-visible,.smBtn:focus-visible,.smTog:focus-visible{outline:2px solid #e8c77a; outline-offset:1px}
#suMain{overflow:auto; background:rgba(10,8,6,.88); border:1px solid #3d362c; padding:14px 18px 24px; display:grid; gap:9px; align-content:start}
.suHead h2{margin:0; font-size:18px; letter-spacing:.2em; color:#e8c77a; font-weight:normal}
.suHead p{margin:4px 0 0; color:#9a9283; font-size:12.5px}
.suLabel{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; padding-top:8px; border-top:1px solid #3d362c; color:#c9a24a; letter-spacing:.15em; font-size:12px; text-transform:uppercase}
.suReset{font:inherit; font-size:11px; letter-spacing:.05em; text-transform:none; color:#9a9283; background:none; border:1px solid #3d362c; padding:2px 7px; cursor:pointer}
.suNote{color:#857c6b; font-size:12px; margin:0; line-height:1.45}
.suField{display:grid; grid-template-columns:180px minmax(0,1fr); gap:4px 12px; align-items:center; font-size:13px}
.suField label{color:#b7ad98}
.suField small{grid-column:2; color:#857c6b; font-size:11.5px}
