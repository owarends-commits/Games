<title>Extrecated Character Creator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: a dressing room. The figure stands in the middle on a turntable; the wardrobe of controls is a tabbed
   rail on the left; presets sit at the top of every tab. Same committed dark look as the Map Designer and Item Modeler. */
:root {
  --bg: #0b0d0c; --panel: #131715; --panel2: #1a1f1c; --panel3: #222823; --line: #2c332e; --fg: #dcd6c6; --dim: #8f8d81; --mute: #5d5f57;
  --accent: #b5562c; --accent2: #d07a44; --warn: #c9a23a; --ok: #7fa35a; --cool: #59a6c9;
  --display: "Chakra Petch", "Arial Narrow", sans-serif; --body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 14px; margin: 0; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-block: 8px; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: 372px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
@media (max-width: 900px) { body { overflow: auto; } .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 62vh auto; } .rail { order: 3; max-height: none; } .stage { order: 2; } }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; }
.brand { font-family: var(--display); font-weight: 600; letter-spacing: .08em; font-size: 17px; white-space: nowrap; }
.brand span { color: var(--accent); }
.sep { width: 1px; height: 22px; background: var(--line); }
.grow { flex: 1 1 auto; }
.btn { all: unset; cursor: pointer; padding: 5px 11px; border: 1px solid var(--line); background: var(--panel2); font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #150b05; font-weight: 600; }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .seg button:focus-visible { outline: 2px solid var(--warn); outline-offset: 1px; }
input[type="text"], select, textarea { background: var(--panel2); border: 1px solid var(--line); padding: 4px 7px; min-width: 0; }
textarea { width: 100%; resize: vertical; font-family: var(--mono); font-size: 12px; }
input[type="color"] { width: 30px; height: 24px; border: 1px solid var(--line); background: var(--panel2); padding: 0; cursor: pointer; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
#name { width: 180px; font-family: var(--display); font-size: 15px; letter-spacing: .04em; }

.rail { background: var(--panel); border: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { all: unset; cursor: pointer; padding: 8px 9px 7px; font-family: var(--display); font-weight: 500; font-size: 12.5px; letter-spacing: .08em; color: var(--dim); border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; padding: 10px 12px 18px; display: grid; gap: 14px; align-content: start; }
.pane[hidden] { display: none !important; }
h3 { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .1em; margin: 0; color: var(--accent2); text-transform: uppercase; }
h4 { font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: .08em; margin: 0; color: var(--dim); text-transform: uppercase; }
.sec { display: grid; gap: 8px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 12px; }
details.grp { border: 1px solid var(--line); background: var(--panel2); }
details.grp > summary { cursor: pointer; list-style: none; padding: 6px 9px; font-family: var(--display); font-size: 12.5px; letter-spacing: .07em; display: flex; justify-content: space-between; }
details.grp > summary::after { content: "+"; color: var(--mute); }
details.grp[open] > summary::after { content: "−"; }
details.grp > .body { padding: 4px 9px 10px; display: grid; gap: 7px; }
.sl { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 2px 8px; align-items: center; }
.sl label { font-size: 12.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl output { font-family: var(--mono); font-size: 11.5px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
.sl input { grid-column: 1 / -1; }
.sl.changed label { color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.row label.inl { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { all: unset; cursor: pointer; padding: 4px 9px; border: 1px solid var(--line); background: var(--panel2); font-size: 12.5px; }
.chip:hover { border-color: var(--dim); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: #2a170c; color: #f0c9a8; }
.chip small { color: var(--mute); font-family: var(--mono); font-size: 10.5px; margin-left: 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sw { all: unset; cursor: pointer; width: 22px; height: 22px; border: 1px solid #000; box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--warn); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.card { all: unset; cursor: pointer; padding: 7px 8px; border: 1px solid var(--line); background: var(--panel2); display: grid; gap: 2px; }
.card:hover { border-color: var(--dim); }
.card b { font-weight: 600; font-size: 13px; }
.card small { color: var(--mute); font-size: 11.5px; line-height: 1.3; }
.note { font-size: 12px; color: var(--mute); line-height: 1.45; }
.slot { border: 1px solid var(--line); background: var(--panel2); padding: 8px 9px; display: grid; gap: 7px; }
.slot.off > :not(.slothead) { display: none; }
.slothead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.slothead b { font-family: var(--display); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }
.colors { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.colors label { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--dim); }

.stage { position: relative; background: radial-gradient(ellipse at 50% 38%, #1b201d 0%, #0a0c0b 70%); border: 1px solid var(--line); min-height: 0; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#view.pixel { image-rendering: pixelated; }
.overlay { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); background: rgba(19,23,21,.92); }
.seg button { all: unset; cursor: pointer; padding: 4px 9px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #150b05; }
.readout { position: absolute; right: 10px; top: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); text-align: right; pointer-events: none; line-height: 1.5; font-variant-numeric: tabular-nums; }
.readout b { color: var(--fg); font-weight: 500; }
.hint { position: absolute; left: 10px; bottom: 8px; right: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--mute); pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); color: var(--dim); background: var(--bg); }
.toast { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); background: var(--panel3); border: 1px solid var(--accent); padding: 6px 12px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.saved { display: grid; gap: 5px; }
.savedrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 5px 7px; border: 1px solid var(--line); background: var(--panel2); }
.savedrow b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.savedrow small { display: block; color: var(--mute); font-family: var(--mono); font-size: 10.5px; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">EXTRECATED <span>CHARACTER CREATOR</span></div>
    <div class="sep"></div>
    <input id="name" type="text" value="New character" aria-label="Character name">
    <button class="btn small" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn small" id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <div class="grow"></div>
    <button class="btn small" id="random">Randomize</button>
    <button class="btn primary" id="sendTop">Send to Claude</button>
  </header>

  <aside class="rail">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="pane" id="p-start"></div>
    <div class="pane" id="p-body" hidden></div>
    <div class="pane" id="p-face" hidden></div>
    <div class="pane" id="p-hair" hidden></div>
    <div class="pane" id="p-skin" hidden></div>
    <div class="pane" id="p-clothes" hidden></div>
    <div class="pane" id="p-send" hidden></div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="overlay">
      <div class="seg" id="camSeg"><button data-cam="body" aria-pressed="true">Full body</button><button data-cam="upper">Upper</button><button data-cam="face">Face</button><button data-cam="back">Back</button></div>
      <div class="seg"><button id="spin" aria-pressed="false">Turntable</button><button id="ps1" aria-pressed="false">PS1 look</button></div>
    </div>
    <div class="readout" id="readout"></div>
    <div class="hint">Drag to turn · wheel or pinch to zoom · right-drag to pan · double-click a slider to reset it</div>
    <div class="toast" id="toast"></div>
    <div class="loading" id="loading">Loading the MakeHuman body…</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// =====================================================================================================================
// Data: creator_meta.json (sliders, presets, chunk table) and creator_data.bin (mesh, regions, targets), both made by
// tools/build_creator_data.py from the same MakeHuman data the game's builder uses.
// =====================================================================================================================
let META, BIN;
const chunk = (name) => {
  const c = META.chunks[name]; if (!c) return null;
  const C = { float32: Float32Array, uint16: Uint16Array, int16: Int16Array, uint8: Uint8Array }[c[2]];
  return new C(BIN, c[0], c[1]);
};
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hex2rgb = (h) => { h = (h || "#888888").replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255); };
const deep = (o) => JSON.parse(JSON.stringify(o));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

// =====================================================================================================================
// The character state (what the sliders edit). toSpec() turns it into the dict tools/build_humans.py builds from.
// =====================================================================================================================
const NECKS = ["crew", "v", "collar", "open"];
const PATTERNS = ["cotton", "denim", "plaid", "stripes", "knit", "puffer"];
const HAIR_STYLES = ["bald", "buzz", "short", "tuft", "curly", "bob", "long", "ponytail", "pigtails", "patchy"];
const gar = (color, pattern = "cotton", kw = {}) => Object.assign({ color, pattern }, kw);

function blankState() {
  return {
    name: "New character", id: "new_character", height: 1.72, notes: "",
    macro: { gender: 0.5, age: 0.5, muscle: 0.5, weight: 0.5, height: 0.5, african: 0, asian: 0, caucasian: 1 },
    body: {}, face: {}, head_shape: { shape: "oval", amt: 0 }, expr: {}, extra: {},
    pal: { skin: "#e2bba2", hair: "#4a3424", brows: "", eyes: "#5a4a38", lips: "#b8726c", beard: "", hat: "#8a2a24", tie: "#a8302c" },
    paint: { brow: 1.0, lash: 0.3, lip_full: 0, lip_w: 1.0, hollow: 0, stubble: 0, beard: 0, freckles: false },
    blush: 0.5, pallor: 0, frames: "#3a3632",
    hair: { style: "short", hairline: 7.92, bangs: false, to: 4.4, len: 0.28 },
    acc: [],
    outfit: {
      top: gar("#e6e1d5", "cotton", { sleeve_t: 1.0, hem: 0.5, neck: "crew" }),
      bottom: gar("#3a5578", "denim", { leg_t: 0.97, waist: 1.25, belt: "#4a3022" }),
      shoes: gar("#3a2a20", "cotton", { from_t: 0.9, thick: 0.007 }),
    },
  };
}

// slider id -> {neg, pos} target lists, and target -> [slider id, sign]
const SL = {}, TGT2SL = {};
function indexSliders() {
  for (const part of ["body", "face"]) for (const g of META[part]) for (const s of g.sliders) {
    SL[s.id] = { ...s, part };
    for (const t of s.neg) TGT2SL[t] = [s.id, -1];
    for (const t of s.pos) TGT2SL[t] = [s.id, 1];
  }
}

function toSpec(st) {
  const targets = {};
  const add = (t, w) => { if (Math.abs(w) > 1e-3) targets[t] = +((targets[t] || 0) + w).toFixed(3); };
  for (const part of ["body", "face"]) for (const [id, v] of Object.entries(st[part])) {
    const s = SL[id]; if (!s || Math.abs(v) < 1e-3) continue;
    for (const t of (v < 0 ? s.neg : s.pos)) add(t, Math.abs(v));
  }
  if (st.head_shape.amt > 0.001) add("head/head-" + st.head_shape.shape, st.head_shape.amt);
  for (const [t, w] of Object.entries(st.extra)) add(t, w);
  const pal = {}; for (const [k, v] of Object.entries(st.pal)) if (v) pal[k] = v;
  const face = {};
  const P = st.paint;
  if (P.brow !== 1) face.brow = +P.brow.toFixed(2);
  if (P.lash !== 0.3) face.lash = +P.lash.toFixed(2);
  if (P.lip_full) face.lip_full = +P.lip_full.toFixed(2);
  if (P.lip_w !== 1) face.lip_w = +P.lip_w.toFixed(2);
  if (P.hollow) face.hollow = +P.hollow.toFixed(2);
  if (P.stubble) face.stubble = +P.stubble.toFixed(2);
  if (P.beard) face.beard = +P.beard.toFixed(2);
  if (P.freckles) face.freckles = true;
  const expr = {}; for (const [k, v] of Object.entries(st.expr)) if (v > 0.001) expr[k] = +v.toFixed(2);
  const hair = { style: st.hair.style };
  if (st.hair.style !== "bald") hair.hairline = +st.hair.hairline.toFixed(2);
  if (st.hair.bangs) hair.bangs = true;
  if (["long", "bob"].includes(st.hair.style)) hair.to = +st.hair.to.toFixed(2);
  if (["ponytail", "pigtails"].includes(st.hair.style)) hair.len = +st.hair.len.toFixed(2);
  const macro = {}; for (const [k, v] of Object.entries(st.macro)) macro[k] = +(+v).toFixed(3);
  const sp = { id: st.id, name: st.name, height: +st.height.toFixed(2), macro, targets, pal, face, blush: +st.blush.toFixed(2),
    hair, outfit: JSON.parse(JSON.stringify(st.outfit, (k, v) => k === "_type" ? undefined : v)) };
  if (Object.keys(expr).length) sp.expr = expr;
  if (st.pallor) sp.pallor = +st.pallor.toFixed(2);
  if (st.acc.length) sp.acc = [...st.acc];
  if (st.acc.includes("glasses")) sp.frames = st.frames;
  if (st.macro.age < 0.3) sp.kid = true;
  return sp;
}

// a build_humans spec (the cast, or an earlier export) -> state
function fromSpec(sp) {
  const st = blankState();
  st.name = sp.name || (sp.id || "character").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  st.id = sp.id || "character";
  st.height = sp.height || 1.72;
  Object.assign(st.macro, { gender: 0.5, age: 0.5, muscle: 0.5, weight: 0.5, height: 0.5, african: 0, asian: 0, caucasian: 1 }, sp.macro || {});
  if (sp.macro && (sp.macro.african || sp.macro.asian) && sp.macro.caucasian === undefined) st.macro.caucasian = 0;
  let best = 0;
  for (const [t, w] of Object.entries(sp.targets || {})) {
    const m = t.match(/^head\/head-(oval|round|square|rectangular|triangular|invertedtriangular|diamond)$/);
    if (m) { if (w > best) { best = w; st.head_shape = { shape: m[1], amt: w }; } continue; }
    const hit = TGT2SL[t];
    if (hit) { const s = SL[hit[0]]; st[s.part][hit[0]] = hit[1] * w; }
    else st.extra[t] = w;
  }
  st.expr = { ...(sp.expr || {}) };
  Object.assign(st.pal, { brows: "", beard: "" }, sp.pal || {});
  const f = sp.face || {};
  st.paint = { brow: f.brow ?? 1.0, lash: f.lash ?? 0.3, lip_full: f.lip_full ?? 0, lip_w: f.lip_w ?? 1.0, hollow: f.hollow ?? 0,
    stubble: f.stubble ?? 0, beard: f.beard ?? 0, freckles: !!f.freckles };
  st.blush = sp.blush ?? 0.5; st.pallor = sp.pallor ?? 0;
  st.frames = sp.frames || "#3a3632";
  const h = sp.hair || {};
  st.hair = { style: h.style || "bald", hairline: h.hairline ?? 7.92, bangs: !!h.bangs, to: h.to ?? (h.style === "bob" ? 6.4 : 4.4), len: h.len ?? 0.28 };
  st.acc = [...(sp.acc || [])];
  st.outfit = deep(sp.outfit || {});
  for (const k of Object.keys(st.outfit)) if (st.outfit[k] && st.outfit[k].cut) delete st.outfit[k].cut;
  st.notes = sp.notes || "";
  return st;
}

// =====================================================================================================================
// Presets
// =====================================================================================================================
const BODY_PRESETS = [
  { name: "Average", note: "the middle of every slider", macro: { muscle: 0.5, weight: 0.5, height: 0.5 }, body: {} },
  { name: "Slim", note: "light frame, narrow hips", macro: { muscle: 0.42, weight: 0.3, height: 0.55 }, body: { shoulders: -0.2, hips: -0.2, belly: -0.4 } },
  { name: "Athletic", note: "lean muscle", macro: { muscle: 0.72, weight: 0.42, height: 0.55 }, body: { vshape: 0.4, shoulders: 0.2, belly: -0.5, tone: 0.6 } },
  { name: "Muscular", note: "heavy chest and arms", macro: { muscle: 0.95, weight: 0.6, height: 0.55 }, body: { vshape: 0.6, shoulders: 0.4, pecs: 0.5, arm_mus: 0.4, delts: 0.5, neck_w: 0.4 } },
  { name: "Heavyset", note: "soft and broad", macro: { muscle: 0.4, weight: 0.88, height: 0.5 }, body: { belly: 0.6, dchin: 0.5, hips: 0.2 } },
  { name: "Stocky", note: "short, thick-set", macro: { muscle: 0.65, weight: 0.68, height: 0.3 }, body: { shoulders: 0.35, neck_w: 0.5, neck_len: -0.4, thigh_fat: 0.3 } },
  { name: "Curvy", note: "full hips and bust", macro: { muscle: 0.45, weight: 0.6, height: 0.5 }, body: { hips: 0.55, butt: 0.5, bust: 0.5, waist: 0.2 } },
  { name: "Lanky", note: "tall, long limbs", macro: { muscle: 0.35, weight: 0.28, height: 0.9 }, body: { arm_len: 0.4, fore_len: 0.3, thigh_len: 0.4, neck_len: 0.4, shoulders: -0.15 } },
  { name: "Frail elder", note: "thin, stooped age", macro: { age: 0.95, muscle: 0.2, weight: 0.3, height: 0.4 }, body: { belly: -0.2, tone: -0.6, chest_depth: -0.2 } },
  { name: "Child", note: "about seven years old", macro: { age: 0.12, muscle: 0.5, weight: 0.5, height: 0.5 }, body: {}, height: 1.1 },
  { name: "Teen", note: "about fifteen", macro: { age: 0.36, muscle: 0.48, weight: 0.4, height: 0.55 }, body: {}, height: 1.6 },
  { name: "Gaunt", note: "starved; the ACROSS frame", macro: { muscle: 0.0, weight: 0.0 }, body: { belly: -1.0, shoulders: -0.4 }, face: { cheeks: -1.0 } },
];
const FACE_PRESETS = [
  { name: "Soft round", head: ["round", 0.6], face: { cheeks: 0.5, nose_tip: 0.3, chin_prom: -0.2, eye_size: 0.15 } },
  { name: "Long narrow", head: ["rectangular", 0.5], face: { head_w: -0.3, head_h: 0.3, nose_len: 0.4, chin_h: 0.4, cheeks: -0.3 } },

function sculpt(part, s) {
  const st = S.cur;
  const oneWay = !s.neg.length;
  return slider({ label: s.label, min: oneWay ? 0 : -1, max: 1, get: () => st[part][s.id] || 0, set: (x, v) => { if (Math.abs(v) < 1e-3) delete x[part][s.id]; else x[part][s.id] = v; }, fmt: pct, id: part + "_" + s.id });
}

  const list = store.get("cc_saved", []);
  box.append(el("div", { class: "row" }, el("button", { class: "btn small", onclick: () => { const l = store.get("cc_saved", []).filter(x => x.name !== S.cur.name); l.unshift(deep(S.cur)); store.set("cc_saved", l.slice(0, 40)); renderPanels(); toast("Saved in this browser"); } }, "Save this one here")));
  if (!list.length) box.append(el("p", { class: "note", text: "Characters you save here stay in this browser only. Use SEND to give one to Claude." }));
  for (const c of list) box.append(el("div", { class: "savedrow" }, el("div", {}, el("b", { text: c.name }), el("small", { text: c.id + " · " + c.height.toFixed(2) + " m" })),
    el("button", { class: "btn small", onclick: () => { setState(deep(c)); toast("Loaded " + c.name); } }, "Load"),
    el("button", { class: "btn small", onclick: () => { store.set("cc_saved", store.get("cc_saved", []).filter(x => x.name !== c.name)); renderPanels(); } }, "Delete")));
  return box;
}
let DB = null, sent = [], sentReady = false;
function sentList() {
  const box = el("div", { class: "saved" });
  if (!DB) { box.append(el("p", { class: "note", text: sentReady ? "Sending isn't available in this view. Use Copy instead." : "Connecting…" })); return box; }
  if (!sent.length) box.append(el("p", { class: "note", text: "Nothing sent yet." }));
  for (const d of sent) box.append(el("div", { class: "savedrow" }, el("div", {}, el("b", { text: d.name || d.id }), el("small", { text: (d.spec?.id || d.id) + " · " + new Date(d.sent_at || 0).toLocaleString() })),
    el("button", { class: "btn small", onclick: () => { setState(fromSpec({ ...d.spec, notes: d.notes })); toast("Loaded " + (d.name || d.id)); } }, "Load"),
    el("button", { class: "btn small", onclick: async () => { try { await DB.doc("characters/" + d._id).delete(); } catch (e) { toast("Couldn't remove it: " + e.message); } } }, "Remove")));
  return box;
}
async function sendToClaude() {
  const st = S.cur;
  if (!DB) { activeTab = "send"; buildTabs(); showPane(); toast("Sending isn't available here: use Copy"); return; }
  const spec = toSpec(st);
  const id = (spec.id || "character").replace(/[^a-zA-Z0-9_\-]/g, "_").slice(0, 60) || "character";
  const msg = $("#sendState"); if (msg) msg.textContent = "Sending…";
  try {
    await DB.doc("characters/" + id).set({ id, name: st.name, notes: st.notes || "", spec, state: st, sent_at: Date.now() });
    if (msg) msg.textContent = "Sent. Tell Claude to build “" + st.name + "”.";
    toast("Sent " + st.name + " to Claude");
  } catch (e) { if (msg) msg.textContent = "Couldn't send (" + (e.code || e.message) + "). Use Copy below."; }
}

function randomize() {
  const st = blankState();
  const r = (a = 0, b = 1) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  st.macro = { gender: Math.random() < 0.5 ? r(0, 0.15) : r(0.85, 1), age: r(0.45, 0.9), muscle: r(0.3, 0.75), weight: r(0.25, 0.8), height: r(0.3, 0.7), african: 0, asian: 0, caucasian: 1 };
  const e = Math.random(); if (e < 0.2) { st.macro.african = 1; st.macro.caucasian = 0; } else if (e < 0.35) { st.macro.asian = 1; st.macro.caucasian = 0; }
  st.height = st.macro.gender > 0.5 ? r(1.7, 1.92) : r(1.55, 1.78);
  for (const g of META.face) for (const s of g.sliders) if (Math.random() < 0.35) st.face[s.id] = r(s.neg.length ? -0.6 : 0, 0.6);
  for (const g of META.body) for (const s of g.sliders) if (Math.random() < 0.2) st.body[s.id] = r(-0.4, 0.4);
  st.head_shape = { shape: pick(META.head_shapes), amt: r(0, 0.6) };
  st.pal.skin = st.macro.african ? pick(SKIN_TONES.slice(6, 10)) : pick(SKIN_TONES.slice(0, 6));
  st.pal.hair = pick(HAIR_COLORS); st.pal.eyes = pick(EYE_COLORS.slice(0, 8));
  st.hair = { ...st.hair, ...pick(HAIR_PRESETS).hair };
  if (st.macro.gender > 0.5 && Math.random() < 0.5) st.paint.stubble = r(0.3, 1);
  st.expr = { [pick(Object.keys(META.expr_presets).slice(0, 6))]: r(0.3, 0.8) };
  st.outfit = deep(pick(OUTFIT_PRESETS.slice(0, 11)).o);
  st.name = "Random " + Math.floor(r(100, 999)); st.id = st.name.toLowerCase().replace(/ /g, "_");
  setState(st); toast("Randomized");
}

// =====================================================================================================================
// Boot
// =====================================================================================================================
async function boot() {
  try {
    const [m, b] = await Promise.all([fetch("creator_meta.json").then(r => { if (!r.ok) throw new Error("meta " + r.status); return r.json(); }), fetch("creator_data.wasm").then(r => { if (!r.ok) throw new Error("data " + r.status); return r.arrayBuffer(); })]);
    META = m; BIN = b;
  } catch (e) { $("#loading").textContent = "Couldn't load the body data (" + e.message + "). Reload the page to try again."; return; }
  N = META.n;
  BASEF = chunk("pos");
  REG = chunk("regions"); LIMB = chunk("limb_t"); J_IDX = META.joints;
  PCA_K = META.pca.k; PCA_S = META.pca.scale; PCA_B = chunk("pca_basis"); PCA_C = chunk("pca_coef");
  META.pca.targets.forEach((t, i) => PCA_IDX[t] = i);
  for (const g of ["body", "helper-skirt", "helper-hair", "helper-l-eye", "helper-r-eye"]) {
    const tri = chunk("tri_" + g); const used = new Set(tri); TRIS[g] = { tri, used: Uint32Array.from(used) };
  }
  indexSliders();
  initGL();
  const saved = store.get("cc_current", null);
  S.cur = saved && saved.macro ? Object.assign(blankState(), saved) : fromSpec(META.cast.find(c => c.id === "norah"));
  if (!saved) { S.cur.id = "norah_edit"; S.cur.name = "Norah (copy)"; }
  commit();
  buildTabs(); renderPanels();
  refresh();
  setCam("body");
  $("#loading").remove();
  // the shared store for "Send to Claude"
  (async () => {
    try {
      DB = window.claude ? await window.claude.use("db") : null;
      if (DB) {
        DB.collection("characters").onSnapshot(q => { sent = q.docs.map(d => ({ _id: d.id, ...d.data() })).sort((a, b) => (b.sent_at || 0) - (a.sent_at || 0)); if (activeTab === "send" || activeTab === "start") renderPanels(); },
          () => { DB = null; sentReady = true; renderPanels(); });
      }
    } catch (e) { DB = null; }
    sentReady = true; renderPanels();
  })();
}

$("#undo").addEventListener("click", undo); $("#redo").addEventListener("click", redo);
$("#random").addEventListener("click", randomize);
$("#sendTop").addEventListener("click", () => { activeTab = "send"; store.set("cc_tab", "send"); buildTabs(); showPane(); sendToClaude(); });
$("#name").addEventListener("change", e => change(s => { s.name = e.target.value.trim() || "Character"; }));
$("#camSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setCam(b.dataset.cam); });
$("#spin").addEventListener("click", e => { spinning = !spinning; e.target.setAttribute("aria-pressed", spinning); lastT = 0; if (spinning) requestAnimationFrame(spinLoop); });
$("#ps1").addEventListener("click", e => { ps1 = !ps1; e.target.setAttribute("aria-pressed", ps1); $("#view").classList.toggle("pixel", ps1); resize(); });
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); } else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) { e.preventDefault(); redo(); } });
boot();
</script>
