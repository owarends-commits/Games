    let offset = offsets.find(function(candidate) {

        let pawn = {x: king.x + king.width / 2 + candidate.x - 11, y: king.y + king.height / 2 + candidate.y - 11, width: 22, height: 22};

        return !getCurrentWalls().some(function(wall) { return checkCollision(pawn, wall); }) &&

            !enemies.some(function(enemy) { return enemy.alive && enemy.room === king.room && checkCollision(pawn, enemy); });

    });

function findSlimeKingLanding(king, target) {

    let desiredX = Math.max(25, Math.min(710, target.x - 18));

    let desiredY = Math.max(30, Math.min(500, target.y - 18));

    // Walk backward from the target toward the King's current clear tile until the full body fits.
    for(let step = 0; step <= 12; step++) {

        let progress = step / 12;

        let candidate = {x: desiredX + (king.x - desiredX) * progress, y: desiredY + (king.y - desiredY) * progress, width: king.width, height: king.height};

        if(!getCurrentWalls().some(function(wall) { return checkCollision(candidate, wall); })) return candidate;

    }

    return {x: king.x, y: king.y};

}


function fireSpectralSword(sourceX, sourceY, target, damage = 21, ignoresWalls = false) {

    let targetX = target.x + target.width / 2;

function createPhantomCopies(king) {

    let offsets = [

    for(let offset of offsets) {

        let spawnX = Math.max(45, Math.min(695, king.x + offset.x));

        let spawnY = Math.max(55, Math.min(495, king.y + offset.y));

        // Preserve the arena pattern when it is clear; otherwise use a fully valid open tile.
        if(!roomHasOpenSpace(king.room, spawnX, spawnY, king.width, king.height)) {

            let fallback = randomOpenPosition(king.room, king.width, king.height);

            spawnX = fallback.x;

            spawnY = fallback.y;

function updatePhantomKing(king, target) {

    let healthPercent = king.health / king.maxHealth;

    king.phase = healthPercent <= 0.33 ? 3 : healthPercent <= 0.66 ? 2 : 1;

    if(king.phase === 3 && phantomCopies.filter(function(copy) { return copy.room === king.room; }).length === 0) createPhantomCopies(king);

    let kingCenterX = king.x + king.width / 2;

    let kingCenterY = king.y + king.height / 2;

    king.possessionCooldown--;

    if(king.possessionCooldown <= 0) {

        possessDungeonObject(king);

        king.possessionCooldown = king.phase === 3 ? 96 : 144;

    }

    else {

        let dx = target.x + target.width / 2 - kingCenterX;

        let dy = target.y + target.height / 2 - kingCenterY;

        let distance = Math.hypot(dx, dy) || 1;

        if(distance > 190) moveEnemyWithWallCollision(king, dx / distance * king.speed, dy / distance * king.speed);

    }

    if(king.attackCooldown > 0) king.attackCooldown--;

    else {

        // Phantom King spectral slashes are 10% weaker in both phases.
        let swordDamage = (king.phase === 3 ? 17.85 : 21) * 0.9;

        for(let offset of [-0.16, 0, 0.16]) {

            let targetPoint = {x: target.x + Math.cos(offset) * 80, y: target.y + Math.sin(offset) * 80, width: target.width, height: target.height};

            fireSpectralSword(kingCenterX, kingCenterY, targetPoint, swordDamage, true);

        }

        king.attackCooldown = king.phase === 3 ? 42 : 60;

    }

    if(king.phase === 3) {

        for(let copy of phantomCopies) {

            if(copy.room !== king.room) continue;

            if(!copy.alive) {

                copy.respawnTimer--;

                if(copy.respawnTimer <= 0) {

                    let respawn = randomOpenPosition(copy.room, copy.width, copy.height);

                    copy.x = respawn.x;

                    copy.y = respawn.y;

                    copy.health = copy.maxHealth;

                    copy.alive = true;

                    copy.hitFlash = 0;

                    copy.respawnTimer = 120;

                    copy.attackCooldown = randomBetween(40, 96);

                    copy.teleportCooldown = randomBetween(75, 125);

                    smokeClouds.push({x: copy.x + copy.width / 2, y: copy.y + copy.height / 2, life: 24});

                }

                continue;

            }

            copy.teleportCooldown--;

            if(copy.teleportCooldown <= 0) {

                let blink = randomOpenPosition(copy.room, copy.width, copy.height);

                copy.x = blink.x;

                copy.y = blink.y;

                copy.teleportCooldown = randomBetween(90, 145);

                smokeClouds.push({x: copy.x + copy.width / 2, y: copy.y + copy.height / 2, life: 18});

            }

            copy.attackCooldown--;

            if(copy.attackCooldown <= 0) {

                // The expanded clone pack loses 20% of its former shot damage, plus the King's 10% nerf.
                fireSpectralSword(copy.x + copy.width / 2, copy.y + copy.height / 2, target, 8.925 * copy.damageMultiplier * 0.9, true);

                // 25% slower than the former 58-86 frame firing cadence.
                copy.attackCooldown = randomBetween(77, 115);

            }

        }

    }

}

function updateForgemaster(master, target) {

            for(let line = 0; line < 3; line++) {

                dy * dy

        );


        if(enemy.type === "mage") {

            // Mages prefer a comfortable casting distance instead of charging in.

            if(enemy.attackTimer <= 0 && distance > 300) {

                moveEnemyWithWallCollision(enemy, (dx / distance) * enemy.speed * 1.25, (dy / distance) * enemy.speed * 1.25);

            }

            if(enemy.attackTimer <= 0 && distance < 225) {

                moveEnemyWithWallCollision(enemy, -(dx / distance) * enemy.speed * 1.45, -(dy / distance) * enemy.speed * 1.45);

            }

            if(enemy.attackTimer <= 0 && distance >= 225 && distance <= 300) {

                let strafe = Math.sin(Date.now() * 0.003 + enemy.x) >= 0 ? 1 : -1;

                moveEnemyWithWallCollision(enemy, -dy / distance * enemy.speed * 0.55 * strafe, dx / distance * enemy.speed * 0.55 * strafe);

            }

            let mageCenterX = enemy.x + enemy.width / 2;

            let mageCenterY = enemy.y + enemy.height / 2;

            let playerCenterX = target.x + target.width / 2;

            let playerCenterY = target.y + target.height / 2;

            if(distance <= enemy.attackRange && enemy.attackCooldown <= 0 && hasClearShot(mageCenterX, mageCenterY, playerCenterX, playerCenterY)) {

                enemy.attackTimer = 24;

                enemy.attackCooldown = Math.round(ENEMY_ATTACK_COOLDOWN * (enemy.attackCooldownScale || 1));

            }

            if(enemy.attackTimer > 0) {

                enemy.attackTimer--;

                if(enemy.attackTimer === 12) {

                    let angle = Math.atan2(dy, dx);

                    playSfx("enemyAttack");

                    enemyProjectiles.push({

                        x: enemy.x + enemy.width / 2,

                        y: enemy.y + enemy.height / 2,

                        vx: Math.cos(angle) * enemy.projectileSpeed,

                        vy: Math.sin(angle) * enemy.projectileSpeed,

                        damage: Math.round(enemy.projectileDamage * ENEMY_DAMAGE_MULTIPLIER),

                        color: enemy.projectileColor,

                        effect: enemy.effect,

                        sourceType: enemy.type,

                        life: 115

                    });

                }

            }

            if(enemy.attackCooldown > 0) enemy.attackCooldown--;

            if(enemy.hitFlash > 0) enemy.hitFlash--;

            continue;

        }


        // Non-mage enemies now fight from range as well, so survival is about
        // dodging and blocking shots instead of absorbing contact damage.
        if(enemy.attackTimer <= 0 && distance > 290) {

            moveEnemyWithWallCollision(enemy, (dx / distance) * enemy.speed * 1.2, (dy / distance) * enemy.speed * 1.2);

        }

        if(enemy.attackTimer <= 0 && distance < 205) {

            moveEnemyWithWallCollision(enemy, -(dx / distance) * enemy.speed * 1.2, -(dy / distance) * enemy.speed * 1.2);

        }

        if(enemy.attackTimer <= 0 && distance >= 205 && distance <= 290) {

            let strafe = Math.sin(Date.now() * 0.003 + enemy.y) >= 0 ? 1 : -1;

            moveEnemyWithWallCollision(enemy, -dy / distance * enemy.speed * 0.42 * strafe, dx / distance * enemy.speed * 0.42 * strafe);

        }

        let enemyCenterX = enemy.x + enemy.width / 2;

        let enemyCenterY = enemy.y + enemy.height / 2;

        let targetCenterX = target.x + target.width / 2;

        let targetCenterY = target.y + target.height / 2;

        if(distance <= 420 && enemy.attackCooldown <= 0 && hasClearShot(enemyCenterX, enemyCenterY, targetCenterX, targetCenterY)) {

            enemy.attackTimer = 18;

            enemy.attackCooldown = Math.round(ENEMY_ATTACK_COOLDOWN * (enemy.attackCooldownScale || 1));

        }

        if(enemy.attackTimer > 0) {

            enemy.attackTimer--;

            if(enemy.attackTimer === 8) {

                let angle = Math.atan2(dy, dx);

                let baseDamage = enemy.damageByHealth ? enemy.projectileDamage + (1 - player.health / player.maxHealth) * 18 : enemy.projectileDamage;

                let damage = Math.round(baseDamage * ENEMY_DAMAGE_MULTIPLIER);

                playSfx("enemyAttack");

                enemyProjectiles.push({x: enemyCenterX, y: enemyCenterY, originX: enemyCenterX, originY: enemyCenterY, vx: Math.cos(angle) * enemy.projectileSpeed, vy: Math.sin(angle) * enemy.projectileSpeed, damage: damage, color: enemy.projectileColor, effect: enemy.effect, sourceType: enemy.type, life: enemy.effect === "boomerang" ? 125 : 105});

                if(enemy.type === "voidStalker") {

                    let blink = randomOpenPosition(currentRoom, enemy.width, enemy.height);

                    enemy.x = blink.x;

                    enemy.y = blink.y;

                }

            }

        }


        if(enemy.attackCooldown > 0) {

            enemy.attackCooldown--;

        }


        if(enemy.hitFlash > 0) {

            enemy.hitFlash--;

        }

    }

}


// ======================================================
// DAMAGE PLAYER
// ======================================================

function healPlayer(amount) {

    let healingMultiplier = playerClass === "battlemage" ? 1.25 : 1;

    player.health = Math.min(player.maxHealth, player.health + amount * healingMultiplier);

}

function damagePlayer(amount = 15) {

    // The Paladin's Divine Intervention fully negates incoming damage while its meter lasts.
    if(playerClass === "battlemage" && battlemageShieldTimer > 0) return false;

    // Mage dashes are an evasive blink: no damage can land until the dash ends.
    if(playerClass === "mage" && dashTimer > 0) {

        return false;

    }


    if(damageCooldown > 0) {

        return false;

    }


    // Bruiser, Cyborg and Mage have sturdy shields; Stealth trades defense for speed.
    if(shieldRaised) {

        let block = playerClass === "hero" ? 0.5 : playerClass === "stealth" ? 0.25 : 0.75;

        amount *= 1 - Math.min(0.9, block + build.shieldBonus);

    }

    if(playerClass === "hero") {

        syncHeroModeFloor();

        if(heroModeTimer > 0) amount *= 0.5;

        // Record only health that could actually be lost, not overkill damage.
        heroModeHealthLostThisFloor += Math.min(amount, player.health);

    }

    player.health -= amount;

    spawnCombatParticles(player.x + player.width / 2, player.y + player.height / 2, true);

    playSfx("playerHit");

    damageCooldown = 48;

    screenShake = 10;


    if(player.health <= 0) {

        if(playerClass === "hero" && !heroModeUsedThisFloor) {

            heroModeUsedThisFloor = true;

            heroModeTimer = 300;

            player.health = Math.min(player.maxHealth, heroModeHealthLostThisFloor * 0.5);

            playSfx("playerAbility");

            return true;

        }

        player.health = 0;

        deathTimer = 100;

        gameState = "dying";

    }

    return true;

}


// ======================================================
// DAMAGE COOLDOWN
// ======================================================

function updateDamageCooldown() {

    syncHeroModeFloor();

    for(let index = frostQueenSpikes.length - 1; index >= 0; index--) {

        let spikePatch = frostQueenSpikes[index];

        spikePatch.life--;

        if(spikePatch.room === currentRoom && checkCollision(player, spikePatch)) {

            spikePatch.damageTimer--;

            if(spikePatch.damageTimer <= 0) {

                damagePlayer(7);

                spikePatch.damageTimer = 40;

            }

        }

        if(spikePatch.life <= 0) frostQueenSpikes.splice(index, 1);

    }

    if(heroModeTimer > 0) heroModeTimer--;

    if(frozenFloorTimer > 0) frozenFloorTimer--;

    else { frostSlideVX = 0; frostSlideVY = 0; }

    for(let index = voidZones.length - 1; index >= 0; index--) {

        let zone = voidZones[index];

        zone.life--;

        if(zone.room === currentRoom && checkCollision(player, zone) && zone.life % 30 === 0) damagePlayer(8);

        if(zone.life <= 0) voidZones.splice(index, 1);

    }

    for(let index = voidwalkerPortals.length - 1; index >= 0; index--) {

        let vortex = voidwalkerPortals[index];

        vortex.life--;

        if(vortex.room === currentRoom) {

            let playerCenterX = player.x + player.width / 2;

            let playerCenterY = player.y + player.height / 2;

            let pullX = vortex.x - playerCenterX;

            let pullY = vortex.y - playerCenterY;

            let pullDistance = Math.hypot(pullX, pullY) || 1;

            // The Voidwalker's vortex now drags from farther out and accelerates sharply near its core.
            if(pullDistance < 180) {

                let pullStrength = (1 - pullDistance / 180) * 1.55;

                let oldX = player.x;

                let oldY = player.y;

                player.x += pullX / pullDistance * pullStrength;

                player.y += pullY / pullDistance * pullStrength;

                if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) {

                    player.x = oldX;

                    player.y = oldY;

                }

            }

            if(pullDistance < 19) {

                vortex.damageTimer--;

                if(vortex.damageTimer <= 0) {

                    damagePlayer(6);

                    vortex.damageTimer = 48;

                }

            }

        }

        if(vortex.life <= 0) voidwalkerPortals.splice(index, 1);

    }

    if(parryTimer > 0) parryTimer--;

    if(parryShineTimer > 0) parryShineTimer--;

    if(bruiserChargeCooldown > 0) bruiserChargeCooldown--;

    if(battlemageChargeCooldown > 0) battlemageChargeCooldown--;

    if(battlemageShieldTimer > 0) {

        battlemageShieldTimer--;

        battlemageDivineIntervention = Math.max(0, battlemageDivineIntervention - 1);

        if(battlemageDivineIntervention <= 0) {

            battlemageShieldTimer = 0;

            battlemageDivineCooldown = 120;

        }

    }

    else if(battlemageDivineCooldown > 0) {

        battlemageDivineCooldown--;

        if(battlemageDivineCooldown <= 0) battlemageDivineIntervention = battlemageDivineInterventionMax;

    }

    else if(battlemageDivineIntervention < battlemageDivineInterventionMax) {

        battlemageDivineIntervention = Math.min(battlemageDivineInterventionMax, battlemageDivineIntervention + 1);

    }

    for(let index = iceWalls.length - 1; index >= 0; index--) {

        iceWalls[index].life--;

        if(iceWalls[index].hitFlash > 0) iceWalls[index].hitFlash--;

        if(iceWalls[index].life <= 0) iceWalls.splice(index, 1);

    }

    for(let index = bruiserShockwaves.length - 1; index >= 0; index--) {

        bruiserShockwaves[index].life--;

        if(bruiserShockwaves[index].life <= 0) bruiserShockwaves.splice(index, 1);

    }

    for(let enemy of enemies) {

        if(enemy.pulseTimer > 0) enemy.pulseTimer--;

        if(enemy.runTimer > 0) enemy.runTimer--;

    }

    if(musketeerOverheatTimer > 0) musketeerOverheatTimer--;

    if(musketeerReloadTimer > 0) {

        musketeerReloadTimer--;

        if(musketeerReloadTimer === 0) musketeerAmmo = musketeerAmmoMax;

    }

    if(musketeerTeleportCooldown > 0) musketeerTeleportCooldown--;

    if(musketeerSmokeTimer > 0) musketeerSmokeTimer--;

    if(playerSlowTimer > 0) playerSlowTimer--;

    if(frostBeamSlowTimer > 0) frostBeamSlowTimer--;

    if(playerBleedTimer > 0) {

        playerBleedTimer--;

        if(playerBleedTimer % 45 === 0) damagePlayer(3);

    }

    if(playerBurnTimer > 0) {

        playerBurnTimer--;

        if(playerBurnTimer % 40 === 0) damagePlayer(3);

    }

    if(playerFreezeTimer > 0) playerFreezeTimer--;

    if(darknessTimer > 0) darknessTimer--;

    for(let index = toxicClouds.length - 1; index >= 0; index--) {

        let cloud = toxicClouds[index];

        cloud.life--;

        if(cloud.spreading && cloud.width < cloud.maxSize) {

            cloud.x -= 0.22;

            cloud.y -= 0.22;

            cloud.width += 0.44;

            cloud.height += 0.44;

        }

        if(cloud.room === currentRoom && checkCollision(player, cloud)) {

            playerSlowTimer = Math.max(playerSlowTimer, 30);

            if(cloud.spreading) {

                cloud.damageTimer--;

                if(cloud.damageTimer <= 0) {

                    damagePlayer(cloud.broodPlague ? 4 : 3);

                    cloud.damageTimer = 45;

                }

            }

        }

        if(cloud.life <= 0) toxicClouds.splice(index, 1);

    }

    if(ouchFireTimer > 0) ouchFireTimer--;

    if(ninjaSmokeRunTimer > 0) {

        ninjaSmokeRunTimer--;

        ninjaSmokeTrailTimer--;

        if(ninjaSmokeTrailTimer <= 0) {

            smokeClouds.push({x: player.x + player.width / 2, y: player.y + player.height / 2, life: 24});

            ninjaSmokeTrailTimer = 4;

        }

    }

    if(damageCooldown > 0) {

        damageCooldown--;

    }


    if(screenShake > 0) {

        screenShake--;

    }

    if(movementLightning > 0) {

        movementLightning--;

    }

}


// ======================================================
// COBBLESTONE FLOOR
// ======================================================

function drawFloor() {

    // Square 16px tiles and a restricted palette keep the dungeon readable at a glance.
    let scenePalette = getDungeonScene(currentRoom).floor;

    ctx.fillStyle = scenePalette[0];

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let isVoid = getDungeonScene(currentRoom).wallMaterial === "moonRock";

    if(isVoid) {

        // A fixed star field and soft nebulae make the Void feel like a broken slice of space.
        for(let star = 0; star < 92; star++) {

            let x = (star * 89 + currentRoom * 47) % canvas.width;

            let y = (star * 53 + currentRoom * 29) % canvas.height;

            let twinkle = 0.45 + 0.35 * Math.sin(Date.now() * 0.004 + star);

            ctx.fillStyle = star % 7 === 0 ? "rgba(202, 154, 255, " + twinkle + ")" : "rgba(210, 230, 255, " + twinkle + ")";

            ctx.fillRect(x, y, star % 9 === 0 ? 2 : 1, star % 9 === 0 ? 2 : 1);

        }

        for(let nebula = 0; nebula < 5; nebula++) {

            let x = (nebula * 173 + currentRoom * 31) % 760 + 20;

            let y = (nebula * 107 + currentRoom * 19) % 540 + 30;

            ctx.fillStyle = "rgba(91, 48, 167, 0.16)";

            ctx.beginPath();

            ctx.arc(x, y, 34 + nebula * 9, 0, Math.PI * 2);

            ctx.fill();

        }

        for(let pool of waterPools[currentRoom] || []) {

            ctx.fillStyle = "#100518";

            ctx.fillRect(pool.x, pool.y, pool.width, pool.height);

            ctx.strokeStyle = "#5b1b86";

            ctx.lineWidth = 2;

            ctx.strokeRect(pool.x + 1, pool.y + 1, pool.width - 2, pool.height - 2);

            for(let swirl = 0; swirl < 4; swirl++) {

                let sx = pool.x + 12 + ((swirl * 29 + Date.now() / 55) % Math.max(12, pool.width - 24));

                let sy = pool.y + pool.height / 2 + Math.sin(Date.now() * 0.006 + swirl * 2.1) * 7;

                ctx.strokeStyle = swirl % 2 ? "#9d38c5" : "#3a155c";

                ctx.lineWidth = 3;

                ctx.beginPath();

                ctx.arc(sx, sy, 7 + swirl, 0.2, Math.PI * 1.7);

                ctx.stroke();

            }

            for(let bubble = 0; bubble < 3; bubble++) {

                let bx = pool.x + 15 + (bubble * 37) % Math.max(18, pool.width - 30);

                let by = pool.y + 8 + ((Date.now() / 28 + bubble * 13) % Math.max(10, pool.height - 16));

                ctx.fillStyle = "rgba(211, 125, 255, 0.72)";

                ctx.beginPath();

                ctx.arc(bx, by, 2 + bubble % 2, 0, Math.PI * 2);

                ctx.fill();

            }

        }

        return;

    }

    for(let y = 16; y < canvas.height; y += 16) {

        for(let x = 16; x < canvas.width; x += 16) {

            let shade = (x / 16 + y / 16) % 3;

            ctx.fillStyle = shade === 0 ? scenePalette[1] : shade === 1 ? scenePalette[2] : scenePalette[3];

            ctx.fillRect(x, y, 14, 14);

            ctx.fillStyle = "#46516a";

            ctx.fillRect(x, y, 14, 2);

            ctx.fillStyle = "#1b2234";

            ctx.fillRect(x, y + 12, 14, 2);

        }

    }

    let waterPalette = getDungeonScene(currentRoom).water || ["#174c70", "#276f95", "#65b9d4"];

    for(let pool of waterPools[currentRoom] || []) {

        ctx.fillStyle = waterPalette[0];

        ctx.fillRect(pool.x, pool.y, pool.width, pool.height);

        ctx.fillStyle = waterPalette[1];

        ctx.fillRect(pool.x + 4, pool.y + 4, pool.width - 8, 5);

        ctx.fillStyle = waterPalette[2];

        for(let wave = 0; wave < pool.width - 10; wave += 18) {

            let offset = (Math.floor(Date.now() / 240) + wave / 18) % 2 === 0 ? 0 : 3;

            ctx.fillRect(pool.x + 6 + wave, pool.y + 15 + offset, 10, 2);

        }

    }

}


// ======================================================
// WALLS
// ======================================================

function drawWalls() {

    let isOldWood = getDungeonScene(currentRoom).wallMaterial === "oldWood";

    let isGlacier = getDungeonScene(currentRoom).wallMaterial === "glacier";

    let isMoonRock = getDungeonScene(currentRoom).wallMaterial === "moonRock";

    for(let wall of rooms[currentRoom] || []) {

        if(isMoonRock) {

            // Cratered, low-saturation lunar stone with purple mineral seams.
            ctx.fillStyle = "#242536";

            ctx.fillRect(wall.x, wall.y, wall.width, wall.height);

            ctx.fillStyle = "#444659";

            ctx.fillRect(wall.x + 3, wall.y + 3, wall.width - 6, wall.height - 6);

            for(let rockY = wall.y + 8; rockY < wall.y + wall.height - 5; rockY += 17) {

                for(let rockX = wall.x + 8 + ((rockY / 17) % 2) * 7; rockX < wall.x + wall.width - 5; rockX += 23) {

                    ctx.fillStyle = "#2b2c3c";

                    ctx.beginPath();

                    ctx.arc(rockX, rockY, 4, 0, Math.PI * 2);

                    ctx.fill();

                    ctx.fillStyle = "#67697b";

                    ctx.fillRect(rockX - 2, rockY - 3, 3, 2);

                }

            }

            ctx.fillStyle = "#79549a";

            for(let seamX = wall.x + 11; seamX < wall.x + wall.width - 4; seamX += 31) ctx.fillRect(seamX, wall.y + 4, 2, wall.height - 8);

            ctx.fillStyle = "#797b91";

            ctx.fillRect(wall.x, wall.y, wall.width, 3);

            ctx.fillStyle = "#11121d";

            ctx.fillRect(wall.x, wall.y + wall.height - 3, wall.width, 3);

            continue;

        }

        if(isGlacier) {

            // Layered blue-white ice shelves replace masonry throughout the Frozen Abyss.
            ctx.fillStyle = "#143c52";

            ctx.fillRect(wall.x, wall.y, wall.width, wall.height);

            ctx.fillStyle = "#4d91ab";

            ctx.fillRect(wall.x + 2, wall.y + 3, wall.width - 4, wall.height - 6);

            for(let iceY = wall.y + 6; iceY < wall.y + wall.height - 4; iceY += 13) {

                let offset = Math.floor((iceY - wall.y) / 13) % 2 ? 11 : 0;

                ctx.fillStyle = "#8ed1df";

                ctx.fillRect(wall.x + 3, iceY, wall.width - 6, 5);

                ctx.fillStyle = "#e9fbff";

                ctx.fillRect(wall.x + 5 + offset, iceY + 1, Math.max(5, wall.width - 18), 2);

                ctx.fillStyle = "#25657f";

                for(let crackX = wall.x + 9 - offset; crackX < wall.x + wall.width - 5; crackX += 27) {

                    ctx.fillRect(crackX, iceY + 5, 2, 7);

                    ctx.fillRect(crackX - 3, iceY + 9, 5, 2);

                }

            }

            ctx.fillStyle = "#f4ffff";

            ctx.fillRect(wall.x, wall.y, wall.width, 3);

            ctx.fillStyle = "#0a2638";

            ctx.fillRect(wall.x, wall.y + wall.height - 3, wall.width, 3);

            continue;

        }

        if(isOldWood) {

            // Weathered horizontal planks, dark seams, and knots replace the stonework.
            ctx.fillStyle = "#241712";

            ctx.fillRect(wall.x, wall.y, wall.width, wall.height);

            for(let plankY = wall.y + 3; plankY < wall.y + wall.height - 3; plankY += 10) {

                let seamOffset = Math.floor((plankY - wall.y) / 10) % 2 ? 12 : 0;

                ctx.fillStyle = "#5a3825";

                ctx.fillRect(wall.x + 2, plankY, wall.width - 4, 7);

                ctx.fillStyle = "#795038";

                ctx.fillRect(wall.x + 3, plankY + 1, wall.width - 6, 2);

                ctx.fillStyle = "#301e17";

                for(let seamX = wall.x + 10 - seamOffset; seamX < wall.x + wall.width - 3; seamX += 24) ctx.fillRect(seamX, plankY, 2, 7);

                if((plankY / 10 + wall.x / 10) % 3 === 0) ctx.fillRect(wall.x + 7 + seamOffset, plankY + 4, 4, 2);

            }

            ctx.fillStyle = "#a0704e";

            ctx.fillRect(wall.x, wall.y, wall.width, 3);

            ctx.fillStyle = "#130d0b";

            ctx.fillRect(wall.x, wall.y + wall.height - 3, wall.width, 3);

            continue;

        }

        ctx.fillStyle = "#17202c";


        ctx.fillRect(

            wall.x,

            wall.y,

            wall.width,

            wall.height

        );


        ctx.fillStyle = "#53627a";


        ctx.fillRect(

            wall.x,

            wall.y,

            wall.width,

            4

        );


        ctx.fillStyle = "#0d131d";


        ctx.fillRect(

            wall.x,

            wall.y +

            wall.height -

            5,

            wall.width,

            4

        );

        // Chunky stone blocks make walls read as classic 8-bit dungeon cover.
        ctx.fillStyle = "#344258";

        for(let blockY = wall.y + 6; blockY < wall.y + wall.height - 5; blockY += 12) {

            let offset = Math.floor((blockY - wall.y) / 12) % 2 ? 6 : 0;

            for(let blockX = wall.x + 4 - offset; blockX < wall.x + wall.width - 3; blockX += 12) {

                ctx.fillRect(blockX, blockY, 9, 8);

            }

        }

    }

}


function drawFrozenAbyssSnow() {

    if(getDungeonScene(currentRoom).name !== "FROZEN ABYSS") return;

    // Deterministic flakes keep falling continuously without allocating particles every frame.
    let time = Date.now() * 0.035;

    ctx.save();

    for(let flake = 0; flake < 62; flake++) {

        let drift = Math.sin(time * 0.55 + flake * 2.17) * 15;

        let x = (flake * 83 + drift + 40) % (canvas.width + 24) - 12;

        let y = (time * (0.55 + (flake % 5) * 0.09) + flake * 71) % (canvas.height + 18) - 9;

        let size = flake % 7 === 0 ? 3 : 2;

        ctx.fillStyle = flake % 4 === 0 ? "rgba(224, 249, 255, 0.9)" : "rgba(255, 255, 255, 0.68)";

        ctx.fillRect(x, y, size, size);

    }

    ctx.restore();

}


// ======================================================
// TORCHES
// ======================================================

function drawTorches() {


    let roomTorches =

        torches[currentRoom];


    let flicker =

        Math.sin(

            Date.now() *

            0.01

        ) * 2;


    for(let torch of roomTorches) {


        let x = torch.x;

        let y = torch.y;


        ctx.fillStyle = "#777";


        ctx.fillRect(

            x - 5,

            y - 5,

            10,

            10

        );


        ctx.fillStyle = "#5a3218";


        ctx.fillRect(

            x - 4,

            y - 4,

            8,

            20

        );


        ctx.fillStyle =

            "rgba(255,150,30,0.4)";


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            16 +

            flicker,

            0,

            Math.PI * 2

        );


        ctx.fill();


        ctx.fillStyle = "#ff9d22";


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            8 +

            flicker,

            0,

            Math.PI * 2

        );


        ctx.fill();


        ctx.fillStyle = "#fff1a8";


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            4,

            0,

            Math.PI * 2

        );


        ctx.fill();

    }

}


// ======================================================
// DOORS
// ======================================================

function drawDoors() {

    function drawWoodenDoor(x, y, width, height) {

        ctx.fillStyle = "#3f2113";

        ctx.fillRect(x, y, width, height);

        ctx.fillStyle = "#8a4a24";

        ctx.fillRect(x + 3, y + 3, width - 6, height - 6);

        ctx.strokeStyle = "#c28343";

        ctx.lineWidth = 2;

        for(let plank = 1; plank < 5; plank++) {

            let plankY = y + plank * height / 5;

            ctx.beginPath();

            ctx.moveTo(x + 3, plankY);

            ctx.lineTo(x + width - 3, plankY);

            ctx.stroke();

        }

        ctx.fillStyle = "#e1b355";

        ctx.fillRect(x + width / 2 - 3, y + height / 2, 6, 6);

    }

    if(currentRoom > 1) drawWoodenDoor(0, 230, 50, 140);

    // The final active room also presents a real doorway before the next level is created.
    if(currentRoom > 0) drawWoodenDoor(750, 230, 50, 140);

}

function drawHealingShrines() {

    for(let shrine of healingShrines) {

        if(shrine.room !== currentRoom) continue;

        let x = shrine.x;

        let y = shrine.y;

        ctx.save();

        ctx.globalAlpha = shrine.used ? 0.38 : 1;

        ctx.fillStyle = "#27394b";

        ctx.fillRect(x + 5, y + 28, 48, 38);

        ctx.fillStyle = "#5a80a0";

        ctx.fillRect(x + 10, y + 20, 38, 10);

        ctx.fillStyle = shrine.used ? "#66707a" : "#65e6cf";

        ctx.fillRect(x + 25, y + 14, 9, 40);

        ctx.fillRect(x + 16, y + 28, 27, 10);

        ctx.fillStyle = "#d9fff4";

        ctx.fillRect(x + 27, y + 25, 5, 13);

        ctx.restore();

        if(!shrine.used) {

            ctx.save();

            ctx.textAlign = "center";

            ctx.fillStyle = "#b8fff0";

            ctx.font = "11px Courier New";

            ctx.fillText("HEALING SHRINE", x + 29, y - 7);

            ctx.restore();

        }

    }

    for(let wall of iceWalls) {

        if(wall.room !== currentRoom) continue;

        let horizontal = wall.width >= wall.height;

        let spireCount = wall.spireCount || Math.max(2, Math.round(Math.max(wall.width, wall.height) / 30));

        let segment = (horizontal ? wall.width : wall.height) / spireCount;

        let isHeartTrap = wall.source === "heart";

        ctx.save();

        ctx.shadowColor = isHeartTrap ? "#ff3655" : "#9af4ff";

        ctx.shadowBlur = isHeartTrap ? 14 : 8;

        for(let spire = 0; spire < spireCount; spire++) {

            let jag = 0.72 + Math.sin((wall.spireSeed || 0) + spire * 2.14) * 0.14;

            let start = spire * segment;

            let end = start + segment + 1;

            let tip = start + segment * 0.5;

            ctx.beginPath();

            if(horizontal) {

                ctx.moveTo(wall.x + start, wall.y + wall.height);

                ctx.lineTo(wall.x + tip, wall.y - wall.height * jag);

                ctx.lineTo(wall.x + end, wall.y + wall.height);

            }

            else {

                ctx.moveTo(wall.x + wall.width, wall.y + start);

                ctx.lineTo(wall.x - wall.width * jag, wall.y + tip);

                ctx.lineTo(wall.x + wall.width, wall.y + end);

            }

            ctx.closePath();

            ctx.fillStyle = isHeartTrap ? "rgba(135, 42, 83, 0.94)" : "rgba(104, 211, 246, 0.92)";

            ctx.fill();

            ctx.strokeStyle = isHeartTrap ? "#ff7390" : "#eaffff";

            ctx.lineWidth = 2;

            ctx.stroke();

            ctx.beginPath();

            if(horizontal) {

                ctx.moveTo(wall.x + tip, wall.y - wall.height * jag + 4);

                ctx.lineTo(wall.x + tip - segment * 0.18, wall.y + wall.height - 3);

            }

            else {

                ctx.moveTo(wall.x - wall.width * jag + 4, wall.y + tip);

                ctx.lineTo(wall.x + wall.width - 3, wall.y + tip - segment * 0.18);

            }

            ctx.strokeStyle = isHeartTrap ? "#ffb0c0" : "#d9ffff";

            ctx.lineWidth = 1;

            ctx.stroke();

        }

        if(wall.destructible) {

            let barWidth = Math.min(58, Math.max(32, wall.width));

            let barX = wall.x + wall.width / 2 - barWidth / 2;

            let barY = wall.y - 13;

            ctx.fillStyle = "rgba(8, 20, 32, 0.9)";

            ctx.fillRect(barX, barY, barWidth, 5);

            ctx.fillStyle = wall.hitFlash > 0 ? "#ffffff" : "#77eaff";

            ctx.fillRect(barX + 1, barY + 1, (barWidth - 2) * Math.max(0, wall.health / wall.maxHealth), 3);

        }

        ctx.restore();

    }

}

function drawTraps() {

    for(let pit of firePits) {

        if(pit.room !== currentRoom) continue;

        // Small soot-black hole at rest, then a compact orange eruption.
        ctx.fillStyle = "#1a1314";

        ctx.fillRect(pit.x + 2, pit.y + 7, pit.width - 4, pit.height - 9);

        ctx.fillStyle = "#4b3027";

        ctx.fillRect(pit.x + 4, pit.y + 5, pit.width - 8, 3);

        if(pit.eruptionTimer > 0) {

            let flameHeight = 18 + Math.sin(Date.now() * 0.05) * 5;

            ctx.fillStyle = "#ff652f";

            ctx.shadowColor = "#ff9f3d";

            ctx.shadowBlur = 14;

            ctx.fillRect(pit.x + 5, pit.y + 20 - flameHeight, pit.width - 10, flameHeight);

            ctx.fillStyle = "#ffe175";

            ctx.fillRect(pit.x + 9, pit.y + 21 - flameHeight, pit.width - 18, flameHeight - 6);

        }

    }

    for(let rock of fallingRocks) {

        if(rock.room !== currentRoom) continue;

        // Cracked tile directly below a large ceiling stone.
        ctx.save();

        ctx.strokeStyle = "#1c1820";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(rock.x + 3, rock.y + 18);

        ctx.lineTo(rock.x + 14, rock.y + 12);

        ctx.lineTo(rock.x + 20, rock.y + 23);

        ctx.lineTo(rock.x + 33, rock.y + 16);

        ctx.moveTo(rock.x + 17, rock.y + 12);

        ctx.lineTo(rock.x + 17, rock.y + 5);

        ctx.stroke();

        let dropProgress = rock.fallingTimer > 0 ? 1 - rock.fallingTimer / 28 : 0;

        let stoneY = rock.y - 44 + dropProgress * 44;

        if(rock.impactTimer > 0) stoneY = rock.y - 2;

        ctx.fillStyle = rock.impactTimer > 0 ? "#b6a996" : "#625b59";

        ctx.fillRect(rock.x + 3, stoneY + 5, 30, 22);

        ctx.fillStyle = "#938985";

        ctx.fillRect(rock.x + 7, stoneY + 2, 21, 8);

        ctx.fillStyle = "#3a3637";

        ctx.fillRect(rock.x + 9, stoneY + 16, 7, 4);

        ctx.fillRect(rock.x + 22, stoneY + 12, 5, 7);

        ctx.restore();

    }

    for(let wall of arrowWalls) {

        if(wall.room !== currentRoom) continue;

        // Small dark firing holes set into the left and right dungeon walls.
        ctx.fillStyle = "#11151d";

        ctx.fillRect(19, wall.y - 5, 8, 10);

        ctx.fillRect(773, wall.y - 5, 8, 10);

        ctx.fillStyle = "#687483";

        ctx.fillRect(20, wall.y - 7, 6, 2);

        ctx.fillRect(774, wall.y - 7, 6, 2);

    }

    for(let shot of arrowWallShots) {

        if(shot.room !== currentRoom) continue;

        ctx.save();

        ctx.translate(shot.x, shot.y);

        ctx.rotate(Math.atan2(shot.vy, shot.vx));

        ctx.strokeStyle = "#1a1512";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(-8, 0);

        ctx.lineTo(8, 0);

        ctx.stroke();

        ctx.fillStyle = "#c7d0d6";

        ctx.beginPath();

        ctx.moveTo(9, 0);

        ctx.lineTo(4, -3);

        ctx.lineTo(4, 3);

        ctx.fill();

        ctx.restore();

    }

}

function drawDungeonHeart(enemy) {

    const x = enemy.x;
    const y = enemy.y;
    const cx = x + enemy.width / 2;
    const cy = y + enemy.height / 2;
    const pulse = 1 + Math.sin(Date.now() * 0.009) * 0.08;

    ctx.save();

    // Eight bloody tendrils visibly pin the Heart to every side of the dungeon.
    const anchors = [
        {x: 18, y: cy - 88}, {x: 18, y: cy + 88},
        {x: canvas.width - 18, y: cy - 88}, {x: canvas.width - 18, y: cy + 88},
        {x: cx - 95, y: 18}, {x: cx + 95, y: 18},
        {x: cx - 95, y: canvas.height - 18}, {x: cx + 95, y: canvas.height - 18}
    ];

    ctx.strokeStyle = "#641327";
    ctx.lineWidth = 7;
    ctx.shadowColor = "#d4233e";
    ctx.shadowBlur = 11;

    for(let index = 0; index < anchors.length; index++) {

        let anchor = anchors[index];
        let bend = Math.sin(Date.now() * 0.004 + index * 1.7) * 34;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.bezierCurveTo(cx + (anchor.x - cx) * 0.32 + bend, cy + (anchor.y - cy) * 0.18 - bend, cx + (anchor.x - cx) * 0.70 - bend, cy + (anchor.y - cy) * 0.80 + bend, anchor.x, anchor.y);
        ctx.stroke();

        ctx.strokeStyle = "#b92037";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = "#641327";
        ctx.lineWidth = 7;

    }

    ctx.shadowBlur = 14;
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    ctx.translate(-cx, -cy);

    // A recognizably anatomical, pulsating human heart.
    ctx.fillStyle = enemy.hitFlash > 0 ? "#ffffff" : "#7b1730";
    ctx.beginPath();
    ctx.moveTo(cx, y + 24);
    ctx.bezierCurveTo(x + 20, y - 2, x - 2, y + 28, x + 20, y + 62);
    ctx.bezierCurveTo(x + 34, y + 84, cx, y + 94, cx, y + 94);
    ctx.bezierCurveTo(x + 78, y + 85, x + 108, y + 55, x + 86, y + 26);
    ctx.bezierCurveTo(x + 72, y + 7, x + 58, y + 15, cx, y + 30);
    ctx.fill();

    ctx.fillStyle = "#b92c42";
    ctx.beginPath();
    ctx.moveTo(x + 38, y + 24);
    ctx.bezierCurveTo(x + 20, y + 42, x + 39, y + 68, cx, y + 79);
    ctx.lineTo(x + 51, y + 37);
    ctx.fill();
    ctx.fillStyle = "#e14d5b";
    ctx.fillRect(x + 27, y + 44, 8, 5);
    ctx.fillRect(x + 58, y + 61, 9, 4);
    ctx.fillRect(x + 43, y + 78, 7, 3);

    // Arteries rise above the heart and connect into the fleshy mass.
    ctx.strokeStyle = "#9e2036";
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(x + 40, y + 29);
    ctx.lineTo(x + 35, y + 5);
    ctx.moveTo(x + 56, y + 29);
    ctx.lineTo(x + 66, y + 8);
    ctx.stroke();
    ctx.strokeStyle = "#ec5a64";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Oversized yellow eye watches from the middle of the living organ.
    ctx.shadowColor = "#ffd94f";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#f4c847";
    ctx.beginPath();
    ctx.ellipse(cx, y + 50, 20, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff4b1";
    ctx.beginPath();
    ctx.ellipse(cx - 3, y + 47, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#271022";
    ctx.fillRect(cx - 3, y + 39, 6, 22);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(cx - 2, y + 42, 2, 4);

    ctx.restore();
}


function drawDungeonGauntlet() {

    if(!dungeonHeartAftermath || dungeonHeartAftermath.state !== "gauntlet") return;

    let relic = dungeonHeartAftermath;

    let glow = 0.65 + Math.sin(Date.now() * 0.012) * 0.35;

    ctx.save();

    ctx.shadowColor = "#f5c94a";

    ctx.shadowBlur = 20 + glow * 12;

    ctx.fillStyle = "rgba(255, 205, 78, " + (0.18 + glow * 0.18) + ")";

    ctx.beginPath();

    ctx.arc(relic.x + 14, relic.y + 14, 25, 0, Math.PI * 2);

    ctx.fill();

    // Five plated fingers and a rune-palm make the Gauntlet clearly collectible.
    ctx.fillStyle = "#d8a93c";

    ctx.fillRect(relic.x + 7, relic.y + 10, 14, 13);

    for(let finger = 0; finger < 5; finger++) ctx.fillRect(relic.x + 5 + finger * 4, relic.y + 3 + (finger % 2), 3, 10);

    ctx.fillStyle = "#fff2a6";

    ctx.fillRect(relic.x + 11, relic.y + 13, 6, 6);

    ctx.fillRect(relic.x + 8, relic.y + 23, 11, 4);

    ctx.restore();

    ctx.fillStyle = "#fff4bd";

    ctx.font = "bold 16px Courier New";

    ctx.textAlign = "center";

    ctx.fillText("ARONION GAUNTLET", relic.x + 14, relic.y - 18);

    ctx.font = "14px Arial";

    ctx.fillText("Press E to claim it", relic.x + 14, relic.y + 47);

    ctx.textAlign = "left";

    ctx.save();

    ctx.textAlign = "center";

    ctx.fillStyle = "rgba(8, 3, 14, 0.84)";

    ctx.fillRect(118, 70, 564, 62);

    ctx.strokeStyle = "#bb5b74";

    ctx.lineWidth = 2;

    ctx.strokeRect(118, 70, 564, 62);

    ctx.fillStyle = "#ffd6df";

    ctx.font = "bold 17px Georgia";

    ctx.fillText("THE DUNGEON HEART", 400, 94);

    ctx.font = "16px Arial";

    ctx.fillText("You have bested me and thus the gauntlet is yours", 400, 119);

    ctx.restore();

}

function drawEliteAura(enemy) {

    let x = enemy.x, y = enemy.y, w = enemy.width, h = enemy.height;

    let time = Date.now() * 0.004;

    ctx.save();

    if(enemy.type === "arcaneKnight") {

        ctx.strokeStyle = "#6ddfff"; ctx.shadowColor = "#42bfff"; ctx.shadowBlur = 12; ctx.lineWidth = 2;
        for(let rune = 0; rune < 3; rune++) { let angle = time + rune * Math.PI * 2 / 3; ctx.strokeRect(x + w / 2 + Math.cos(angle) * 23 - 3, y + h / 2 + Math.sin(angle) * 20 - 3, 6, 6); }

    } else if(enemy.type === "bloodHarbinger") {

        ctx.fillStyle = "#ff4059"; ctx.shadowColor = "#ff183a"; ctx.shadowBlur = 12;
        for(let orb = 0; orb < 5; orb++) { let angle = time * 1.4 + orb * Math.PI * 2 / 5; ctx.beginPath(); ctx.arc(x + w / 2 + Math.cos(angle) * 22, y + h / 2 + Math.sin(angle) * 18, 3, 0, Math.PI * 2); ctx.fill(); }

    } else if(enemy.type === "voidStalker") {

        ctx.globalAlpha = 0.38 + Math.sin(time * 3) * 0.16; ctx.fillStyle = "#16091f"; ctx.shadowColor = "#8c4dff"; ctx.shadowBlur = 15;
        ctx.fillRect(x - 5, y + 8, w + 10, h - 3);
        for(let mote = 0; mote < 4; mote++) ctx.fillRect(x + 4 + mote * 7, y - 5 - ((Math.floor(time * 9) + mote * 5) % 17), 2, 4);

    } else if(enemy.type === "ironclad") {

        ctx.strokeStyle = "#cf7a3e"; ctx.shadowColor = "#ff9b45"; ctx.shadowBlur = 9; ctx.lineWidth = 2;
        for(let vent = 0; vent < 3; vent++) { let rise = (time * 13 + vent * 9) % 18; ctx.beginPath(); ctx.moveTo(x + 8 + vent * 13, y + 8); ctx.lineTo(x + 5 + vent * 13, y + 8 - rise); ctx.stroke(); }

    } else if(enemy.type === "plagueDoctor") {

        ctx.fillStyle = "rgba(113, 238, 86, 0.32)"; ctx.shadowColor = "#8dff63"; ctx.shadowBlur = 13;
        for(let puff = 0; puff < 3; puff++) { let rise = (time * 10 + puff * 11) % 22; ctx.beginPath(); ctx.arc(x + 8 + puff * 8, y + 9 - rise, 4 + puff, 0, Math.PI * 2); ctx.fill(); }

    } else if(enemy.type === "frostRevenant") {

        ctx.fillStyle = "#e9ffff"; ctx.shadowColor = "#a9f5ff"; ctx.shadowBlur = 8;
        for(let flake = 0; flake < 5; flake++) { let fall = (time * 12 + flake * 8) % (h + 18); ctx.fillRect(x - 7 + flake * 11, y - 8 + fall, 2, 3); }

    } else if(enemy.type === "soulCollector") {

        ctx.strokeStyle = "#b9dcff"; ctx.shadowColor = "#9abfff"; ctx.shadowBlur = 10; ctx.lineWidth = 2;
        for(let soul = 0; soul < 3; soul++) { let angle = time + soul * Math.PI * 2 / 3; ctx.beginPath(); ctx.arc(x + w / 2 + Math.cos(angle) * 20, y + h / 2 + Math.sin(angle) * 17, 4, 0, Math.PI * 2); ctx.stroke(); }

    } else if(enemy.type === "riftMage") {

        ctx.strokeStyle = "#ff8bea"; ctx.shadowColor = "#9e4cff"; ctx.shadowBlur = 12; ctx.lineWidth = 2;
        for(let rift = 0; rift < 2; rift++) { let angle = time + rift * Math.PI; ctx.beginPath(); ctx.ellipse(x + w / 2 + Math.cos(angle) * 21, y + h / 2 + Math.sin(angle) * 14, 7, 4, angle, 0, Math.PI * 2); ctx.stroke(); }

    } else if(enemy.type === "chainbound") {

        ctx.strokeStyle = "#a9adb7"; ctx.shadowColor = "#ff4f54"; ctx.shadowBlur = 8; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x - 13, y + h - 8); ctx.lineTo(x - 5, y + h - 3); ctx.lineTo(x - 14, y + h + 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + w + 8, y + h - 8); ctx.lineTo(x + w + 15, y + h - 3); ctx.lineTo(x + w + 7, y + h + 3); ctx.stroke();

    } else if(enemy.type === "mirrorKnight") {

        ctx.strokeStyle = "rgba(224, 255, 255, 0.65)"; ctx.shadowColor = "#baffff"; ctx.shadowBlur = 12; ctx.lineWidth = 2;
        ctx.strokeRect(x - 4, y - 4, w + 8, h + 8);

    } else if(enemy.type === "jesterKing") {

        ctx.fillStyle = "#ffd34f"; ctx.shadowColor = "#ff76d6"; ctx.shadowBlur = 10;
        for(let card = 0; card < 4; card++) { let angle = time * 1.5 + card * Math.PI / 2; ctx.save(); ctx.translate(x + w / 2 + Math.cos(angle) * 23, y + h / 2 + Math.sin(angle) * 18); ctx.rotate(angle); ctx.fillRect(-3, -5, 6, 10); ctx.restore(); }

    } else if(enemy.type === "dungeonWarden") {

        ctx.fillStyle = "rgba(115, 226, 255, 0.3)"; ctx.shadowColor = "#7de7ff"; ctx.shadowBlur = 18;
        ctx.fillRect(x - 5, y + 17, w + 10, h - 16);
        for(let crack = 0; crack < 3; crack++) ctx.fillRect(x + 9 + crack * 12, y + 20 + ((Math.floor(time * 7) + crack * 5) % 14), 2, 8);

    }

    ctx.restore();

}

function drawSlimePuddles() {

    for(let pool of forgeLavaPools) {

        if(pool.room !== currentRoom) continue;

        ctx.save();

        ctx.globalAlpha = 0.7;

        ctx.fillStyle = "#d64b1f";

        ctx.shadowColor = "#ff9a32";

        ctx.shadowBlur = 16;

        ctx.beginPath();

        ctx.arc(pool.x, pool.y, pool.radius, 0, Math.PI * 2);

        ctx.fill();

        ctx.fillStyle = "#ffd15a";

        ctx.beginPath();

        ctx.arc(pool.x - pool.radius * 0.2, pool.y - pool.radius * 0.2, Math.max(4, pool.radius * 0.45), 0, Math.PI * 2);

        ctx.fill();

        ctx.restore();

    }

    for(let line of forgeLavaLines) {

        if(line.room !== currentRoom) continue;

        ctx.save();

        ctx.strokeStyle = "#ff6b25";

        ctx.shadowColor = "#ffb347";

        ctx.shadowBlur = 16;

        ctx.lineWidth = 11;

        ctx.beginPath();

        ctx.moveTo(line.x - 52, line.y);

        ctx.lineTo(line.x + 52, line.y);

        ctx.stroke();

        ctx.restore();

    }

    for(let cloud of toxicClouds) {

        if(cloud.room !== currentRoom) continue;

        ctx.save();

        ctx.globalAlpha = Math.min(0.62, cloud.life / 180);

        ctx.fillStyle = cloud.heartTrap ? "#641733" : (cloud.broodPlague ? "#9e1833" : "#5cae3c");

        ctx.shadowColor = cloud.heartTrap ? "#ff3158" : (cloud.broodPlague ? "#ff4057" : "#91ef5e");

        ctx.shadowBlur = 12;

        ctx.beginPath();

        ctx.arc(cloud.x + cloud.width / 2, cloud.y + cloud.height / 2, cloud.width / 2, 0, Math.PI * 2);

        ctx.fill();

        if(cloud.heartTrap) {

            let centerX = cloud.x + cloud.width / 2;

            let centerY = cloud.y + cloud.height / 2;

            let pulse = 0.75 + Math.sin(cloud.life * 0.25) * 0.2;

            ctx.globalAlpha = Math.min(0.9, cloud.life / 120);

            ctx.strokeStyle = "#ff7188";

            ctx.lineWidth = 2;

            ctx.beginPath();

            for(let point = 0; point < 10; point++) {

                let angle = -Math.PI / 2 + point * Math.PI * 2 / 10;

                let radius = (point % 2 === 0 ? cloud.width * 0.35 : cloud.width * 0.18) * pulse;

                let px = centerX + Math.cos(angle) * radius;

                let py = centerY + Math.sin(angle) * radius;

                if(point === 0) ctx.moveTo(px, py);

                else ctx.lineTo(px, py);

            }

            ctx.closePath();

            ctx.stroke();

            ctx.fillStyle = "#ffd0d9";

            ctx.beginPath();

            ctx.arc(centerX, centerY, 4 + pulse * 2, 0, Math.PI * 2);

            ctx.fill();

        }

        ctx.restore();

    }

    for(let puddle of slimePuddles) {

        if(puddle.room !== currentRoom) continue;

        ctx.save();

        ctx.globalAlpha = Math.min(0.78, puddle.life / 120);

        ctx.fillStyle = "#2c8755";

        ctx.fillRect(puddle.x, puddle.y + 6, puddle.width, puddle.height - 10);

        ctx.fillStyle = "#69d878";

        ctx.fillRect(puddle.x + 7, puddle.y + 5, puddle.width - 15, 5);

        ctx.fillStyle = "#b0ff9e";

        ctx.fillRect(puddle.x + 10, puddle.y + 9, 7, 2);

        ctx.restore();

    }

}

function getEliteName(type) {

    return type.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\b\w/g, function(letter) { return letter.toUpperCase(); });

}


function drawBossHazards() {

    ctx.save();

    for(let spikePatch of frostQueenSpikes) {

        if(spikePatch.room !== currentRoom) continue;

        let warning = Math.min(1, (200 - spikePatch.life) / 18);

        ctx.globalAlpha = 0.35 + warning * 0.55;

        ctx.fillStyle = "#3f95ba";

        ctx.fillRect(spikePatch.x, spikePatch.y + 18, spikePatch.width, 16);

        ctx.fillStyle = "#c8f9ff";

        for(let spikeX = spikePatch.x + 2; spikeX < spikePatch.x + spikePatch.width - 2; spikeX += 10) {

            let height = 13 + ((spikeX - spikePatch.x) / 10 % 2) * 7;

            ctx.beginPath();

            ctx.moveTo(spikeX, spikePatch.y + 31);

            ctx.lineTo(spikeX + 4, spikePatch.y + 31 - height);

            ctx.lineTo(spikeX + 8, spikePatch.y + 31);

            ctx.fill();

        }

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(spikePatch.x + 3, spikePatch.y + 26, spikePatch.width - 9, 2);

    }

    for(let pustule of broodPustules) {

        if(pustule.room !== currentRoom) continue;

        let swell = 1 + Math.sin(Date.now() * 0.006 + pustule.pulse) * 0.16;

        ctx.fillStyle = "#7d1831";

        ctx.shadowColor = "#ff304b";

        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(pustule.x, pustule.y, pustule.size * swell, 0, Math.PI * 2);

        ctx.fill();

        ctx.fillStyle = "#ff8d87";

        ctx.beginPath();

        ctx.arc(pustule.x - pustule.size * 0.22, pustule.y - pustule.size * 0.22, Math.max(3, pustule.size * 0.34), 0, Math.PI * 2);

        ctx.fill();

    }

    for(let clone of frostQueenClones) {

        if(clone.room !== currentRoom) continue;

        let pulse = 1 + Math.sin(Date.now() * 0.012 + clone.x) * 0.13;

        ctx.globalAlpha = 0.85;

        // Frostbound sentries are ice towers rather than humanoid clones.
        ctx.fillStyle = "#164a70";

        ctx.beginPath();

        ctx.moveTo(clone.x + 6, clone.y + 50);

        ctx.lineTo(clone.x + 10, clone.y + 18);

        ctx.lineTo(clone.x + 20, clone.y + 9);

        ctx.lineTo(clone.x + 31, clone.y + 18);

        ctx.lineTo(clone.x + 35, clone.y + 50);

        ctx.fill();

        ctx.fillStyle = "#78cbe2";

        ctx.fillRect(clone.x + 11, clone.y + 20, 18, 29);

        ctx.fillStyle = "#c9f8ff";

        ctx.fillRect(clone.x + 14, clone.y + 23, 4, 22);

        ctx.fillRect(clone.x + 24, clone.y + 28, 3, 17);

        // Azure crystal at the tower peak: this is the exact firing point.
        ctx.shadowColor = "#159eff";

        ctx.shadowBlur = 16;

        ctx.fillStyle = "#1679d3";

        ctx.beginPath();

        ctx.moveTo(clone.x + 20, clone.y + 1 - pulse * 2);

        ctx.lineTo(clone.x + 27, clone.y + 8);

        ctx.lineTo(clone.x + 20, clone.y + 16);

        ctx.lineTo(clone.x + 13, clone.y + 8);

        ctx.fill();

        ctx.fillStyle = "#8ff5ff";

        ctx.fillRect(clone.x + 18, clone.y + 5, 4, 7);

        ctx.shadowBlur = 0;

    }

    for(let portal of voidwalkerPortals) {

        if(portal.room !== currentRoom) continue;

        let spin = Date.now() * 0.006 + portal.x * 0.1;

        ctx.globalAlpha = 0.92;

        ctx.shadowColor = "#9a50ff";

        ctx.shadowBlur = 18;

        // Concentric, offset arcs and orbiting sparks give this a true spatial-vortex read.
        for(let ring = 0; ring < 3; ring++) {

            ctx.strokeStyle = ring === 0 ? "#e1c6ff" : ring === 1 ? "#8e4cff" : "#33206f";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.arc(portal.x, portal.y, 10 + ring * 7, spin * (ring + 1), spin * (ring + 1) + Math.PI * 1.45);

            ctx.stroke();

        }

        ctx.fillStyle = "#090712";

        ctx.beginPath();

        ctx.arc(portal.x, portal.y, 9, 0, Math.PI * 2);

        ctx.fill();

        ctx.fillStyle = "#bfeaff";

        for(let spark = 0; spark < 5; spark++) {

            let sparkAngle = spin * 1.7 + spark * Math.PI * 2 / 5;

            let sparkRadius = 16 + (spark % 2) * 6;

            ctx.fillRect(portal.x + Math.cos(sparkAngle) * sparkRadius - 1, portal.y + Math.sin(sparkAngle) * sparkRadius - 1, 3, 3);

        }

        ctx.shadowBlur = 0;

    }

    for(let zone of voidZones) {

        if(zone.room !== currentRoom) continue;

        ctx.globalAlpha = 0.45;

        ctx.fillStyle = "#12051f";

        ctx.fillRect(zone.x, zone.y, zone.width, zone.height);

        ctx.strokeStyle = "#8f45dd";

        ctx.strokeRect(zone.x, zone.y, zone.width, zone.height);

    }

    ctx.restore();

}

function drawEnemies() {

    drawPhantomCopies();

    drawBossHazards();

    for(let enemy of enemies) {


        if(

            enemy.room !== currentRoom ||

            !enemy.alive

        ) {

            continue;

        }

        // Copies are rendered by drawPhantomCopies, not as generic enemies.
        if(enemy.isPhantomCopy) continue;


        if(enemy.runTimer > 0) {

            ctx.save();

            ctx.translate(0, Math.sin(Date.now() * 0.035 + enemy.x) * 2);

        }

        if(enemy.type === "mage") {

            drawMage(enemy);

        }

        else if(enemy.type === "frostboundQueen") {

            drawFrostboundQueen(enemy);

        }

        else if(enemy.type === "voidwalker") {

            drawVoidwalker(enemy);

        }

        else if(enemy.type === "voidSpider") {

            drawVoidSpider(enemy);

        }

        else if(enemy.type === "dungeonHeart") {

            drawDungeonHeart(enemy);

        }

        else if(["skeletalMage", "slimeKin", "skeletonArcher", "demonSpawn", "bonecaster", "bloodCultist", "eye", "plagueRat", "flameWraith", "shadowArcher", "crystalCrawler", "voidPriest", "mimicMage", "frostWitch", "cursedKnight", "lantern", "rottingShaman", "hive", "bloodOrb", "jester", "plagueMinion", "arcaneKnight", "bloodHarbinger", "voidStalker", "ironclad", "plagueDoctor", "frostRevenant", "soulCollector", "riftMage", "chainbound", "mirrorKnight", "jesterKing", "dungeonWarden", "arcaneCore"].includes(enemy.type)) {

            drawNewEnemy(enemy);

        }

        else if(enemy.type === "slimeKing") {

            drawSlimeKing(enemy);

        }

        else if(enemy.type === "phantomKing") {

            drawPhantomKing(enemy, false);

        }

        else if(enemy.type === "broodmother") {

            drawBroodmother(enemy);

        }

        else if(enemy.type === "broodEgg") {

            drawBroodEgg(enemy);

        }

        else if(enemy.type === "forgemaster") {

            drawForgemaster(enemy);

        }

        else if(enemy.type === "slimePawn") {

            drawSlimePawn(enemy);

        }

        else if(enemy.type === "boss") {

            drawBoss(enemy);

        }

        else if(enemy.type === "raider") {

            drawRaider(enemy);

        }

        else if(enemy.type === "slime") {

            drawSlime(enemy);

        }

        else {

            drawOrc(enemy);

        }

        if(enemy.runTimer > 0) ctx.restore();

        if(enemy.frozenTimer > 0) {

            ctx.fillStyle = "rgba(130, 220, 255, 0.45)";

            ctx.fillRect(enemy.x - 2, enemy.y - 2, enemy.width + 4, enemy.height + 4);

            ctx.strokeStyle = "#c9f6ff";

            ctx.strokeRect(enemy.x - 2, enemy.y - 2, enemy.width + 4, enemy.height + 4);

        }

        if(enemy.pulseTimer > 0) {

            ctx.fillStyle = "rgba(61, 192, 255, " + (enemy.pulseTimer / 18) + ")";

            ctx.fillRect(enemy.x - 2, enemy.y - 2, enemy.width + 4, enemy.height + 4);

        }


        // Health bar

        ctx.fillStyle = "black";


        ctx.fillRect(

            enemy.x,

            enemy.y - 10,

            enemy.width,

            5

        );


        ctx.fillStyle = "red";


        ctx.fillRect(

            enemy.x,

            enemy.y - 10,

            enemy.width *

            (

                enemy.health /

                enemy.maxHealth

            ),

            5

        );

        if(enemy.isElite) {

            ctx.save();

            ctx.textAlign = "center";

            ctx.font = "bold 10px Courier New";

            ctx.fillStyle = "#ffd86b";

            ctx.shadowColor = "#2b1c0d";

            ctx.shadowBlur = 3;

            ctx.fillText(getEliteName(enemy.type), enemy.x + enemy.width / 2, enemy.y - 14);

            ctx.restore();

        }


        // Attack animation

        if(enemy.attackTimer > 0) {


            let centerX =

                enemy.x +

                enemy.width / 2;


            let centerY =

                enemy.y +

                enemy.height / 2;


            ctx.strokeStyle =

                enemy.attackTimer > 12

                    ? "orange"

                    : "red";


            ctx.lineWidth = 4;


            ctx.beginPath();


            ctx.arc(

                centerX,

                centerY,

                28 +

                (

                    25 -

                    enemy.attackTimer

                ),

                0,

                Math.PI * 2

            );


            ctx.stroke();


            ctx.lineWidth = 1;

        }

    }

}

function drawKnight() {

    let x = player.x;

    let y = player.y;

    let flashing = damageCooldown > 0 && Math.floor(damageCooldown / 5) % 2 === 0;

    ctx.save();

    ctx.fillStyle = "rgba(0,0,0,0.3)";

    ctx.beginPath();

    ctx.ellipse(x + 14, y + 29, 13, 4, 0, 0, Math.PI * 2);

    ctx.fill();

    // Split boots, cape, and layered tunic make the Hero readable at a glance.
    ctx.fillStyle = "#302016";

    ctx.fillRect(x + 6, y + 25, 6, 4);

    ctx.fillRect(x + 17, y + 25, 6, 4);

    ctx.fillStyle = flashing ? "#ffffff" : "#17422f";

    ctx.beginPath();

    ctx.moveTo(x + 5, y + 13);

    ctx.lineTo(x + 23, y + 13);

    ctx.lineTo(x + 25, y + 26);

    ctx.lineTo(x + 3, y + 26);

    ctx.fill();

    ctx.fillStyle = flashing ? "#ffffff" : "#2f9e55";

    ctx.fillRect(x + 7, y + 13, 14, 12);

    ctx.fillStyle = "#7b4823";

    ctx.fillRect(x + 6, y + 21, 16, 3);

    ctx.fillStyle = "#f6cf55";

    ctx.fillRect(x + 13, y + 21, 3, 3);

    ctx.fillStyle = "#f2c687";

    ctx.fillRect(x + 7, y + 6, 14, 10);

    ctx.fillStyle = "#e5bd4c";

    ctx.fillRect(x + 6, y + 4, 16, 4);

    ctx.fillRect(x + 5, y + 8, 3, 6);

    ctx.fillStyle = flashing ? "#ffffff" : "#237b40";

    ctx.beginPath();

    ctx.moveTo(x + 3, y + 8);

    ctx.lineTo(x + 14, y - 5);

    ctx.lineTo(x + 25, y + 8);

    ctx.fill();

    ctx.fillStyle = "#27334d";

    ctx.fillRect(x + 9, y + 10, 2, 2);

    ctx.fillRect(x + 17, y + 10, 2, 2);

    // Shield on the off hand. It swings forward and brightens while held up.

    if(shieldRaised) {

        ctx.save();

        ctx.translate(x + player.width / 2, y + player.height / 2);

        ctx.rotate(player.angle);

        ctx.fillStyle = "#b14b32";

        ctx.fillRect(10, -10, 8, 20);

        ctx.fillStyle = "#ffe08a";

        ctx.fillRect(12, -5, 3, 10);

        ctx.restore();

    }

    ctx.fillStyle = "#934930";

    ctx.fillRect(x, y + 16, 7, 10);

    ctx.fillStyle = "#e3c768";

    ctx.fillRect(x + 2, y + 18, 2, 5);

    // A compact sword always points toward the mouse.

    let cx = x + player.width / 2;

    let cy = y + player.height / 2;

    let swingProgress = attackTimer > 0 ? 1 - attackTimer / 15 : 0;

    // Ease the blade through the long attack arc instead of snapping in place.
    let swordSwing = attackTimer > 0 ? -0.78 + swingProgress * 1.56 : 0;

    ctx.translate(cx, cy);

    ctx.rotate(player.angle + swordSwing);

    ctx.strokeStyle = "#dbeeff";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(8, 0);

    ctx.lineTo(62, 0);

    ctx.stroke();

    ctx.strokeStyle = "#e1b847";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(9, -6);

    ctx.lineTo(9, 6);

    ctx.stroke();

    ctx.restore();

}


function drawCyborg() {

    let x = player.x;

    let y = player.y;

    let flashing = damageCooldown > 0 && Math.floor(damageCooldown / 5) % 2 === 0;

    ctx.save();

    ctx.fillStyle = "rgba(0,0,0,0.32)";

    ctx.beginPath();

    ctx.ellipse(x + 14, y + 29, 13, 4, 0, 0, Math.PI * 2);

    ctx.fill();

    // Human-and-machine hybrid: leather on the left, dark plating and exposed wire on the right.
    ctx.fillStyle = "#523c2e";

    ctx.fillRect(x + 4, y + 14, 8, 12);

    ctx.fillStyle = "#151d27";

    ctx.fillRect(x + 16, y + 13, 9, 14);

    ctx.fillStyle = "#9a6a4d";

    ctx.fillRect(x + 6, y + 5, 7, 9);

    ctx.fillStyle = "#243442";

    ctx.fillRect(x + 13, y + 4, 10, 10);

    ctx.fillStyle = "#151b21";

    ctx.fillRect(x + 5, y + 25, 6, 5);

    ctx.fillRect(x + 18, y + 24, 7, 6);

    ctx.strokeStyle = "#4cf4ff";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(x + 18, y + 17);

    ctx.lineTo(x + 23, y + 22);

    ctx.lineTo(x + 20, y + 25);

    ctx.stroke();

    // Luminous coolant tubes weave through the torso, limbs, and neck seams.
    ctx.strokeStyle = "#39dfff";

    ctx.shadowColor = "#1ccaff";

    ctx.shadowBlur = 10;

    ctx.lineWidth = 2;

    for(let tube = 0; tube < 4; tube++) {

        let offset = tube * 4;

        ctx.beginPath();

        ctx.moveTo(x + 7 + offset, y + 15);

        ctx.lineTo(x + 9 + offset, y + 21);

        ctx.lineTo(x + 6 + offset, y + 27);

        ctx.stroke();

    }

    ctx.beginPath();

    ctx.moveTo(x + 17, y + 6);

    ctx.lineTo(x + 20, y + 13);

    ctx.lineTo(x + 24, y + 17);

    ctx.stroke();

    ctx.fillStyle = "#b9ffff";

    ctx.fillRect(x + 11, y + 20, 3, 3);

    ctx.fillRect(x + 19, y + 17, 3, 3);

    ctx.shadowBlur = 0;

    if(flashing) {

        ctx.strokeStyle = "#b8ffff";

        ctx.shadowColor = "#4cf4ff";

        ctx.shadowBlur = 12;

        ctx.beginPath();

        ctx.moveTo(x + 2, y + 11);

        ctx.lineTo(x - 4, y + 5);

        ctx.moveTo(x + 25, y + 18);

        ctx.lineTo(x + 32, y + 23);

        ctx.stroke();

    }

    if(cyborgThrusterActive && cyborgFuel > 0) {

        let flameLength = 13 + Math.sin(Date.now() * 0.05) * 5;

        ctx.save();

        ctx.translate(x + player.width / 2, y + player.height / 2);

        ctx.rotate(player.angle);

        ctx.fillStyle = "#ff6a32";

        ctx.shadowColor = "#ff8a3d";

        ctx.shadowBlur = 14;

        ctx.fillRect(-flameLength - 10, -8, flameLength, 6);

        ctx.fillRect(-flameLength - 10, 3, flameLength, 6);

        ctx.fillStyle = "#ffe27a";

        ctx.fillRect(-flameLength - 6, -6, flameLength - 3, 3);

        ctx.fillRect(-flameLength - 6, 5, flameLength - 3, 3);

        ctx.fillStyle = "#42dfff";

        ctx.fillRect(-12, -6, 6, 4);

        ctx.fillRect(-12, 4, 6, 4);

        ctx.restore();

    }

    ctx.globalAlpha = 1;

        ctx.shadowColor = "#fff0a6";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(13, 0, arcRadius, -0.62, 0.62);

        ctx.stroke();

        ctx.globalAlpha = 1;

    }

    ctx.restore();

    ctx.restore();

}


function drawOwen() {

    let x = player.x;

    let time = Date.now() * 0.012;

    let moving = movementLightning > 0;

    let idleBob = Math.sin(time) * (owenChestBeamActive ? 1.6 : 0.8);

    let robeSway = Math.sin(time * 0.78) * (moving ? 2.2 : 1.1);

    let attackSwing = attackTimer > 0 ? Math.sin((1 - attackTimer / 14) * Math.PI) * 0.55 : 0;

    let y = player.y + idleBob;

    let flashing = damageCooldown > 0 && Math.floor(damageCooldown / 5) % 2 === 0;

    ctx.save();

    ctx.fillStyle = "rgba(0,0,0,0.36)";

    ctx.beginPath();

    ctx.ellipse(x + 17, y + 43, 18 + Math.abs(robeSway), 5, 0, 0, Math.PI * 2);

    ctx.fill();

    // Crimson energy strains against the Warden's body, intensifying while the core beam is active.
    let pulse = 0.55 + Math.sin(Date.now() * 0.012) * 0.45;

    ctx.strokeStyle = "#ff3440";

    ctx.shadowColor = "#ff111c";

    ctx.shadowBlur = 15;

    ctx.lineWidth = 2;

    ctx.globalAlpha = 0.6 + pulse * 0.4;

    for(let arc = 0; arc < 3; arc++) {

        let startX = x + 4 + ((Math.floor(Date.now() / 55) + arc * 11) % 26);

        let startY = y + 8 + ((Math.floor(Date.now() / 70) + arc * 7) % 28);

        ctx.beginPath();

        ctx.moveTo(startX, startY);

        ctx.lineTo(startX - 5 + arc * 4, startY + 7);

        ctx.lineTo(startX + 2, startY + 13);

        ctx.stroke();

    }

    ctx.globalAlpha = 1;

    if(owenFlying) {

        ctx.fillStyle = "#ff4f3f";

        ctx.shadowColor = "#ff813d";

        ctx.shadowBlur = 14;

        ctx.fillRect(x + 5, y + 39, 8, 15);

        ctx.fillRect(x + 21, y + 39, 8, 15);

        ctx.fillStyle = "#ffd35a";

function drawArcaneSummons() {

    for(let summon of arcaneSummons) {

        if(summon.room !== currentRoom) continue;

        ctx.save();

        let now = Date.now();

        let isHawk = summon.type === "hawk" || summon.type === "menagerieHawk";

        let isBear = summon.type === "bear" || summon.type === "menagerieBear";

        let color = summon.color || "#9f74ff";

        let moving = !!summon.moving;

        let stride = moving ? Math.sin(now * 0.024) * 3 : 0;

        let bob = isHawk ? Math.sin(now * 0.009 + summon.x * 0.08) * 3 : moving ? Math.abs(Math.sin(now * 0.024)) * 1.5 : 0;

        let attackScale = summon.attackFlash > 0 ? 1 + summon.attackFlash / 25 : 1;

        let x = summon.x + summon.width / 2;

        let y = summon.y + summon.height / 2 + bob;

        // Bright ground rune keeps every companion readable in crowded rooms.
        ctx.globalAlpha = 0.28;

        ctx.strokeStyle = color;

        ctx.lineWidth = 2;

        ctx.shadowColor = color;

        ctx.shadowBlur = 12;

        ctx.beginPath(); ctx.arc(x, summon.y + summon.height + 2, isBear ? 23 : 13, 0, Math.PI * 2); ctx.stroke();

        ctx.globalAlpha = 1;

        ctx.fillStyle = color;

        if(isHawk) {

            let flap = Math.sin(now * 0.035) * 7;

            // Wide, flapping wings make the hawk visible above the action.
            ctx.beginPath(); ctx.moveTo(x, y + 3); ctx.lineTo(x - 18, y - 4 - flap); ctx.lineTo(x - 7, y + 10); ctx.lineTo(x, y + 7); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x, y + 3); ctx.lineTo(x + 18, y - 4 + flap); ctx.lineTo(x + 7, y + 10); ctx.lineTo(x, y + 7); ctx.fill();

            ctx.fillStyle = "#d9f6ff";
            ctx.beginPath(); ctx.ellipse(x, y + 2, 7 * attackScale, 5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#5b3a9d"; ctx.fillRect(x + 3, y, 2, 2);
            ctx.fillStyle = "#ffffff"; ctx.fillRect(x + 4, y, 1, 1);
            // The hawk carries a small glowing bow when it fires across the room.
            ctx.strokeStyle = "#d8c0ff"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(x - 8, y + 4, 6, -Math.PI / 2, Math.PI / 2); ctx.stroke();
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x - 8, y - 2); ctx.lineTo(x - 8, y + 10); ctx.stroke();

        } else if(isBear) {

            // Keep the bear upright while mirroring it toward its target; the old full
            // rotation could flip it upside down when it pursued vertically.
            ctx.save();
            ctx.translate(x, y);
            if(Math.cos(summon.facing || Math.PI) > 0) ctx.scale(-1, 1);
            ctx.scale(1.3, 1.3);
            ctx.fillStyle = "#8b4fbc";
            ctx.fillRect(-15, -5, 30 * attackScale, 19);
            ctx.fillRect(-20, -9, 14, 15);
            ctx.fillRect(-18, -14, 6, 6); ctx.fillRect(-8, -14, 6, 6);
            ctx.fillStyle = color;
            ctx.fillRect(-13, -3, 24 * attackScale, 14);
            ctx.fillRect(-18, -7, 11, 12);
            ctx.fillRect(-16, 10, 7, 6 + stride); ctx.fillRect(8, 10, 7, 6 - stride);
            ctx.fillStyle = "#ffe0a8"; ctx.fillRect(-14, -3, 3, 3); ctx.fillRect(-8, -3, 3, 3);
            ctx.fillStyle = "#fff1ba"; ctx.fillRect(-1, 1, 4, 5);
            ctx.restore();

        } else {

            // The wolf mirrors toward its target and has a pronounced running/lunging cycle.
            if(moving) { ctx.globalAlpha = 0.22; ctx.fillStyle = color; ctx.fillRect(x - 18, y - 2, 18, 9); ctx.globalAlpha = 1; }
            let wolfLunge = summon.attackFlash > 0 ? 3 : 0;
            ctx.save();
            ctx.translate(x, y);
            if(Math.cos(summon.facing || Math.PI) > 0) ctx.scale(-1, 1);
            ctx.fillStyle = "#5b3a9d";
            ctx.fillRect(-8 - wolfLunge, -5, 17 * attackScale, 12);
            ctx.fillRect(-17 - wolfLunge, -8, 11, 11);
            ctx.beginPath(); ctx.moveTo(8 - wolfLunge, 0); ctx.lineTo(19 - wolfLunge, -8 - stride); ctx.lineTo(15 - wolfLunge, 4); ctx.fill();
            ctx.fillStyle = color;
            ctx.fillRect(-6 - wolfLunge, -3, 18 * attackScale, 9);
            ctx.fillRect(-16 - wolfLunge, -6, 10, 10);
            ctx.beginPath(); ctx.moveTo(-15 - wolfLunge, -6); ctx.lineTo(-13 - wolfLunge, -12); ctx.lineTo(-10 - wolfLunge, -6); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-9 - wolfLunge, -6); ctx.lineTo(-6 - wolfLunge, -12); ctx.lineTo(-5 - wolfLunge, -5); ctx.fill();
            ctx.fillRect(-5 - wolfLunge, 6, 5, 5 + stride); ctx.fillRect(7 - wolfLunge, 6, 5, 5 - stride);
            ctx.fillStyle = "#dffbff"; ctx.fillRect(-13 - wolfLunge, -3, 3, 3); ctx.fillRect(-7 - wolfLunge, -3, 3, 3);
            ctx.fillStyle = "#e8c8ff"; ctx.fillRect(1 - wolfLunge, -1, 3, 3); ctx.fillRect(6 - wolfLunge, 2, 3, 3);
            ctx.restore();

        }

        if(summon.attackFlash > 0) {
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(x, y, isBear ? 25 : 18, 0, Math.PI * 2); ctx.stroke();
        }

        // Remaining duration bar: the player can tell at a glance how long a summon stays active.
        let fullDuration = summon.type.indexOf("menagerie") === 0 ? 540 : isBear ? 540 : isHawk ? 540 : 660;
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = "#181226"; ctx.fillRect(x - 13, summon.y - 8, 26, 3);
        ctx.fillStyle = color; ctx.fillRect(x - 13, summon.y - 8, 26 * Math.max(0, summon.duration / fullDuration), 3);

        ctx.restore();

    }

    for(let bolt of arcaneSummonProjectiles) {

        if(bolt.room !== currentRoom) continue;

        ctx.save();

        ctx.fillStyle = bolt.color;

        ctx.shadowColor = bolt.color;

        ctx.shadowBlur = 10;

        if(bolt.type === "hawkArrow") {
            let angle = Math.atan2(bolt.vy, bolt.vx);
            ctx.translate(bolt.x, bolt.y); ctx.rotate(angle);
            ctx.fillRect(-8, -1, 14, 2);
            ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(3, -4); ctx.lineTo(3, 4); ctx.fill();
            ctx.fillStyle = "#d9f6ff"; ctx.fillRect(-7, -4, 3, 8);
        } else {
            ctx.beginPath(); ctx.arc(bolt.x, bolt.y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ffffff"; ctx.fillRect(bolt.x - 1, bolt.y - 1, 2, 2);
        }

        ctx.restore();

    }

    ctx.shadowBlur = 0;

}

function drawBerserkerEffects() {

    ctx.save();

    for(let trail of berserkerTrails) {

        ctx.globalAlpha = Math.min(0.75, trail.life / 12);

        ctx.strokeStyle = trail.frenzy ? "#ff2948" : "#b93732";

        ctx.shadowColor = "#ff1f2e";

        ctx.shadowBlur = trail.frenzy ? 15 : 7;

        ctx.lineWidth = trail.frenzy ? 7 : 4;

        ctx.beginPath();

        ctx.arc(trail.x, trail.y, trail.radius, trail.angle - 0.62, trail.angle + 0.62);

        ctx.stroke();

    }

    for(let wave of berserkerAxeWaves) {

        ctx.globalAlpha = Math.max(0, wave.life / 18);

        ctx.strokeStyle = "#ff5a4b";

        ctx.shadowColor = "#ff1f2e";

        ctx.shadowBlur = 13;

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(wave.x - Math.cos(wave.angle) * 12, wave.y - Math.sin(wave.angle) * 12);

        ctx.lineTo(wave.x + Math.cos(wave.angle) * 12, wave.y + Math.sin(wave.angle) * 12);

        ctx.stroke();

    }

    ctx.restore();

}

function drawBerserker() {

    let x = player.x;

    let y = player.y;

    let frenzy = berserkerFrenzyTimer > 0;

    let guarding = shieldRaised;

    let attacking = !guarding && attackPressActive && mouse.down;

    let swing = attacking ? Math.sin(Date.now() * (0.014 + berserkerMomentum * 0.0002)) * 0.42 : 0;

    ctx.save();

    if(frenzy || berserkerRushTimer > 0) {

        ctx.shadowColor = "#ff1c31";

        ctx.shadowBlur = frenzy ? 22 : 12;

        ctx.fillStyle = "rgba(205, 34, 45, 0.36)";

        ctx.beginPath();

        ctx.arc(x + 14, y + 16, 27, 0, Math.PI * 2);

        ctx.fill();

    }

    // Torn hide cloak behind a broad iron-and-leather silhouette.
    ctx.fillStyle = "#41251e";

    ctx.fillRect(x + 2, y + 14, 8, 20);

    ctx.fillRect(x + 4, y + 29, 6, 7);

    ctx.fillStyle = "#3f454c";

    ctx.fillRect(x + 5, y + 14, 18, 17);

    // Oversized shoulder guards and dented breastplate.
    ctx.fillRect(x + 2, y + 13, 7, 8);

    ctx.fillRect(x + 20, y + 13, 7, 8);

    ctx.fillStyle = "#81342e";

    ctx.fillRect(x + 8, y + 20, 12, 7);

    ctx.fillStyle = "#252a30";

    ctx.fillRect(x + 6, y + 29, 7, 7);

    ctx.fillRect(x + 16, y + 29, 7, 7);

    ctx.fillStyle = "#d1a078";

    ctx.fillRect(x + 8, y + 5, 12, 10);

    // Long messy hair, beard, and the scarred red eye.
    ctx.fillStyle = "#40231c";

    ctx.fillRect(x + 6, y + 1, 17, 6);

    ctx.fillRect(x + 8, y + 12, 11, 3);

    ctx.fillStyle = "#391714";

    ctx.fillRect(x + 10, y + 8, 3, 2);

    ctx.fillStyle = "#c84435";

    ctx.fillRect(x + 17, y + 8, 2, 2);

    let axeHands = guarding ? [
        // Cross both axe hafts in front of the Berserker while blocking.
        {shoulderX: x + 6, shoulderY: y + 18, angle: player.angle - 0.58},
        {shoulderX: x + 22, shoulderY: y + 18, angle: player.angle + Math.PI + 0.58}
    ] : [
        {shoulderX: x + 6, shoulderY: y + 18, angle: player.angle - 0.82 - swing},
        {shoulderX: x + 22, shoulderY: y + 18, angle: player.angle + 0.82 + swing}
    ];

    for(let axe of axeHands) {

        // The hand is calculated from the shoulder, so it visibly grips the
        // handle rather than leaving a floating axe beside the character.
        let handX = axe.shoulderX + Math.cos(axe.angle) * 12;

        let handY = axe.shoulderY + Math.sin(axe.angle) * 12;

        ctx.strokeStyle = "#9d6b49";

        ctx.lineWidth = 5;

        ctx.lineCap = "square";

        ctx.beginPath();

        ctx.moveTo(axe.shoulderX, axe.shoulderY);

        ctx.lineTo(handX, handY);

        ctx.stroke();

        ctx.fillStyle = "#5b4031";

        ctx.fillRect(handX - 3, handY - 3, 6, 6);

        ctx.save();

        ctx.translate(handX, handY);

        ctx.rotate(axe.angle);

        ctx.fillStyle = "#5a3828";

        ctx.fillRect(-3, -2, 30, 4);

        // Broad, jagged twin-reaper blade at the end of the held handle.
        ctx.fillStyle = "#2d333a";

        ctx.fillRect(20, -11, 10, 22);

        ctx.fillRect(17, -7, 5, 14);

        ctx.fillStyle = "#68717a";

        ctx.fillRect(25, -9, 5, 18);

        ctx.fillStyle = frenzy ? "#ff3a37" : "#cf4938";

        ctx.fillRect(22, -6, 7, 3);

        ctx.fillRect(22, 3, 7, 3);

        ctx.restore();

    }

    ctx.restore();

}

function drawClassModelAccents() {

    let x = player.x;

    let y = player.y;

    ctx.save();

        // Weathered cloak clasp and a facial scar give the Hero a battle-worn read.
        ctx.fillStyle = "#b64034"; ctx.fillRect(x + 2, y + 17, 4, 10);
        ctx.fillStyle = "#d8cfbd"; ctx.fillRect(x + 18, y + 9, 3, 1);

    } else if(playerClass === "cyborg") {

        // Exposed conduit and a red warning lens contrast the cold armor plating.
        ctx.strokeStyle = "#d7514d"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 5, y + 17); ctx.lineTo(x + 2, y + 23); ctx.stroke();
        ctx.fillStyle = "#ff4c4c"; ctx.fillRect(x + 19, y + 8, 2, 2);

    } else if(playerClass === "mage") {

        // Rune-stitching makes the mage's hood and robe easier to identify at a glance.
        ctx.fillStyle = "#8fdcff"; ctx.fillRect(x + 5, y + 20, 2, 5); ctx.fillRect(x + 20, y + 20, 2, 5);

    } else if(playerClass === "bruiser") {

        ctx.fillStyle = "#d16b51"; ctx.fillRect(x + 8, y + 9, 2, 5);
        ctx.fillStyle = "#d1af67"; ctx.fillRect(x + 17, y + 17, 3, 2);

    } else if(playerClass === "berserker") {

        ctx.fillStyle = "#a5222b"; ctx.fillRect(x + 13, y + 6, 2, 8);
        ctx.fillStyle = "#e7d4b5"; ctx.fillRect(x + 4, y + 19, 3, 2);

    } else if(playerClass === "stealth") {

        // Torn scarf tail and shoulder studs emphasize the Ninja's compact silhouette.
        ctx.fillStyle = "#7e8bd1"; ctx.fillRect(x + 1, y + 9, 6, 2); ctx.fillRect(x + 3, y + 11, 3, 2);
        ctx.fillStyle = "#b5c4ff"; ctx.fillRect(x + 7, y + 17, 2, 2); ctx.fillRect(x + 19, y + 17, 2, 2);

    } else if(playerClass === "musketeer") {

        // Brass bandolier pips distinguish the Musketeer's long coat from other robes.
        ctx.fillStyle = "#e1b65b"; ctx.fillRect(x + 8, y + 18, 3, 2); ctx.fillRect(x + 12, y + 21, 3, 2); ctx.fillRect(x + 16, y + 24, 3, 2);

    } else if(playerClass === "owen") {

        ctx.fillStyle = "#1a0d14"; ctx.fillRect(x + 4, y + 31, 5, 3); ctx.fillRect(x + 25, y + 31, 5, 3);

    } else if(playerClass === "battlemage") {

        // A charcoal tabard and gold crest make the Paladin's armored bulk unmistakable.
        ctx.fillStyle = "#3b3444"; ctx.fillRect(x + 10, y + 19, 8, 8);
        ctx.fillStyle = "#ffe07b"; ctx.fillRect(x + 13, y + 20, 2, 5); ctx.fillRect(x + 11, y + 22, 6, 2);

    }
