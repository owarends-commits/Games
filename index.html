// ======================================================
// MUSIC
// ======================================================

// A small original Web Audio loop keeps the game self-contained. Audio must
// begin from a player gesture, so ensureDungeonMusic is called from input.
let musicContext = null;
let musicGain = null;
let musicTimer = null;
let musicStep = 0;
let sfxLastPlayed = {};

function playDungeonNote(frequency, duration, volume, waveform) {

    let oscillator = musicContext.createOscillator();

    let gain = musicContext.createGain();

    let now = musicContext.currentTime;

    oscillator.type = waveform;

    oscillator.frequency.setValueAtTime(frequency, now);

    gain.gain.setValueAtTime(0.0001, now);

    gain.gain.exponentialRampToValueAtTime(volume, now + 0.025);

    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    oscillator.connect(gain);

    gain.connect(musicGain);

    oscillator.start(now);

    oscillator.stop(now + duration + 0.04);

}

function playSfx(type) {

    if(!musicContext || musicContext.state !== "running") return;

    let sounds = {
        playerAttack: {frequency: 190, endFrequency: 105, duration: 0.09, volume: 0.055, waveform: "square", cooldown: 0.045},
        playerAbility: {frequency: 260, endFrequency: 520, duration: 0.16, volume: 0.05, waveform: "sine", cooldown: 0.09},
        playerHit: {frequency: 105, endFrequency: 68, duration: 0.14, volume: 0.075, waveform: "sawtooth", cooldown: 0.08},
        enemyAttack: {frequency: 118, endFrequency: 82, duration: 0.12, volume: 0.045, waveform: "square", cooldown: 0.12},
        enemyHit: {frequency: 165, endFrequency: 118, duration: 0.055, volume: 0.038, waveform: "triangle", cooldown: 0.035},
        enemyDeath: {frequency: 125, endFrequency: 48, duration: 0.18, volume: 0.06, waveform: "sawtooth", cooldown: 0.08}
    };

    let sound = sounds[type];

    if(!sound) return;

    let now = musicContext.currentTime;

    if(sfxLastPlayed[type] && now - sfxLastPlayed[type] < sound.cooldown) return;

    sfxLastPlayed[type] = now;

    let oscillator = musicContext.createOscillator();

    let gain = musicContext.createGain();

    oscillator.type = sound.waveform;

    oscillator.frequency.setValueAtTime(sound.frequency, now);

    oscillator.frequency.exponentialRampToValueAtTime(sound.endFrequency, now + sound.duration);

    gain.gain.setValueAtTime(sound.volume, now);

    gain.gain.exponentialRampToValueAtTime(0.0001, now + sound.duration);

    oscillator.connect(gain);

    gain.connect(musicGain);

    oscillator.start(now);

    oscillator.stop(now + sound.duration + 0.03);

}

function playDungeonMusicStep() {

    // Keep the musical foundation in a range laptop speakers can reproduce.
    let bassline = [146.83, 146.83, 164.81, 130.81, 146.83, 196.00, 164.81, 130.81];

    let melody = [293.66, 349.23, 392.00, 349.23, 329.63, 293.66, 261.63, 329.63];

    let step = musicStep % bassline.length;

    playDungeonNote(bassline[step], 0.34, 0.12, "triangle");

    if(step % 2 === 0) playDungeonNote(melody[step], 0.22, 0.06, "sine");

    musicStep++;

}

function ensureDungeonMusic() {

    if(!musicContext) {

        let AudioContext = window.AudioContext || window.webkitAudioContext;

        if(!AudioContext) return;

        musicContext = new AudioContext();

        musicGain = musicContext.createGain();

        musicGain.gain.value = 0.8;

        musicGain.connect(musicContext.destination);

    }

    if(musicContext.state === "suspended") musicContext.resume();

    if(!musicTimer) {

        playDungeonMusicStep();

        musicTimer = setInterval(playDungeonMusicStep, 380);

    }

}


// ======================================================
// MOUSE
// ======================================================

let mouse = {

    x: 400,
    y: 300,

    down: false

};

let keys = {

    w: false,

    a: false,

    s: false,

    d: false

};

// Shift is a held defensive stance rather than a toggle.
let shieldRaised = false;

// A parry is a brief opening immediately after the shield is raised.
let parryTimer = 0;

// Set only when the short parry window actually catches a projectile.
let parryShineTimer = 0;

let playerClass = "hero";

let attackPressActive = false;

let attackHoldTime = 0;

// Prevent the click fallback from treating the same title-button click as a class-card click.
let suppressNextCanvasClick = false;

function updateCanvasPointer(e) {

    // offsetX/Y are relative to the canvas content box (not the page or its
    // border), making card hit testing stable under browser zoom and scaling.
    if(typeof e.offsetX === "number" && canvas.clientWidth > 0 && canvas.clientHeight > 0) {

        mouse.x = e.offsetX * canvas.width / canvas.clientWidth;

        mouse.y = e.offsetY * canvas.height / canvas.clientHeight;

        return;

    }

    let rect = canvas.getBoundingClientRect();

    mouse.x = (e.clientX - rect.left) * canvas.width / rect.width;

    mouse.y = (e.clientY - rect.top) * canvas.height / rect.height;

}


canvas.addEventListener("mousemove", function(e) {

    updateCanvasPointer(e);

});


canvas.addEventListener("mousedown", function(e) {

    if(e.button !== 0) return;

    ensureDungeonMusic();

    updateCanvasPointer(e);

    mouse.down = true;

    if(gameState === "blessing") {

        let choiceIndex = Math.floor((mouse.x - 55) / 235);

        if(mouse.y >= 270 && mouse.y <= 445 && choiceIndex >= 0 && choiceIndex < 3) chooseShrineBuff(choiceIndex);

        mouse.down = false;

        return;

    }

    if(gameState === "trading") {

        let choiceIndex = Math.floor((mouse.x - 55) / 235);

        if(mouse.y >= 270 && mouse.y <= 445 && choiceIndex >= 0 && choiceIndex < 3) buyTraderOffer(choiceIndex);

        if(mouse.y >= 465 && mouse.y <= 515 && mouse.x >= 290 && mouse.x <= 510) cancelTrade();

        mouse.down = false;

        return;

    }

    if(gameState === "start") {

        if(mouse.x >= 300 && mouse.x <= 500 && mouse.y >= 350 && mouse.y <= 408) {

            gameState = "classSelect";

            suppressNextCanvasClick = true;

        }

        else if(mouse.x >= 300 && mouse.x <= 500 && mouse.y >= 425 && mouse.y <= 483) {

            codexScroll = 0;

            gameState = "enemyCodex";

        }

        else if(mouse.x >= 300 && mouse.x <= 500 && mouse.y >= 500 && mouse.y <= 558) {

            classInfoScroll = 0;

            gameState = "classInfo";

        }

        mouse.down = false;

        return;

    }

    if(gameState === "enemyCodex") {

        if(mouse.x >= 25 && mouse.x <= 185 && mouse.y >= 22 && mouse.y <= 62) gameState = "start";

        else if(mouse.y >= 535 && mouse.y <= 580) {

            if(mouse.x >= 520 && mouse.x <= 650) codexScroll = Math.max(0, codexScroll - 1);

            if(mouse.x >= 660 && mouse.x <= 790) codexScroll = Math.min(ENEMY_CODEX.length - 5, codexScroll + 1);

        }

        mouse.down = false;

        return;

    }

    if(gameState === "classInfo") {

        if(mouse.x >= 25 && mouse.x <= 185 && mouse.y >= 22 && mouse.y <= 62) gameState = "start";

        else if(mouse.y >= 535 && mouse.y <= 580) {

            if(mouse.x >= 520 && mouse.x <= 650) classInfoScroll = Math.max(0, classInfoScroll - 1);

            if(mouse.x >= 660 && mouse.x <= 790) classInfoScroll = Math.min(CLASS_INFORMATION.length - 3, classInfoScroll + 1);

        }

        mouse.down = false;

        return;

    }

    if(gameState === "classSelect") {

        if(!choosePlayerClass(mouse.x, mouse.y)) {

            mouse.down = false;

            return;

        }

        currentRoom = 0;

        player.x = 100;

        player.y = 300;

        oldManDialogue = false;

        gameState = "lobby";

        return;

    }

    if(gameState === "playing" || gameState === "lobby") {

        if(shieldRaised) return;

        attackPressActive = true;

        attackHoldTime = 0;

    }

});


canvas.addEventListener("mouseup", function(e) {

    if(e.button !== 0) return;

    mouse.down = false;

    releaseAttack();

});


canvas.addEventListener("mouseleave", function() {

    mouse.down = false;

    attackPressActive = false;

    isCharging = false;

});

canvas.addEventListener("wheel", function(e) {

    if(gameState !== "enemyCodex" && gameState !== "classInfo") return;

    let direction = e.deltaY > 0 ? 1 : -1;

    if(gameState === "enemyCodex") codexScroll = Math.max(0, Math.min(ENEMY_CODEX.length - 5, codexScroll + direction));

    else classInfoScroll = Math.max(0, Math.min(CLASS_INFORMATION.length - 3, classInfoScroll + direction));

    e.preventDefault();

}, {passive: false});


window.addEventListener("keydown", function(e) {

    ensureDungeonMusic();

    let keyName = e.key.toLowerCase();

    if(gameState === "bossDialogue") {

        if(keyName === "e" || keyName === "enter" || keyName === " ") {

            activeBossDialogue = null;

            gameState = "playing";

        }

        e.preventDefault();

        return;

    }

    if(gameState === "oldManTalk") {

        if(keyName === "e" || keyName === "enter" || keyName === " ") {

            oldManVanishTarget = activeOldManEncounter;

            oldManVanishTimer = 42;

            gameState = "oldManVanish";

        }

        e.preventDefault();

        return;

    }

    if(gameState === "enemyCodex") {

        if(keyName === "escape") gameState = "start";

        else if(keyName === "arrowdown" || keyName === "s") codexScroll = Math.min(ENEMY_CODEX.length - 5, codexScroll + 1);

        else if(keyName === "arrowup" || keyName === "w") codexScroll = Math.max(0, codexScroll - 1);

        e.preventDefault();

        return;

    }

    if(gameState === "classInfo") {

        if(keyName === "escape") gameState = "start";

        else if(keyName === "arrowdown" || keyName === "s") classInfoScroll = Math.min(CLASS_INFORMATION.length - 3, classInfoScroll + 1);

        else if(keyName === "arrowup" || keyName === "w") classInfoScroll = Math.max(0, classInfoScroll - 1);

        e.preventDefault();

        return;

    }

    if(keyName in keys) {

        keys[keyName] = true;

        e.preventDefault();

    }

    if(keyName === "shift") {

        if(playerClass === "battlemage") {

            if(battlemageShieldTimer <= 0 && battlemageDivineCooldown <= 0 && battlemageDivineIntervention > 0) {

                battlemageShieldTimer = battlemageDivineIntervention;

                attackPressActive = false;

                isCharging = false;

                battlemageChargeTimer = 0;

            }

            e.preventDefault();

            return;

        }

        if(playerClass === "owen") {

            owenChestBeamActive = crimsonBeamMeter > 0;

            e.preventDefault();

            return;

        }

        if(!shieldRaised) parryTimer = 15;

        shieldRaised = true;

        // Raising a shield immediately cancels any held offensive action.
        attackPressActive = false;

        bowHeld = false;

        isCharging = false;

        dashTimer = 0;

        grapplingHook.state = "idle";

        ninjaKunai.state = "idle";

        e.preventDefault();

    }

    if(keyName === "e" && !e.repeat && gameState === "lobby" && isNearOldMan()) {

        if(!oldManDialogue) {

            oldManDialogue = true;

            oldManDialoguePage = 0;

        }

        else if(oldManDialoguePage < OLD_MAN_STORY.length - 1) {

            oldManDialoguePage++;

        }

        else {

            oldManDialogue = false;

            oldManDialoguePage = 0;

        }

        e.preventDefault();

        return;

    }

    if(gameState === "traderTalk") {

        gameState = "trading";

        mouse.down = false;

        return;

    }

    if(keyName === "e" && !e.repeat && gameState === "traderTalk") {

        gameState = "trading";

        e.preventDefault();

        return;

    }

    if(keyName === "e" && !e.repeat && gameState === "playing" && dungeonHeartAftermath && dungeonHeartAftermath.state === "gauntlet" && Math.hypot(player.x + player.width / 2 - (dungeonHeartAftermath.x + dungeonHeartAftermath.width / 2), player.y + player.height / 2 - (dungeonHeartAftermath.y + dungeonHeartAftermath.height / 2)) < 52) {

        collectDungeonGauntlet();

        e.preventDefault();

        return;

    }

    if(keyName === "e" && !e.repeat && (gameState === "playing" || gameState === "lobby")) {

        if(playerClass !== "hero" || shieldRaised) return;

        bowHeld = true;

        bowCharge = 0;

        e.preventDefault();

    }

    if((keyName === "1" || keyName === "2" || keyName === "3") && playerClass === "mage") {

        mageAttackMode = Number(keyName);

        e.preventDefault();

    }

    if((keyName === "1" || keyName === "2" || keyName === "3") && playerClass === "summoner") {

        summonerSelectedAnimal = Number(keyName);

        e.preventDefault();

    }

    if(keyName === "r" && !e.repeat && playerClass === "musketeer" && (gameState === "playing" || gameState === "lobby")) {

        if(musketeerAmmo < musketeerAmmoMax && musketeerReloadTimer <= 0) musketeerReloadTimer = 75;

        e.preventDefault();

    }

    if(keyName === "q" && !e.repeat && (gameState === "playing" || gameState === "lobby") && traderAbility && traderAbilityCooldown <= 0 && !shieldRaised && !(playerClass === "battlemage" && battlemageShieldTimer > 0)) {

        castRelicNova();

        e.preventDefault();

    }

});


window.addEventListener("keyup", function(e) {

    let keyName = e.key.toLowerCase();

    if(keyName in keys) {

        keys[keyName] = false;

        e.preventDefault();

    }

    if(keyName === "shift") {

        if(playerClass === "battlemage") {

            // Divine Intervention is committed on activation and lasts until its meter is spent.

            e.preventDefault();

            return;

        }

        if(playerClass === "owen") {

            owenChestBeamActive = false;

            e.preventDefault();

            return;

        }

        shieldRaised = false;

        parryTimer = 0;

        e.preventDefault();

    }

    if(keyName === "e") {

        releaseBow();

        e.preventDefault();

    }

    if(e.code === "Space" && playerClass === "hero") {

        releaseGrapplingHook();

        e.preventDefault();

    }

    if(e.code === "Space" && playerClass === "stealth") {

        releaseNinjaKunai();

        e.preventDefault();

    }

    if(e.code === "Space" && playerClass === "cyborg") {

        cyborgThrusterActive = false;

        e.preventDefault();

    }

    if(e.code === "Space" && playerClass === "owen") {

        owenFlying = false;

        e.preventDefault();

    }

    if(keyName === " ") {

        e.preventDefault();

    }

});


window.addEventListener("blur", function() {

    shieldRaised = false;

        owen: {health: 135, speed: 2.1},

        battlemage: {health: 145, speed: 2.56},

        summoner: {health: 85, speed: 4.5}

    }[playerClass];

    player.maxHealth = stats.health + build.healthBonus;

    player.speed = stats.speed * build.speedMultiplier;

    let model = PLAYER_MODEL_PROFILES[playerClass];

    player.width = model.width;

    player.height = model.height;

    player.health = player.maxHealth;

}

function applyEnemyLevelScaling(enemy, room) {

    // Every dungeon level steadily raises enemy durability, damage, speed, and attack cadence.
    let level = Math.max(0, room - 1);

    let healthScale = 1 + level * 0.02;

    let damageScale = 1 + level * 0.012;

    let speedScale = 1 + level * 0.005;

    let projectileSpeedScale = 1 + level * 0.008;

    enemy.health = Math.round(enemy.health * healthScale);

    enemy.maxHealth = enemy.health;

    if(typeof enemy.speed === "number") enemy.speed *= speedScale;

    if(typeof enemy.projectileDamage === "number") enemy.projectileDamage *= damageScale;

    if(typeof enemy.projectileSpeed === "number") enemy.projectileSpeed *= projectileSpeedScale;

    enemy.attackCooldownScale = Math.max(0.7, 1 - level * 0.004);

}

// ======================================================
// COLLISION
// ======================================================

function checkCollision(a, b) {

    return (

        a.x < b.x + b.width &&

        a.x + a.width > b.x &&

        a.y < b.y + b.height &&

        a.y + a.height > b.y

    );

}


// ======================================================
// CURRENT SOLID TERRAIN
// ======================================================

function getClosedDoorColliders(room) {

    if(room === 0 || !enemies.some(function(enemy) { return enemy.alive && enemy.room === room; })) return [];

    let doors = [];

    // These cover only the actual wall openings, allowing opened doors to remain passable.
    if(room > 1) doors.push({x: 0, y: 230, width: 20, height: 140});

    // The current end room still has a visible, lockable descent door while the
    // next room is being generated; otherwise it degrades into a bare wall.
    if(room > 0) doors.push({x: 780, y: 230, width: 20, height: 140});

    return doors;

}


function getCurrentWalls() {

    // Water and closed doors are solid terrain for actors; projectile checks use getCurrentRoomWalls().
    return (rooms[currentRoom] || []).concat(waterPools[currentRoom] || []).concat(iceWalls.filter(function(wall) { return wall.room === currentRoom; })).concat(getClosedDoorColliders(currentRoom));

}


function getCurrentRoomWalls() {

    // Projectile collision uses only masonry; shots travel cleanly over water.
    return (rooms[currentRoom] || []).concat(iceWalls.filter(function(wall) { return wall.room === currentRoom; }));

}

// Companions use a swept collision check so fast wolf dashes cannot tunnel through
// thin walls or water pools between frames.
function summonPathBlocked(summon, moveX, moveY) {

    let steps = Math.max(1, Math.ceil(Math.max(Math.abs(moveX), Math.abs(moveY)) / 3));

    for(let step = 1; step <= steps; step++) {

        let candidate = {x: summon.x + moveX * step / steps, y: summon.y + moveY * step / steps, width: summon.width, height: summon.height};

        if(getCurrentWalls().some(function(terrain) { return checkCollision(candidate, terrain); })) return true;

    }

    return false;

}

function getSummonSteeringMove(summon, targetX, targetY, speed) {

    let centerX = summon.x + summon.width / 2;

    let centerY = summon.y + summon.height / 2;

    let baseAngle = Math.atan2(targetY - centerY, targetX - centerX);

    // Try direct movement first, then progressively wider side steps around terrain.
    let offsets = [0, Math.PI / 4, -Math.PI / 4, Math.PI / 2, -Math.PI / 2, Math.PI * 3 / 4, -Math.PI * 3 / 4];

    let best = null;

    for(let offset of offsets) {

        let angle = baseAngle + offset;

        let moveX = Math.cos(angle) * speed;

        let moveY = Math.sin(angle) * speed;

        if(summonPathBlocked(summon, moveX, moveY)) continue;

        let futureDistance = Math.hypot(targetX - (centerX + moveX), targetY - (centerY + moveY));

        let score = futureDistance + Math.abs(offset) * 12;

        if(!best || score < best.score) best = {x: moveX, y: moveY, angle: angle, score: score};

    }

    return best;

}

function findSafeSummonSpawn(preferredX, preferredY, width, height) {

    function isClear(x, y) {

        let candidate = {x: x, y: y, width: width, height: height};

        return x >= 20 && y >= 20 && x + width <= canvas.width - 20 && y + height <= canvas.height - 20 && roomHasOpenSpace(currentRoom, x, y, width, height) && !getCurrentWalls().some(function(terrain) { return checkCollision(candidate, terrain); });

    }

    if(isClear(preferredX, preferredY)) return {x: preferredX, y: preferredY};

    for(let radius = 24; radius <= 160; radius += 24) {

        for(let step = 0; step < 12; step++) {

            let angle = step * Math.PI * 2 / 12;

            let x = preferredX + Math.cos(angle) * radius;

            let y = preferredY + Math.sin(angle) * radius;

            if(isClear(x, y)) return {x: x, y: y};

        }

    }

    // Last-resort room search still rejects water, walls, ice, and closed doors.
    for(let attempt = 0; attempt < 100; attempt++) {

        let x = randomBetween(25, canvas.width - width - 25);

        let y = randomBetween(25, canvas.height - height - 25);

        if(isClear(x, y)) return {x: x, y: y};

    }

    return {x: player.x, y: player.y};

}


function randomBetween(min, max) {

    return min + Math.floor(Math.random() * (max - min + 1));

}


function roomHasOpenSpace(room, x, y, width, height) {

    let candidate = {x: x, y: y, width: width, height: height};

    let blocksChest = treasures.some(function(chest) { return chest.room === room && !chest.collected && checkCollision(candidate, chest); });

    let blocksHealingShrine = healingShrines.some(function(shrine) { return shrine.room === room && !shrine.used && checkCollision(candidate, shrine); });

    let blocksUniqueTreasure = room === treasureRoom && !treasure.collected && checkCollision(candidate, treasure);

    return !rooms[room].some(function(wall) { return checkCollision(candidate, wall); }) && !(waterPools[room] || []).some(function(pool) { return checkCollision(candidate, pool); }) && !blocksChest && !blocksHealingShrine && !blocksUniqueTreasure;

}


function createIceSpireWall(room, x, y, width, height, life, source) {

    // The hitbox remains a simple rectangle, while the renderer breaks it into distinct ice spires.
    return {
        room: room,
        x: x,
        y: y,
        width: width,
        height: height,
        life: life,
        source: source || "frost",
        spireCount: Math.max(2, Math.round(Math.max(width, height) / 30)),
        spireSeed: Math.random() * Math.PI * 2
    };

}


function damageDestructibleIceWallAt(x, y, amount) {

    for(let index = iceWalls.length - 1; index >= 0; index--) {

        let wall = iceWalls[index];

        if(!wall.destructible || wall.room !== currentRoom || x < wall.x || x > wall.x + wall.width || y < wall.y || y > wall.y + wall.height) continue;

        wall.health -= amount;

        wall.hitFlash = 7;

        if(wall.health <= 0) {

            iceWalls.splice(index, 1);

            explosions.push({x: wall.x + wall.width / 2, y: wall.y + wall.height / 2, life: 18});

            playSfx("enemyDeath");

        }

        return true;

    }

    return false;

}


function randomOpenPosition(room, width, height) {

    for(let attempt = 0; attempt < 80; attempt++) {

        let x = randomBetween(55, 725 - width);

        let y = randomBetween(55, 525 - height);

        if(roomHasOpenSpace(room, x, y, width, height)) return {x: x, y: y};

    }

    // A deterministic sweep prevents a crowded room from forcing a spawn
    // into cover, water, or an interactable after the random attempts fail.
    for(let y = 40; y <= 560 - height; y += 18) {

        for(let x = 40; x <= 760 - width; x += 18) {

            if(roomHasOpenSpace(room, x, y, width, height)) return {x: x, y: y};

        }

    }

    // This should be unreachable in generated rooms, but preserves a visible fallback.
    return {x: 370, y: 300};

}

function findChestPosition(room, width, height) {

    for(let attempt = 0; attempt < 120; attempt++) {

        let position = randomOpenPosition(room, width, height);

        let chest = {x: position.x, y: position.y, width: width, height: height};

        let overlapsEnemy = enemies.some(function(enemy) { return enemy.alive && enemy.room === room && checkCollision(chest, enemy); });

        if(roomHasOpenSpace(room, position.x, position.y, width, height) && !overlapsEnemy) return position;

    }

    return null;

}


function createRoomBorder(room) {

    let border = [

        {x: 0, y: 0, width: 800, height: 20},

        {x: 0, y: 580, width: 800, height: 20},

        {x: 0, y: 0, width: 20, height: 600}

    ];

    if(room === 0 || room === 1) {

        border.push({x: 780, y: 0, width: 20, height: 230}, {x: 780, y: 370, width: 20, height: 230});

    }

    else if(room < roomCount) {

        border[2] = {x: 0, y: 0, width: 20, height: 230};

        border.push({x: 0, y: 370, width: 20, height: 230}, {x: 780, y: 0, width: 20, height: 230}, {x: 780, y: 370, width: 20, height: 230});

    }

    else {

        // Even the current last room needs a proper doorway so it can expand
        // into the next level rather than displaying only the border seam.
        border[2] = {x: 0, y: 0, width: 20, height: 230};

        border.push({x: 0, y: 370, width: 20, height: 230}, {x: 780, y: 0, width: 20, height: 230}, {x: 780, y: 370, width: 20, height: 230});

    }

    return border;

}

        if(bossRooms.includes(room - 1)) {

        if(room % 3 === 0 && room < roomCount && !bossRooms.includes(room + 2)) {

            {type: "riftMage", weight: 2, health: 145, speed: 0.8, width: 32, height: 40, projectileSpeed: 4, projectileDamage: 20, projectileColor: "#c878ff", effect: "rift"},
            {type: "chainbound", weight: 2, health: 230, speed: 0.7, width: 42, height: 46, projectileSpeed: 5, projectileDamage: 20, projectileColor: "#bfc6d0", effect: "chain"},
            {type: "mirrorKnight", weight: 1, health: 210, speed: 1.1, width: 36, height: 44, projectileSpeed: 7, projectileDamage: 22, projectileColor: "#b6f4ff", effect: "mirror"},
            {type: "jesterKing", weight: 1, health: 220, speed: 1.8, width: 40, height: 46, projectileSpeed: 9, projectileDamage: 24, projectileColor: "#ff72d6", effect: "ricochet"},
            {type: "dungeonWarden", weight: 0.5, health: 350, speed: 0.6, width: 52, height: 54, projectileSpeed: 6, projectileDamage: 30, projectileColor: "#ffbe42", effect: "wardenBeam"}
        ];

        let eliteTypes = ["arcaneKnight", "bloodHarbinger", "voidStalker", "ironclad", "plagueDoctor", "frostRevenant", "soulCollector", "riftMage", "chainbound", "mirrorKnight", "jesterKing", "dungeonWarden"];

        // Each elite receives a two-percentage-point spawn increase.
        for(let profile of enemyProfiles) {

            if(eliteTypes.includes(profile.type)) {

                profile.elite = true;

                profile.weight += 2;

            }

        }

        let scene = getDungeonScene(room);

        // Every ten rooms raises the per-room elite cap by one: 1 in rooms 1-10,
        // 2 in rooms 11-20, 3 in rooms 21-30, and so on.
        let eliteLimit = Math.ceil(room / 10);

        let eliteCount = 0;

        for(let count = 0; count < randomBetween(3, 5); count++) {

            let total = 0;

            // Each elite already placed lowers the next elite roll by 2 percentage points.
            let eliteChance = Math.max(0, scene.eliteChance - eliteCount * 0.02);

            let forceElite = eliteCount < eliteLimit && Math.random() < eliteChance;

            let availableProfiles = enemyProfiles.filter(function(candidate) {

                if(forceElite) return candidate.elite && (!scene.elites || scene.elites.includes(candidate.type));

                return !candidate.elite;

            });

            for(let candidate of availableProfiles) total += candidate.weight;

            let roll = randomBetween(1, total);

            let profile = availableProfiles[0];

            let cumulativeWeight = 0;

            for(let candidate of availableProfiles) { cumulativeWeight += candidate.weight; if(roll <= cumulativeWeight) { profile = candidate; break; } }

            if(profile.elite) eliteCount++;

            let position = randomOpenPosition(room, profile.width, profile.height);

            enemies.push({x: position.x, y: position.y, width: profile.width, height: profile.height, speed: profile.speed, health: profile.health, maxHealth: profile.health, room: room, type: profile.type, isElite: !!profile.elite, hitFlash: 0, alive: true, attackCooldown: randomBetween(34, ENEMY_ATTACK_COOLDOWN), attackTimer: 0, attackRange: 390, projectileSpeed: profile.projectileSpeed * PROJECTILE_SPEED_MULTIPLIER, projectileDamage: profile.projectileDamage, projectileColor: profile.projectileColor, effect: profile.effect, damageByHealth: profile.damageByHealth});

            applyEnemyLevelScaling(enemies[enemies.length - 1], room);

        }

    }

    let keyPosition = randomOpenPosition(keyRoom, key.width, key.height);

    key.x = keyPosition.x;

    key.y = keyPosition.y;

    // Keep the unique treasure chest out of boss arenas and shrine rooms as well.
    let treasureCandidates = [];

    for(let room = keyRoom + 2; room <= 20; room++) if(!isBossOrShrineRoom(room)) treasureCandidates.push(room);

    if(treasureCandidates.length > 0) treasureRoom = treasureCandidates[randomBetween(0, treasureCandidates.length - 1)];

    let treasurePosition = randomOpenPosition(treasureRoom, treasure.width, treasure.height);

    treasure.x = treasurePosition.x;

    treasure.y = treasurePosition.y;

    treasure.collected = true;

    // One center chest per traversable room. Rare black-and-gold chests replace gold with aid.
    for(let room = 1; room < roomCount; room++) {

        if(isBossOrShrineRoom(room)) continue;

        let rare = Math.random() < 0.08;

        let chestWidth = rare ? 40 : 28;

        let chestHeight = rare ? 32 : 24;

        let chestPosition = findChestPosition(room, chestWidth, chestHeight);

        if(chestPosition) treasures.push({room: room, x: chestPosition.x, y: chestPosition.y, width: chestWidth, height: chestHeight, gold: rare ? 0 : randomBetween(1, 50), rare: rare, reward: rare ? (Math.random() < 0.5 ? "heal" : "ability") : null, collected: false});

    }

    let encounterTypes = ["shrine", "boss", "trader", "evilShrine"];

    // Safe rooms above replace the former random special-encounter spawns.
    for(let blockStart = roomCount + 1; blockStart <= roomCount; blockStart += 3) {

        let candidates = [];

        for(let room = blockStart; room < Math.min(roomCount + 1, blockStart + 3); room++) if(!shrineRooms[room]) candidates.push(room);

        if(candidates.length === 0) continue;

        let encounterRoom = candidates[randomBetween(0, candidates.length - 1)];

        let encounterType = encounterTypes[randomBetween(0, encounterTypes.length - 1)];

        let encounterPosition = randomOpenPosition(encounterRoom, encounterType === "boss" ? 44 : 34, encounterType === "boss" ? 44 : 34);

        let encounter = {

            type: encounterType,

            room: encounterRoom,

            x: encounterPosition.x,

            y: encounterPosition.y,

            width: encounterType === "boss" ? 44 : 34,

            height: encounterType === "boss" ? 44 : 34,

            used: false

        };

        roomEncounters.push(encounter);

        if(encounterType === "boss") {

        enemies.push({

            x: encounterPosition.x,

            y: encounterPosition.y,

            width: 44,

            height: 44,

            speed: 0.7,

            health: 350,

            maxHealth: 350,

            room: encounterRoom,

            type: "boss",

            isBoss: true,

            hitFlash: 0,

            alive: true,

            attackCooldown: 0,

            attackTimer: 0,

            attackRange: 58

            });

        }
    }

}


// ======================================================
// PLAYER MOVEMENT
// ======================================================

function movePlayer() {

    if(gameState !== "playing" && gameState !== "lobby") {

        return;

    }


    // Calculate direction toward mouse

    let centerX =

        player.x +

        player.width / 2;


    let centerY =

        player.y +

        player.height / 2;


    let dx =

        mouse.x -

        centerX;


    let dy =

        mouse.y -

        centerY;


    let distance =

        Math.sqrt(

            dx * dx +

            dy * dy

        );


    // Update facing direction

    if(distance > 5) {

        player.angle =

            Math.atan2(

                dy,

                dx

            );

    }


    // Movement and aiming are independent: WASD follows the map axes while
    // the mouse keeps controlling the direction the character faces.

    let moveX = 0;

    let moveY = 0;

    if(keys.w) moveY--;

    if(keys.a) moveX--;

    if(keys.s) moveY++;

    if(keys.d) moveX++;

    let moveLength = Math.sqrt(moveX * moveX + moveY * moveY);

    // Do not allow a diagonal input to move faster than a single direction.

    if(

        moveLength > 0 &&

        dashTimer <= 0 &&

        playerFreezeTimer <= 0 &&

        bruiserChargeTimer <= 0 &&

        berserkerRushTimer <= 0 &&

        battlemageChargeTimer <= 0 &&

        grapplingHook.state !== "pulling"

    ) {

        let oldX = player.x;

        let oldY = player.y;

        let standingInSlime = slimePuddles.some(function(puddle) { return puddle.room === currentRoom && checkCollision(player, puddle); });

        let terrorIncarnate = playerClass === "berserker" && enemies.some(function(enemy) { return enemy.alive && enemy.isBoss && enemy.room === currentRoom; }) ? 1.2 : 1;

        let moveSpeed = player.speed * (playerClass === "hero" && heroModeTimer > 0 ? 2 : 1) * (playerClass === "berserker" && attackPressActive && mouse.down ? 1.2 : 1) * terrorIncarnate * (playerClass === "stealth" && ninjaSmokeRunTimer > 0 ? 2 : 1) * (playerClass === "battlemage" && battlemageShieldTimer > 0 ? 0.8 : 1) * (playerClass === "owen" && owenChestBeamActive ? 0.48 : 1) * (playerSlowTimer > 0 ? 0.65 : 1) * (frostBeamSlowTimer > 0 ? 0.4 : 1) * (standingInSlime ? 0.8 : 1) * (ouchFireTimer > 0 ? 1.15 : 1);


        player.x +=

            (moveX / moveLength) *

            moveSpeed;


        player.y +=

            (moveY / moveLength) *

            moveSpeed;


        movementLightning = 3;


        for(let wall of getCurrentWalls()) {

            if(checkCollision(player, wall)) {

                player.x = oldX;

                player.y = oldY;

            }

        }

    }

    if(frozenFloorTimer > 0 && currentRoom === frozenFloorRoom) {

        if(moveLength > 0) {

            frostSlideVX = moveX / moveLength * player.speed * 1.15;

            frostSlideVY = moveY / moveLength * player.speed * 1.15;

        }

        if(Math.abs(frostSlideVX) > 0.05 || Math.abs(frostSlideVY) > 0.05) {

            let oldX = player.x;

            let oldY = player.y;

            player.x += frostSlideVX;

            player.y += frostSlideVY;

            if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) { player.x = oldX; player.y = oldY; frostSlideVX = 0; frostSlideVY = 0; }

            frostSlideVX *= 0.88;

            frostSlideVY *= 0.88;

        }

    }


    checkDoors();

    checkItems();

    checkExit();

}


// ======================================================
// HERO GRAPPLING HOOK
// ======================================================

function startGrapplingHook() {

    playSfx("playerAbility");

    if(playerClass !== "hero" || shieldRaised || grapplingHook.state !== "idle") return;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    grapplingHook = {

        state: "flying",

        x: centerX,

        y: centerY,

        vx: Math.cos(player.angle) * 18,

        vy: Math.sin(player.angle) * 18,

        life: 90

    };

}


function releaseGrapplingHook() {

    if(grapplingHook.state === "anchored") {

        grapplingHook.state = "pulling";

    }

    else if(grapplingHook.state === "flying") {

        grapplingHook.state = "retracting";

    }

}


function updateGrapplingHook() {

    if(playerClass !== "hero" || grapplingHook.state === "idle") return;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    if(grapplingHook.state === "flying") {

        grapplingHook.x += grapplingHook.vx;

        grapplingHook.y += grapplingHook.vy;

        grapplingHook.life--;

        if(pointHitsWall(grapplingHook.x, grapplingHook.y)) {

            grapplingHook.state = "anchored";

        }

        else if(grapplingHook.life <= 0) {

            grapplingHook.state = "retracting";

        }

    }

    else if(grapplingHook.state === "retracting") {

        let dx = centerX - grapplingHook.x;

        let dy = centerY - grapplingHook.y;

        let distance = Math.hypot(dx, dy);

        if(distance <= 16) {

            grapplingHook.state = "idle";

        }

        else {

            grapplingHook.x += dx / distance * 26;

            grapplingHook.y += dy / distance * 26;

        }

    }

    else if(grapplingHook.state === "pulling") {

        let dx = grapplingHook.x - centerX;

        let dy = grapplingHook.y - centerY;

        let distance = Math.hypot(dx, dy);

        if(distance <= 18) {

            grapplingHook.state = "idle";

            return;

        }

        let oldX = player.x;

        let oldY = player.y;

        player.x += dx / distance * 22 * build.hookMultiplier;

        player.y += dy / distance * 22 * build.hookMultiplier;

        if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) {

            player.x = oldX;

            player.y = oldY;

            grapplingHook.state = "idle";

        }

    }

}


// ======================================================
// DASH MOVEMENT
// ======================================================

function updateDash() {

    if(shieldRaised) {

        dashTimer = 0;

        return;

    }

    if(dashTimer <= 0) {

        return;

    }


    let oldX = player.x;

    let oldY = player.y;


    player.x +=

        Math.cos(

            player.angle

        ) *

        dashSpeed;


    player.y +=

        Math.sin(

            player.angle

        ) *

        dashSpeed;


    for(let wall of getCurrentWalls()) {

        if(checkCollision(player, wall)) {

            player.x = oldX;

            player.y = oldY;

            dashTimer = 0;

        }

    }


    dashTimer--;

    movementLightning = 4;


    checkDashHit();

}


// ======================================================
// CHARGE ATTACK
// ======================================================

function getChargeCap() {

    if(playerClass === "hero") return maxChargeTime / 4;

    if(playerClass === "bruiser" || playerClass === "musketeer") return maxChargeTime / 2;

    if(playerClass === "battlemage") return 45;

    // A short 1.25-second charge starts the Ninja's smoke run.
    if(playerClass === "stealth") return 75;

    return maxChargeTime;

}


function startNinjaKunai() {

    playSfx("playerAbility");

    if(playerClass !== "stealth" || shieldRaised || ninjaKunai.state !== "idle") return;

    ninjaKunai = {

        state: "flying",

        x: player.x + player.width / 2,

        y: player.y + player.height / 2,

        vx: Math.cos(player.angle) * 13,

        vy: Math.sin(player.angle) * 13,

        life: 75,

        angle: player.angle

    };

}


function releaseNinjaKunai() {

    if(playerClass !== "stealth" || ninjaKunai.state === "idle") return;

    let oldX = player.x;

    let oldY = player.y;

    player.x = ninjaKunai.x - player.width / 2;

    player.y = ninjaKunai.y - player.height / 2;

    // A kunai embedded in a wall lands the Ninja at the nearest clear edge.
    for(let step = 0; step < 18 && getCurrentWalls().some(function(wall) { return checkCollision(player, wall); }); step++) {

        player.x -= Math.cos(ninjaKunai.angle) * 3;

        player.y -= Math.sin(ninjaKunai.angle) * 3;

    }

    if(gameState === "lobby" && oldManDialogue) return;

    if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) {

        player.x = oldX;

        player.y = oldY;

    }

    ninjaKunai.state = "idle";

}


function updateNinjaKunai() {

    if(playerClass !== "stealth" || ninjaKunai.state === "idle") return;

    if(ninjaKunai.state === "flying") {

        ninjaKunai.x += ninjaKunai.vx;

        ninjaKunai.y += ninjaKunai.vy;

        ninjaKunai.life--;

        if(pointHitsWall(ninjaKunai.x, ninjaKunai.y)) ninjaKunai.state = "anchored";

        else if(ninjaKunai.life <= 0 || ninjaKunai.x < 0 || ninjaKunai.x > canvas.width || ninjaKunai.y < 0 || ninjaKunai.y > canvas.height) ninjaKunai.state = "idle";

    }

}

function updateCharge() {

    if(playerClass === "mage" || playerClass === "cyborg" || playerClass === "owen" || playerClass === "musketeer" || playerClass === "berserker" || playerClass === "summoner") return;

    if(shieldRaised || (playerClass === "battlemage" && battlemageShieldTimer > 0)) return;


    if(

        mouse.down &&

        attackPressActive &&

        attackCooldown <= 0 &&

        dashTimer <= 0

    ) {

        attackHoldTime++;

        // Keep a short click window before the sword begins to charge.

        let chargeDelay = playerClass === "hero" ? 3 : playerClass === "bruiser" ? 4 : playerClass === "musketeer" ? 8 : chargeStartDelay;

        if(attackHoldTime >= chargeDelay) {

            isCharging = true;

            chargeTime = attackHoldTime - chargeDelay;

        }

        let chargeCap = getChargeCap();

        if(chargeTime >= chargeCap) {

            chargeTime = chargeCap;

            if(playerClass === "stealth") releaseAttack();

        }

    }

}


// ======================================================
// RELEASE ATTACK
// ======================================================

function releaseAttack() {


    if(!attackPressActive) {

        return;

    }


    attackPressActive = false;


    isCharging = false;

    if(shieldRaised) {

        attackHoldTime = 0;

        chargeTime = 0;

        return;

    }

    // The mage fires continuously while the button is held, so releasing it
    // never creates a separate melee attack.
    if(playerClass === "mage" || playerClass === "cyborg" || playerClass === "berserker") {

        attackHoldTime = 0;

        chargeTime = 0;

        return;

    }


    // The Bruiser's hand cannon scales continuously with the exact time it was charged.
    if(playerClass === "bruiser" && chargeTime > 0) {

        fireBruiserCannon(true, Math.min(1, chargeTime / getChargeCap()));

    }

    // Charged attacks only complete after their class-specific meter is full.
    else if(chargeTime < getChargeCap()) {

        normalAttack();

    }


    // Long hold = dash

    else if(playerClass === "stealth") {

        // Charge completion creates a visible, double-speed smoke run.
        ninjaSmokeRunTimer = 105;

        ninjaSmokeTrailTimer = 0;

        attackTimer = 0;

        attackHitboxTimer = 0;

        attackCooldown = 0;

        fireNinjaShurikens();

    }

    else if(playerClass === "battlemage") {

        fireBattlemageArc(true);

    }

    else if(playerClass === "musketeer") {

        if(musketeerOverheatTimer <= 0) fireShotgun();

        else normalAttack();

    }

    else {

        dashHitEnemies = new Set();

        dashTimer = dashDuration;

        attackCooldown = 45;

        attackTimer = 20;

        attackHitboxTimer = 15;

    }


    chargeTime = 0;

    attackHoldTime = 0;

}

// NORMAL ATTACK
// ======================================================

function normalAttack() {

    if(shieldRaised || (playerClass === "battlemage" && battlemageShieldTimer > 0)) return;

    if(playerClass !== "musketeer") playSfx("playerAttack");


    if(attackCooldown > 0) {

        return;

    }


    if(playerClass === "cyborg") {

        fireLaser();

        return;

    }

    if(playerClass === "owen") {

        owenPunch();

        return;

    }

    if(playerClass === "battlemage") {

        fireBattlemageArc(false);

        return;

    }

    if(playerClass === "musketeer") {

        fireMusketShot();

        return;

    }

    if(playerClass === "bruiser") {

        fireBruiserCannon(false);

        return;

    }

    if(playerClass === "stealth") {

        fireNinjaShurikens();

        return;

    }

    if(playerClass === "summoner") {

        summonArcaneWolf();

        return;

    }

    attackTimer = 15;

    attackHitboxTimer = 8;

    attackCooldown = 30;


    checkAttackHit(25);

}

function updateBow() {

    if(bowHeld && !shieldRaised) {

        bowCharge = Math.min(bowCharge + 1, maxBowCharge);

    }

    if(bowCooldown > 0) bowCooldown--;

}


function releaseBow() {

    if(!bowHeld) return;

    bowHeld = false;

    if(shieldRaised) {

        bowCharge = 0;

        return;

    }

    if(bowCooldown > 0 || (gameState !== "playing" && gameState !== "lobby")) {

        bowCharge = 0;

        return;

    }

    let centerX = player.x + player.width / 2;

    arrows.push({

        y: centerY,

        vy: Math.sin(player.angle) * (6 + power * 6) * PROJECTILE_SPEED_MULTIPLIER,

        angle: player.angle,

        // Fully charged damage was 70; its new 56 maximum is 20% lower.
        damage: Math.round(22 + power * 34),

        life: 70

    });

    playSfx("playerAttack");

    bowCooldown = 13;

    bowCharge = 0;

function damageEnemy(enemy, amount, scoreValue, deathEffect) {

    let bruiserRage = 1;

    if(playerClass === "bruiser") {

        // Damage rises linearly from 1x at full health to 2x at 10 HP.
        bruiserRage = 1 + Math.max(0, Math.min(1, (player.maxHealth - player.health) / Math.max(1, player.maxHealth - 10)));

    }

    let heroDamageMultiplier = playerClass === "hero" ? 1.25 * (heroModeTimer > 0 ? 2 : 1) : 1;

    enemy.health -= amount * build.damageMultiplier * bruiserRage * heroDamageMultiplier;

    // Any damage breaks Frost immediately.
    enemy.frozenTimer = 0;

    enemy.hitFlash = 12;

    spawnCombatParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, false);

    screenShake = Math.max(screenShake, 3);

    playSfx(enemy.health <= 0 ? "enemyDeath" : "enemyHit");

    if(enemy.health <= 0) {

        enemy.health = 0;

        enemy.alive = false;

        // Every boss rewards the hero with recovery and spending gold for the next level.
        if(enemy.isBoss && !enemy.bossClearHealGranted) {

            healPlayer(50);

            gold += 60;

            enemy.bossClearHealGranted = true;

            // Every guardian collapses into a substantial cloud of ash.
            let bossCenterX = enemy.x + enemy.width / 2;

            let bossCenterY = enemy.y + enemy.height / 2;

            for(let particle = 0; particle < 38; particle++) {

                let angle = Math.random() * Math.PI * 2;

                let speed = 0.8 + Math.random() * 3.4;

                ashBursts.push({x: bossCenterX + randomBetween(-10, 10), y: bossCenterY + randomBetween(-10, 10), vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1.2, life: 34 + randomBetween(0, 24), maxLife: 58, size: randomBetween(2, 5)});

            }

            activeBossDialogue = ["PLAYER", "Boss Felled.", "Another guardian has fallen before the Aronion Gauntlet."];

            gameState = "bossDialogue";

        }

        if(deathEffect === "ash") {

            let centerX = enemy.x + enemy.width / 2;

            let centerY = enemy.y + enemy.height / 2;

            for(let particle = 0; particle < 12; particle++) {

                let angle = Math.PI * 2 * particle / 12 + Math.random() * 0.35;

                let speed = 0.7 + Math.random() * 1.9;

                ashBursts.push({x: centerX, y: centerY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 0.7, life: 26 + Math.floor(Math.random() * 13), maxLife: 38, size: 2 + Math.floor(Math.random() * 3)});

            }

        }

        if(enemy.type === "slimePawn") {

            slimePuddles.push({room: enemy.room, x: enemy.x - 8, y: enemy.y - 6, width: enemy.width + 16, height: enemy.height + 12, life: 360});

            let king = enemies.find(function(candidate) { return candidate.alive && candidate.type === "slimeKing" && candidate.room === enemy.room; });

            if(king) king.spawnCooldown = Math.max(king.spawnCooldown || 0, 300);

        }

        if(enemy.isBoss) clearBossCombatRemnants(enemy);

        if(enemy.type === "dungeonHeart") beginDungeonHeartAftermath(enemy);

        if(enemy.type === "broodmother") {

            for(let pod of enemies) if(pod.alive && pod.room === enemy.room && pod.type === "broodEgg") pod.alive = false;

        }

        score += scoreValue || (enemy.type === "mage" ? 175 : 100);

    }

}


function pointHitsWall(x, y) {

    return getCurrentRoomWalls().some(function(wall) {

        return x >= wall.x && x <= wall.x + wall.width && y >= wall.y && y <= wall.y + wall.height;

    });

}


function fireLaser() {

    playSfx("playerAttack");

    if(attackCooldown > 0 || shieldRaised) return;

    let startX = player.x + player.width / 2;

    let startY = player.y + player.height / 2;

    laserEndX = startX;

    laserEndY = startY;

    for(let distance = 0; distance <= 380; distance += 4) {

        let x = startX + Math.cos(player.angle) * distance;

        let y = startY + Math.sin(player.angle) * distance;

        if(pointHitsWall(x, y)) break;

        laserEndX = x;

function resolveCyborgWaterOverlap() {

            {x: pool.x + pool.width + 1, y: player.y},
            {x: player.x, y: pool.y - player.height - 1},

        candidates.sort(function(first, second) {

            return Math.hypot(first.x - player.x, first.y - player.y) - Math.hypot(second.x - player.x, second.y - player.y);

        });

        for(let candidate of candidates) {

    for(let summon of activeSummons) {

            summon.dashVX = dx / distance * 12;

function updateMageFire() {

    mageConeActive = false;

    if(playerClass !== "mage") return;

    if(mageFireCooldown > 0) mageFireCooldown--;

    let isCasting = mouse.down && attackPressActive && !shieldRaised && magePower > 0 && mageExhaustionTimer <= 0;

    if(!isCasting) {

        magePower = Math.min(magePowerMax, magePower + 0.5);

        return;

    }

    mageConeActive = true;

    // Lightning is more demanding than the fire and frost cones.
    let manaDrain = mageAttackMode === 3 ? 0.85 * 1.5 : 0.85;

    magePower = Math.max(0, magePower - manaDrain);

    // Empty mana causes a deliberate three-second magic lockout (180 frames at 60 FPS).
    if(magePower === 0) {

        mageExhaustionTimer = 180;

        mageConeActive = false;

        return;

    }

    if(mageFireCooldown > 0) return;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    let coneHalfAngle = Math.PI * 25 / 360;

    let candidates = enemies.filter(function(enemy) {

        if(!enemy.alive || enemy.room !== currentRoom) return false;

        let enemyCenterX = enemy.x + enemy.width / 2;

        let enemyCenterY = enemy.y + enemy.height / 2;

        let dx = enemyCenterX - centerX;

        let dy = enemyCenterY - centerY;

        if(mageAttackMode === 3) {

            // Lightning calls pillars down around targets in a generous forward casting arc.
            return Math.hypot(dx, dy) <= 494 &&

                Math.abs(normalizeAngle(Math.atan2(dy, dx) - player.angle)) <= Math.PI * 0.34 &&

                hasClearShot(centerX, centerY, enemyCenterX, enemyCenterY);

        }

        return Math.hypot(dx, dy) <= 202 &&

            Math.abs(normalizeAngle(Math.atan2(dy, dx) - player.angle)) <= coneHalfAngle &&

            hasClearShot(centerX, centerY, enemyCenterX, enemyCenterY);

    });

    candidates.sort(function(a, b) {

        return Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y);

    });

    if(mageAttackMode === 1) {

        for(let enemy of candidates) damageEnemy(enemy, 18);

    }

    else if(mageAttackMode === 2) {

        for(let enemy of candidates) {

            damageEnemy(enemy, 5);

            if(enemy.alive && !enemy.freezeImmune) enemy.frozenTimer = 180;

        }

    }

    else if(candidates.length > 0) {

        let hitEnemies = [candidates[0]];

        let points = [];

        damageEnemy(candidates[0], 8.25);

        points.push({x: candidates[0].x + candidates[0].width / 2, y: candidates[0].y + candidates[0].height / 2});

        // Up to three additional jumps. New targets are preferred, but when only
        // two enemies are nearby the arc can bounce back to the original target.
        while(hitEnemies.length < 4) {

            let previous = hitEnemies[hitEnemies.length - 1];

            let previousX = previous.x + previous.width / 2;

            let previousY = previous.y + previous.height / 2;

            let nearby = enemies.filter(function(enemy) {

                return enemy.alive && enemy.room === currentRoom && enemy !== previous &&

                    Math.hypot(enemy.x + enemy.width / 2 - previousX, enemy.y + enemy.height / 2 - previousY) <= 170 &&

                    hasClearShot(previousX, previousY, enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);

            });

            // Prefer a new target, then fall back to a previously hit enemy for a two-target bounce.
            let choices = nearby.filter(function(enemy) { return !hitEnemies.includes(enemy); });

            if(choices.length === 0) choices = nearby;

            let next = choices.sort(function(a, b) {

                return Math.hypot(a.x - previousX, a.y - previousY) - Math.hypot(b.x - previousX, b.y - previousY);

            })[0];

            if(!next) break;

            damageEnemy(next, 8.25);

            hitEnemies.push(next);

            points.push({x: next.x + next.width / 2, y: next.y + next.height / 2});

        }

        lightningChains.push({points: points, origin: {x: centerX, y: centerY}, pillars: true, life: 10});

    }

    }

}


function applyEnemyBoltEffect(effect) {

    if(effect === "slow" || effect === "soulDrain" || effect === "greed") playerSlowTimer = effect === "soulDrain" ? 105 : 150;

    if(effect === "bleed") playerBleedTimer = 180;

    if(effect === "burn") playerBurnTimer = 180;

    if(effect === "freeze") playerFreezeTimer = 45;

    if(effect === "frostQueenShard") playerFreezeTimer = 70;

    if(effect === "darkness") darknessTimer = 180;

    if(effect === "chain") playerFreezeTimer = Math.max(playerFreezeTimer, 42);

}

    for(let collection of [bruiserCannonShots]) {

            shot.y += shot.vy;

            shot.life--;

            let hit = pointHitsWall(shot.x, shot.y);

    for(let i = enemyProjectiles.length - 1; i >= 0; i--) {

        let bolt = enemyProjectiles[i];

        let centerX = player.x + player.width / 2;

        let centerY = player.y + player.height / 2;

        if(bolt.effect === "homing") {

            let aim = Math.atan2(centerY - bolt.y, centerX - bolt.x);

        }

        if(bolt.effect === "gravity" && Math.hypot(centerX - bolt.x, centerY - bolt.y) < 170 && playerClass !== "owen") {

            bolt.vx = Math.cos(returnAngle) * returnSpeed;

            bolt.vy = Math.sin(returnAngle) * returnSpeed;

        }

        bolt.x += bolt.vx;

        bolt.y += bolt.vy;

        if(bolt.effect === "kingSlime") {

            bolt.slimeTrailTimer = (bolt.slimeTrailTimer === undefined ? 12 : bolt.slimeTrailTimer) - 1;

        if(bolt.effect === "rift" && !bolt.riftJumped && bolt.life < 65) {

            bolt.y = Math.max(28, Math.min(canvas.height - 28, centerY + randomBetween(-110, 110)));

        }

        if(bolt.effect === "mirror" && !bolt.mirrorTurned && bolt.life < 62) {

            bolt.mirrorTurned = true;

            let returnAngle = Math.atan2(centerY - bolt.y, centerX - bolt.x);

            let speed = Math.hypot(bolt.vx, bolt.vy);

            bolt.vx = Math.cos(returnAngle) * speed;

            bolt.vy = Math.sin(returnAngle) * speed;

        if(playerClass === "battlemage" && battlemageShieldTimer > 0 && Math.hypot(bolt.x - centerX, bolt.y - centerY) < 38) {

                continue;

            }

            enemyProjectiles.splice(i, 1);

            continue;

        let hitWall = !bolt.ignoresWalls && getCurrentRoomWalls().some(function(wall) {

        });

        let toBoltY = bolt.y - centerY;

        let lateral = Math.abs(-toBoltX * Math.sin(player.angle) + toBoltY * Math.cos(player.angle));

        // Parry only during the first 0.25 seconds of a shield raise, and only
        // for a projectile within 0.5 ft of the shield directly in front.
        if(shieldRaised && parryTimer > 0 && forward > 0 && forward < 56 && lateral < 32) {

            if(bolt.effect === "kingSlime") resolveEnemyBoltImpact(bolt);

            enemyProjectiles.splice(i, 1);

            parryShineTimer = 12;

            continue;

        }

        if(!bolt.alreadyHitPlayer && !(playerClass === "musketeer" && musketeerSmokeTimer > 0) && !(playerClass === "stealth" && ninjaSmokeRunTimer > 0) && Math.hypot(bolt.x - centerX, bolt.y - centerY) < (bolt.effect === "kingSlime" || bolt.effect === "wardenBeam" ? 36 : 18)) {

            resolveEnemyBoltImpact(bolt);

            if((bolt.effect === "piercing" || bolt.effect === "heartTendril") && !bolt.alreadyHitPlayer) {

                continue;

            bolt.vy *= -1;

            bolt.y -= bolt.vy;

    for(let i = reflectedProjectiles.length - 1; i >= 0; i--) {

            if(Math.hypot(beam.x - hitX, beam.y - hitY) < 10) {

                damageEnemy(enemy, beam.damage, 140);

                if(shot.pierces > 0) {

                    shot.pierces--;

                    shot.hitEnemies.add(enemy);

                }

                else hit = true;

            }

        }

        if(hit || beam.life <= 0 || beam.x < 0 || beam.x > canvas.width || beam.y < 0 || beam.y > canvas.height) reflectedProjectiles.splice(i, 1);

    }

}


function checkAttackHit(damage = 25) {

    // The Hero's sword sweep is intentionally twice the old reach (55 -> 110).
    let range = playerClass === "hero" ? 110 : 55;


    for(let enemy of enemies) {


        if(!enemy.alive) {

            continue;

        }


        if(enemy.room !== currentRoom) {

            continue;

        }

        let enemyCenterX =

            enemy.x +

            enemy.width / 2;


        let enemyCenterY =

            enemy.y +

            enemy.height / 2;


        let playerCenterX =

            player.x +

            player.width / 2;


        let playerCenterY =

            player.y +

            player.height / 2;


        let dx =

            enemyCenterX -

            playerCenterX;


        let dy =

            enemyCenterY -

            playerCenterY;


        let distance =

            Math.sqrt(

                dx * dx +

                dy * dy

            );


        // Test against the edge of larger bodies, not only an enemy's center, so
        // the extended arc feels dependable against bosses and big elites.
        let enemyRadius = Math.max(enemy.width, enemy.height) / 2;

        if(distance > range + enemyRadius) {

            continue;

        }


        let angleToEnemy =

            Math.atan2(

                dy,

                dx

            );


        let angleDifference =

            Math.abs(

                normalizeAngle(

                    angleToEnemy -

                    player.angle

                )

            );


        // The Hero gets a generous, smooth 245-degree sweep with the longer blade.

        if(

            angleDifference <

            playerClass === "hero" ? Math.PI * 0.68 : Math.PI * 0.55

        ) {

            damageEnemy(enemy, damage);

        }

    }

    let playerCenterX = player.x + player.width / 2;

    let playerCenterY = player.y + player.height / 2;

    damageDestructibleIceWallAt(playerCenterX + Math.cos(player.angle) * range, playerCenterY + Math.sin(player.angle) * range, damage);

}


// ======================================================
// DASH ATTACK HIT
// ======================================================

function checkDashHit() {

    if(playerClass !== "hero" && playerClass !== "bruiser") return;


    for(let enemy of enemies) {


        if(!enemy.alive) {

            continue;

        }


        if(enemy.room !== currentRoom) {

            continue;

        }

        if(dashHitEnemies.has(enemy)) {

            continue;

        }


        let distance =

            Math.hypot(

                (

                    enemy.x -

                    player.x

                ),

                (

                    enemy.y -

                    player.y

                )

            );


        if(distance < 70) {

            dashHitEnemies.add(enemy);

            damageEnemy(enemy, dashDamage, 200);

        }

    }

}


// ======================================================
// NORMALIZE ANGLE
// ======================================================

function normalizeAngle(angle) {

    while(angle > Math.PI) {

        angle -= Math.PI * 2;

    }


    while(angle < -Math.PI) {

        angle += Math.PI * 2;

    }


    return angle;

}

function drawDungeonHeartEscape() {

    drawGame();

    let progress = 1 - dungeonHeartAftermath.teleportTimer / 150;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    let consumeProgress = Math.min(1, progress / 0.74);

    let floatY = centerY - consumeProgress * 125;

    ctx.save();

    ctx.fillStyle = "rgba(5, 2, 13, " + (0.2 + consumeProgress * 0.55) + ")";

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // A fading levitating silhouette remains while the Gauntlet turns the hero into astral flakes.
    ctx.globalAlpha = 1 - consumeProgress;

    ctx.shadowColor = "#c57cff";

    ctx.shadowBlur = 20;

    ctx.fillStyle = "#f4eeff";

    ctx.fillRect(centerX - 9, floatY - 17, 18, 30);

    ctx.fillStyle = "#a951ed";

    ctx.fillRect(centerX - 12, floatY - 7, 24, 16);

    for(let flake = 0; flake < 54; flake++) {

        let angle = flake * 2.399 + progress * 5;

        let distance = 8 + consumeProgress * (34 + (flake % 8) * 12);

        let flakeX = centerX + Math.cos(angle) * distance;

        let flakeY = floatY + Math.sin(angle) * distance - consumeProgress * (flake % 5) * 9;

        ctx.globalAlpha = Math.min(1, 0.25 + consumeProgress) * (0.85 - (flake % 4) * 0.1);

        ctx.fillStyle = flake % 2 ? "#c771ff" : "#ffffff";

        ctx.fillRect(flakeX, flakeY, 2 + flake % 3, 2 + flake % 3);

    }

    let fadeToBlack = Math.max(0, (progress - 0.74) / 0.26);

    ctx.globalAlpha = fadeToBlack;

    ctx.fillStyle = "#000000";

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.restore();

    ctx.fillStyle = "#fff5ff";

    ctx.font = "bold 24px Georgia";

    ctx.textAlign = "center";

    ctx.fillText("I am now the master of this dungeon", 400, 128);

    ctx.font = "16px Arial";

    ctx.fillText("The Gauntlet consumes you in violet and white starlight...", 400, 156);

    ctx.textAlign = "left";

}


function checkDoors() {

    let roomCleared = !enemies.some(function(enemy) { return enemy.alive && enemy.room === currentRoom; });

    if(currentRoom === 70 && roomCleared) {

        return;

    }

    // Reaching the current end dynamically creates the next room, so the descent never ends.
    // The terminal wall is solid until this transition runs, so trigger slightly before it
    // pushes the player back. This keeps endless-room generation from trapping the player.
    if(player.y > 230 && player.y < 370 && currentRoom === roomCount && player.x + player.width >= 775 && roomCleared) {

        extendEndlessDungeon();

        startRoomTransition(currentRoom + 1, 25, 300);

        return;

    }

    if(player.y > 230 && player.y < 370 && currentRoom < roomCount && player.x + player.width >= 800 && roomCleared) {

        startRoomTransition(currentRoom + 1, 25, 300);

    }

    if(player.y > 230 && player.y < 370 && currentRoom > 1 && player.x <= -5) {

        startRoomTransition(currentRoom - 1, 745, 300);

    }

}

function startBossDialogueForRoom(room) {

    let boss = enemies.find(function(enemy) { return enemy.isBoss && enemy.room === room && enemy.alive; });

    let encounter = roomEncounters.find(function(candidate) { return candidate.type === "boss" && candidate.room === room; });

    // The boss owns its introduction state. This keeps an intro from being lost if
    // an encounter marker is missing or has already been consumed by room setup.
    if(!boss || boss.dialoguePlayed) return false;

    activeBossDialogue = BOSS_DIALOGUE[boss.type] || ["DUNGEON GUARDIAN", "If you seek the Aronion Gauntlet,", "you must first get through me."];

    boss.dialoguePlayed = true;

    if(encounter) encounter.used = true;

    gameState = "bossDialogue";

    return true;

}

function checkItems() {

    for(let chest of treasures) {

        if(chest.room === currentRoom && !chest.collected && checkCollision(player, chest)) {

            chest.collected = true;

            if(chest.rare && chest.reward === "heal") {

                healPlayer(60);

                score += 150;

            }

            else if(chest.rare && chest.reward === "ability") {

                traderAbility = true;

                score += 200;

            }

            else {

                gold += chest.gold;

                score += chest.gold;

            }

        }

    }

    for(let shrine of healingShrines) {

        if(shrine.room === currentRoom && !shrine.used && checkCollision(player, shrine)) {

            shrine.used = true;

            healPlayer(45);

            score += 50;

        }

    }


    if(

        currentRoom === keyRoom &&

        !key.collected &&

        checkCollision(player, key)

    ) {

        key.collected = true;

        hasKey = true;

        score += 100;

    }


    if(

        currentRoom === treasureRoom &&

        !treasure.collected &&

        checkCollision(player, treasure)

    ) {

        treasure.collected = true;

        treasureCollected = true;

        score += 500;

    }

    let shrine = shrineRooms[currentRoom];

    if(shrine && !shrine.visited && checkCollision(player, shrine)) {

        shrine.visited = true;

        shrineChoices = getClassBuffChoices();

        gameState = "blessing";

        return;

    }


    let roomEncountersHere = roomEncounters.filter(function(encounter) { return encounter.room === currentRoom; });

    if(roomEncountersHere.length === 0) return;

    for(let roomEncounter of roomEncountersHere) {

    if(roomEncounter.type === "boss") {

        let boss = enemies.find(function(enemy) { return enemy.isBoss && enemy.room === currentRoom; });

        if(boss && !boss.alive) roomEncounter.used = true;

        else if(boss && !roomEncounter.used) startBossDialogueForRoom(currentRoom);

        return;

    }

    if(roomEncounter.used || !checkCollision(player, roomEncounter)) continue;

    if(roomEncounter.type === "shrine") {

        healPlayer(50);

        score += 75;

        roomEncounter.used = true;

    }

    else if(roomEncounter.type === "trader") {

        if(!roomEncounter.perk) {

            let classPerks = getClassBuffChoices();

            roomEncounter.perk = classPerks[randomBetween(0, classPerks.length - 1)];

        }

        activeTrader = roomEncounter;

        gameState = "traderTalk";

    }

    else if(roomEncounter.type === "oldMan") {

        activeOldManEncounter = roomEncounter;

        gameState = "oldManTalk";

    }

    else if(roomEncounter.type === "evilShrine") {

        damagePlayer(25);

        score += 275;

        roomEncounter.used = true;

    }

    else if(roomEncounter.type === "cache") {

        let cacheGold = randomBetween(20, 50);

        gold += cacheGold;

        score += cacheGold;

        roomEncounter.used = true;

    }

    }

}

function getPerkRarity(perk) {

    if(perk.stat === "divineInterventionBonus" || perk.stat === "arcaneBonus") return "Rare";

    if(perk.stat === "healthBonus") return perk.value >= 30 ? "Rare" : perk.value >= 25 ? "Uncommon" : "Common";

    if(perk.value >= 0.18) return "Rare";

    if(perk.value >= 0.14) return "Uncommon";

    return "Common";

}


function chooseWeightedPerks(perks, count) {

    let weights = {Common: 60, Uncommon: 28, Rare: 12};

    let available = perks.map(function(perk) { return Object.assign({}, perk, {rarity: getPerkRarity(perk)}); });

    let choices = [];

    while(choices.length < count && available.length > 0) {

        let totalWeight = available.reduce(function(total, perk) { return total + weights[perk.rarity]; }, 0);

        let roll = Math.random() * totalWeight;

        let selectedIndex = 0;

        for(; selectedIndex < available.length - 1; selectedIndex++) {

            roll -= weights[available[selectedIndex].rarity];

            if(roll < 0) break;

        }

        choices.push(available.splice(selectedIndex, 1)[0]);

    }

    return choices;

}


function chooseShrineBuff(index) {

    let buff = shrineChoices[index];

    if(!buff) return;

    applyClassBuff(buff);

    gameState = "playing";

function applyClassBuff(buff) {

    let currentHealth = player.health;

    build[buff.stat] += buff.value;

    if(buff.stat === "divineInterventionBonus") {

        battlemageDivineInterventionMax += buff.value;

        battlemageDivineIntervention = Math.min(battlemageDivineInterventionMax, battlemageDivineIntervention + buff.value);

    }

    configurePlayerClass();

    player.health = Math.min(player.maxHealth, currentHealth + (buff.stat === "healthBonus" ? buff.value : 0));

    magePower = magePowerMax;

    gameState = "playing";

}


function updateTraps() {

    for(let index = forgeLavaPools.length - 1; index >= 0; index--) {

        let pool = forgeLavaPools[index];

        pool.life--;

        pool.radius = Math.min(pool.maxRadius, pool.radius + 0.24);

        if(pool.room === currentRoom && Math.hypot(player.x + player.width / 2 - pool.x, player.y + player.height / 2 - pool.y) < pool.radius) {

            pool.damageTimer--;

            if(pool.damageTimer <= 0) {

                damagePlayer(4);

                pool.damageTimer = 38;

            }

        }

        if(pool.life <= 0) forgeLavaPools.splice(index, 1);

    }

    for(let index = forgeLavaLines.length - 1; index >= 0; index--) {

        let line = forgeLavaLines[index];

        line.x += line.vx;

        line.life--;

        if(line.room === currentRoom && Math.abs(player.y + player.height / 2 - line.y) < 16 && Math.abs(player.x + player.width / 2 - line.x) < 34) damagePlayer(10);

        if(line.life <= 0 || line.x > canvas.width || line.x < 0) forgeLavaLines.splice(index, 1);

    }

    for(let index = slimePuddles.length - 1; index >= 0; index--) {

        slimePuddles[index].life--;

        if(slimePuddles[index].life <= 0) slimePuddles.splice(index, 1);

    }

    for(let wall of arrowWalls) {

        if(wall.room !== currentRoom) continue;

        wall.timer--;

        if(wall.timer <= 0) {

            // Both wall holes fire at once, creating the requested back-and-forth lane.
            arrowWallShots.push({room: currentRoom, x: 28, y: wall.y, vx: 7, vy: 0, damage: 5});

            arrowWallShots.push({room: currentRoom, x: 772, y: wall.y, vx: -7, vy: 0, damage: 5});

            wall.timer = 105;

        }

    }

    for(let index = arrowWallShots.length - 1; index >= 0; index--) {

        let shot = arrowWallShots[index];

        shot.x += shot.vx;

        let hitWall = pointHitsWall(shot.x, shot.y);

        let hit = hitWall;

        if(Math.hypot(shot.x - (player.x + player.width / 2), shot.y - (player.y + player.height / 2)) < 17) {

            damagePlayer(shot.damage);

            hit = true;

        }

        for(let enemy of enemies) {

            if(hit || !enemy.alive || enemy.room !== currentRoom) continue;

            let closestX = Math.max(enemy.x, Math.min(shot.x, enemy.x + enemy.width));

            let closestY = Math.max(enemy.y, Math.min(shot.y, enemy.y + enemy.height));

            if(Math.hypot(shot.x - closestX, shot.y - closestY) < 5) {

                enemy.health -= shot.damage;

                enemy.hitFlash = 6;

                if(enemy.health <= 0) {

                    if(enemy.isBoss) damageEnemy(enemy, 0, 100);

                    else { enemy.health = 0; enemy.alive = false; score += 100; }

                }

                hit = true;

            }

        }

        if(hit || shot.x < 0 || shot.x > canvas.width) arrowWallShots.splice(index, 1);

    }

    for(let rock of fallingRocks) {

        if(rock.room !== currentRoom) continue;

        if(rock.cooldown > 0) {

            rock.cooldown--;

            continue;

        }

        if(rock.impactTimer > 0) rock.impactTimer--;

        if(rock.fallingTimer > 0) {

            rock.fallingTimer--;

            if(rock.fallingTimer === 0) {

                rock.impactTimer = 12;

                let rockCenterX = rock.x + rock.width / 2;

                let rockCenterY = rock.y + rock.height / 2;

                if(Math.hypot(rockCenterX - (player.x + player.width / 2), rockCenterY - (player.y + player.height / 2)) < 42) damagePlayer(5);

                for(let enemy of enemies) {

                    if(!enemy.alive || enemy.room !== currentRoom) continue;

                    if(Math.hypot(rockCenterX - (enemy.x + enemy.width / 2), rockCenterY - (enemy.y + enemy.height / 2)) < 42) {

                        enemy.health -= 5;

                        enemy.hitFlash = 8;

                        if(enemy.health <= 0) {

                            if(enemy.isBoss) damageEnemy(enemy, 0, 100);

                            else { enemy.health = 0; enemy.alive = false; score += 100; }

                        }

                    }

                }

                rock.cooldown = 180;

            }

            continue;

        }

        let steppedOn = checkCollision(player, rock);

        if(!steppedOn) steppedOn = enemies.some(function(enemy) { return enemy.alive && enemy.room === currentRoom && checkCollision(enemy, rock); });

        if(steppedOn) rock.fallingTimer = 28;

    }

    for(let pit of firePits) {

        if(pit.room !== currentRoom) continue;

        if(pit.eruptionTimer > 0) {

            pit.eruptionTimer--;

            if(pit.eruptionTimer === 17) {

                let pitCenterX = pit.x + pit.width / 2;

                let pitCenterY = pit.y + pit.height / 2;

                if(Math.hypot(pitCenterX - (player.x + player.width / 2), pitCenterY - (player.y + player.height / 2)) < 31) damagePlayer(5);

                for(let enemy of enemies) {

                    if(!enemy.alive || enemy.room !== currentRoom) continue;

                    if(Math.hypot(pitCenterX - (enemy.x + enemy.width / 2), pitCenterY - (enemy.y + enemy.height / 2)) < 31) {

                        enemy.health -= 5;

                        enemy.hitFlash = 8;

                        if(enemy.health <= 0) {

                            if(enemy.isBoss) damageEnemy(enemy, 0, 100);

                            else { enemy.health = 0; enemy.alive = false; score += 100; }

                        }

                    }

                }

            }

            continue;

        }

        pit.timer--;

        if(pit.timer <= 0) {

            pit.eruptionTimer = 18;

            pit.timer = 120;

        }

    }

}

function extendEndlessDungeon() {

    let previousFinalRoom = roomCount;

    let room = previousFinalRoom + 1;

    roomCount = room;

    // The former final room becomes a normal pass-through room once a new one exists.
    rooms[previousFinalRoom] = createRoomBorder(previousFinalRoom);

    rooms[room] = createRoomBorder(room);

    torches[room] = [{x: 95, y: 20, side: "top"}, {x: 705, y: 20, side: "top"}, {x: 120, y: 580, side: "bottom"}, {x: 680, y: 580, side: "bottom"}];

    waterPools[room] = [{x: 70 + (room * 37) % 150, y: 70, width: 110, height: 34}, {x: 585, y: 430 + (room * 23) % 65, width: 105, height: 34}];

    // Each later boss is likewise followed by the Old Man instead of a trader.
    if(room > 1 && (room - 1) % 10 === 0 && room < 70) {

        roomEncounters.push({type: "oldMan", room: room, x: 383, y: 273, width: 34, height: 34, used: false});

        return;

    }

    if(room === 29) {

        roomEncounters.push({type: "trader", traderMood: "warning", room: room, x: 383, y: 273, width: 34, height: 34, used: false});

        return;

    }

function hasClearShot(fromX, fromY, toX, toY) {

    let steps = Math.ceil(Math.hypot(toX - fromX, toY - fromY) / 4);

    for(let step = 1; step < steps; step++) {

        let progress = step / steps;

        let x = fromX + (toX - fromX) * progress;

        let y = fromY + (toY - fromY) * progress;

        for(let wall of getCurrentRoomWalls()) {

            if(x >= wall.x && x <= wall.x + wall.width && y >= wall.y && y <= wall.y + wall.height) {

                return false;

            }

        }

    }

    return true;

}


function enemyCanHitPlayer(enemy, target = player) {

    let enemyCenterX = enemy.x + enemy.width / 2;

    let enemyCenterY = enemy.y + enemy.height / 2;

    let playerCenterX = target.x + target.width / 2;

    let playerCenterY = target.y + target.height / 2;

    let dx = playerCenterX - enemyCenterX;

    let dy = playerCenterY - enemyCenterY;

    let distance = Math.hypot(dx, dy);

    // A 70-degree attack cone means the player must be in front of the enemy
    // at the instant its swing lands, not merely touching any side of it.
    let facingDifference = Math.abs(Math.atan2(Math.sin(Math.atan2(dy, dx) - enemy.attackAngle), Math.cos(Math.atan2(dy, dx) - enemy.attackAngle)));

    return distance <= enemy.attackRange + player.width / 2 && facingDifference <= Math.PI * 70 / 360;

}

function getActiveSummonerBear() {

    return arcaneSummons.find(function(summon) {

        return summon.room === currentRoom && summon.health > 0 && (summon.type === "bear" || summon.type === "menagerieBear");

    });

}

function damageArcaneSummon(summon, amount) {

    if(!summon || summon.health <= 0) return false;

    // The bear is a temporary invulnerable taunt, not another health bar.
    if(summon.type === "bear" || summon.type === "menagerieBear") {

        summon.attackFlash = 8;

        return true;

    }

    summon.health -= amount;

    summon.attackFlash = 8;

    if(summon.health <= 0) {

        summon.health = 0;

        smokeClouds.push({x: summon.x + summon.width / 2, y: summon.y + summon.height / 2, life: 28, color: summon.color, glow: "#ffffff"});

        arcaneSummons = arcaneSummons.filter(function(candidate) { return candidate !== summon; });

    }

    return true;

}


function moveEnemyWithWallCollision(enemy, moveX, moveY) {

    let oldX = enemy.x;

    enemy.x += moveX;

    if(getCurrentWalls().some(function(wall) { return checkCollision(enemy, wall); })) {

        enemy.x = oldX;

    }

    let oldY = enemy.y;

    enemy.y += moveY;

    if(getCurrentWalls().some(function(wall) { return checkCollision(enemy, wall); })) {

        enemy.y = oldY;

    }

    if(enemy.x !== oldX || enemy.y !== oldY) enemy.runTimer = 6;

}


function spawnSlimePawn(king) {
