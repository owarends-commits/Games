}


function drawPlayer() {

    drawBerserkerEffects();

    let hiddenBySmoke = playerClass === "musketeer" && musketeerSmokeTimer > 0;

    if(hiddenBySmoke) {

        ctx.save();

        ctx.globalAlpha = 0.22;

    }

    let running = movementLightning > 0;

    if(running) {

        ctx.save();

        ctx.translate(0, Math.sin(Date.now() * 0.035) * 2);

    }

    let model = PLAYER_MODEL_PROFILES[playerClass];

    let crimsonLift = playerClass === "owen" && owenChestBeamActive ? 9 + Math.sin(Date.now() * 0.018) * 2 : 0;

    ctx.save();

    ctx.translate(player.x + player.width / 2, player.y + player.height / 2 - crimsonLift);

    ctx.scale(player.width / model.baseWidth, player.height / model.baseHeight);

    ctx.translate(-(player.x + model.baseWidth / 2), -(player.y + model.baseHeight / 2));

    if(playerClass === "cyborg") drawCyborg();

    else if(playerClass === "mage") drawWizard();

    else if(playerClass === "bruiser") drawBruiser();

    else if(playerClass === "berserker") drawBerserker();

    else if(playerClass === "stealth") drawStealth();

    else if(playerClass === "musketeer") drawMusketeer();

    else if(playerClass === "owen") drawOwen();

    else if(playerClass === "battlemage") drawBattlemage();

    else if(playerClass === "summoner") drawSummoner();

    else drawKnight();

    drawClassModelAccents();

    ctx.restore();

    if(parryShineTimer > 0) drawParryShine();

    if(running) ctx.restore();

    if(hiddenBySmoke) ctx.restore();

    return;


    if(

        damageCooldown > 0 &&

        Math.floor(

            damageCooldown / 5

        ) % 2 === 0

    ) {

        ctx.fillStyle = "white";

    }

    else {

        ctx.fillStyle = "#36d45b";

    }


    ctx.fillRect(

        player.x,

        player.y,

        player.width,

        player.height

    );


    ctx.fillStyle = "#d6a36a";


    ctx.fillRect(

        player.x + 6,

        player.y + 4,

        16,

        16

    );


    // Direction indicator

    ctx.strokeStyle = "white";

    ctx.lineWidth = 3;


    ctx.beginPath();


    ctx.moveTo(

        player.x +

        player.width / 2,

        player.y +

        player.height / 2

    );


    ctx.lineTo(

        player.x +

        player.width / 2 +

        Math.cos(player.angle) *

        18,

        player.y +

        player.height / 2 +

        Math.sin(player.angle) *

        18

    );


    ctx.stroke();


    ctx.lineWidth = 1;

}

function drawLightningSegment(x1, y1, x2, y2) {

    let midX = (x1 + x2) / 2 + (Math.random() - 0.5) * 10;

    let midY = (y1 + y2) / 2 + (Math.random() - 0.5) * 10;

    ctx.beginPath();

    ctx.moveTo(x1, y1);

    ctx.lineTo(midX, midY);

        50,

        0

    );

    }

    // Rendering follows the held Shift state, while damage is still pulsed separately.

    if(playerClass === "owen" && owenChestBeamActive) {

        let startX = player.x + player.width / 2;

        let lift = 9 + Math.sin(Date.now() * 0.018) * 2;

        let startY = player.y + player.height * 0.37 - lift;

        // The chest core ruptures outward before the focused beam can escape.
        ctx.fillStyle = "rgba(255, 54, 71, 0.28)";

        ctx.shadowColor = "#ff1d32";

        ctx.shadowBlur = 22;

        ctx.beginPath();

        ctx.arc(startX, startY, 17 + Math.sin(Date.now() * 0.026) * 4, 0, Math.PI * 2);

        ctx.fill();

        for(let burst = 0; burst < 12; burst++) {

            let burstAngle = burst * Math.PI * 2 / 12 + Date.now() * 0.008;

            let burstDistance = 13 + (burst % 3) * 6;

            ctx.fillStyle = burst % 2 ? "#ffffff" : "#ff3d4d";

            ctx.fillRect(startX + Math.cos(burstAngle) * burstDistance - 2, startY + Math.sin(burstAngle) * burstDistance - 2, 4, 4);

        ctx.shadowBlur = 24;

        ctx.lineWidth = 11;

        ctx.beginPath();

        ctx.moveTo(startX, startY);

        ctx.lineTo(owenBeamEndX, owenBeamEndY);

        ctx.stroke();

        ctx.strokeStyle = "#fff2d1";

        ctx.shadowBlur = 0;

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(startX, startY);

        ctx.lineTo(owenBeamEndX, owenBeamEndY);

        ctx.stroke();

        // Electrical red forks flicker along the otherwise solid beam core.
        let beamDX = owenBeamEndX - startX;

        let beamDY = owenBeamEndY - startY;

        let beamLength = Math.hypot(beamDX, beamDY) || 1;

        let normalX = -beamDY / beamLength;

        let normalY = beamDX / beamLength;

        ctx.strokeStyle = "#ff5260";

        ctx.shadowColor = "#ff111f";

        ctx.shadowBlur = 16;

        ctx.lineWidth = 2;

        for(let fork = 1; fork <= 4; fork++) {

            ctx.lineTo(forkX + normalX * 11 * side + beamDX / beamLength * 6, forkY + normalY * 11 * side + beamDY / beamLength * 6);

        ctx.stroke();

        ctx.strokeStyle = "#ffe2a3";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(shot.x, shot.y, shot.radius, shot.angle - Math.PI / 8, shot.angle + Math.PI / 8);

        ctx.stroke();

    }

    for(let pellet of shotgunPellets) {

        ctx.fillStyle = "#ffcc72";

        ctx.shadowColor = "#ff8f3d";

        ctx.shadowBlur = 8;

        ctx.beginPath();

        ctx.arc(pellet.x, pellet.y, 3, 0, Math.PI * 2);

        ctx.fill();

    }

    for(let bolt of enemyProjectiles) {

        ctx.fillStyle = bolt.color || "#742bda";

        ctx.shadowColor = bolt.color || "#c26cff";

        ctx.shadowBlur = 12;

        if(bolt.effect === "moltenHammer") {

            ctx.beginPath();

            ctx.arc(bolt.x, bolt.y, 13, 0, Math.PI * 2);

            ctx.fillStyle = "#ff672e";

            ctx.fill();

            ctx.fillStyle = "#ffe080";

            ctx.fillRect(bolt.x - 4, bolt.y - 5, 7, 5);

            // Molten droplets trail behind the hammer as it crosses the room.
            ctx.fillStyle = "#ff4e20";

            for(let drip = 1; drip <= 3; drip++) {

                let trailX = bolt.x - bolt.vx * drip * 1.7;

                let trailY = bolt.y - bolt.vy * drip * 1.7 + drip * 3;

                ctx.fillRect(trailX - 2, trailY, 4, 5 + drip * 2);

            }

        } else if(bolt.effect === "forgeSword") {

            ctx.save();

            ctx.translate(bolt.x, bolt.y);

            ctx.rotate(Math.atan2(bolt.vy, bolt.vx));

            ctx.fillStyle = "#ffb34d";

            ctx.fillRect(-18, -2, 31, 4);

            ctx.fillStyle = "#fff0b0";

            ctx.fillRect(-14, -1, 24, 1);

            ctx.fillStyle = "#c63d26";

            ctx.fillRect(-4, -6, 4, 12);

            ctx.fillStyle = "#ff6b25";

            ctx.fillRect(-14, 4, 22, 3);

            ctx.restore();

        } else if(bolt.effect === "broodGlob") {

            ctx.beginPath();

            ctx.arc(bolt.x, bolt.y, 15, 0, Math.PI * 2);

            ctx.fillStyle = "#b91535";

            ctx.fill();

            ctx.fillStyle = "#ff8c89";

            ctx.fillRect(bolt.x - 5, bolt.y - 7, 7, 5);

            // Small swelling bubbles make the projectile look like living plague.
            ctx.beginPath();

            ctx.arc(bolt.x + 7, bolt.y + 5, 4, 0, Math.PI * 2);

            ctx.arc(bolt.x - 8, bolt.y + 6, 3, 0, Math.PI * 2);

            ctx.fill();

        } else if(bolt.effect === "spectralSword") {

            ctx.save();

            ctx.translate(bolt.x, bolt.y);

            ctx.rotate(Math.atan2(bolt.vy, bolt.vx));

            ctx.fillStyle = "#bdf5ff";

            ctx.fillRect(-18, -2, 30, 4);

            ctx.fillStyle = "#ffffff";

            ctx.fillRect(-15, -1, 25, 1);

            ctx.fillStyle = "#6a81c8";

            ctx.fillRect(-4, -6, 4, 12);

            ctx.fillRect(-18, -3, 5, 6);

            ctx.restore();

        } else if(bolt.effect === "wardenBeam") {

            ctx.save();

            ctx.translate(bolt.x, bolt.y);

            ctx.rotate(Math.atan2(bolt.vy, bolt.vx));

            ctx.fillStyle = "#ffcf45";

            ctx.fillRect(-26, -9, 52, 18);

            ctx.fillStyle = "#fff5ba";

            ctx.fillRect(-26, -2, 52, 4);

            ctx.restore();

        } else if(bolt.effect === "frostQueenShard") {

            ctx.save();

            ctx.translate(bolt.x, bolt.y);

            ctx.rotate(Math.atan2(bolt.vy, bolt.vx));

            ctx.fillStyle = "#bff7ff";

            ctx.fillRect(-16, -7, 32, 14);

            ctx.fillStyle = "#efffff";

            ctx.fillRect(-16, -2, 32, 4);

            ctx.restore();

        } else if(bolt.effect === "ironCannon") {

            ctx.beginPath();

            ctx.arc(bolt.x, bolt.y, 14, 0, Math.PI * 2);

            ctx.fill();

            ctx.fillStyle = "#ffd07a";

            ctx.fillRect(bolt.x - 4, bolt.y - 4, 8, 8);

        } else if(bolt.effect === "bloodSplit") {

            ctx.beginPath();

            ctx.arc(bolt.x, bolt.y, 10, 0, Math.PI * 2);

            ctx.fill();

            ctx.fillStyle = "#ff6574";

            ctx.fillRect(bolt.x - 3, bolt.y - 3, 6, 6);

        } else if(bolt.effect === "kingSlime") {

            ctx.beginPath();

            ctx.arc(bolt.x, bolt.y, 16, 0, Math.PI * 2);

            ctx.fill();

            ctx.fillStyle = "#b0ff9e";

            ctx.fillRect(bolt.x - 6, bolt.y - 7, 8, 5);

            ctx.fillRect(bolt.x + 4, bolt.y + 3, 5, 4);

        } else if(bolt.effect === "bleed") {

            ctx.beginPath();

            ctx.moveTo(bolt.x, bolt.y - 8);

            ctx.lineTo(bolt.x + 6, bolt.y + 7);

            ctx.lineTo(bolt.x - 6, bolt.y + 7);

            ctx.fill();

        } else if(bolt.effect === "heartTendril") {

            ctx.save();

            ctx.translate(bolt.x, bolt.y);

            ctx.rotate(Math.atan2(bolt.vy, bolt.vx));

            // The lash remains visually tethered to its launch point like the Heart's wall vines.
            ctx.strokeStyle = "#671326";

            ctx.lineWidth = 7;

            ctx.beginPath();

            ctx.moveTo(-58, 0);

            ctx.quadraticCurveTo(-30, Math.sin(Date.now() * 0.02) * 8, 0, 0);

            ctx.stroke();

            ctx.strokeStyle = "#c42d42";

            ctx.lineWidth = 2;

            ctx.stroke();

            ctx.fillStyle = "#e24a57";

            ctx.beginPath();

            ctx.moveTo(16, 0);

            ctx.lineTo(-3, -7);

            ctx.lineTo(-3, 7);

            ctx.fill();

            ctx.restore();

        } else if(bolt.effect === "piercing") {

            ctx.save();

            ctx.translate(bolt.x, bolt.y);

            ctx.rotate(Math.atan2(bolt.vy, bolt.vx));

            ctx.fillRect(-12, -2, 24, 4);

            ctx.restore();

        } else if(bolt.effect === "heartBlood") {

            ctx.fillStyle = "#df3345";

            ctx.beginPath();

            ctx.arc(bolt.x, bolt.y, 4, 0, Math.PI * 2);

            ctx.fill();

            ctx.fillStyle = "#ff9a9d";

            ctx.fillRect(bolt.x - 1, bolt.y - 2, 2, 2);

        } else if(bolt.effect === "splinter") {

            ctx.fillRect(bolt.x - 5, bolt.y - 5, 10, 10);

            ctx.fillStyle = "#e9ffff";

            ctx.fillRect(bolt.x - 2, bolt.y - 7, 4, 14);

        } else if(bolt.sourceType) {

            drawCharacterProjectile(bolt);

        } else {

            ctx.beginPath();

            ctx.arc(bolt.x, bolt.y, bolt.effect === "poisonCloud" || bolt.effect === "explosion" ? 9 : 6, 0, Math.PI * 2);

            ctx.fill();

            if(bolt.effect === "homing") { ctx.fillStyle = "#1c1028"; ctx.fillRect(bolt.x - 2, bolt.y - 2, 4, 4); }

        }

    }

    for(let beam of reflectedProjectiles) {

        let length = Math.hypot(beam.vx, beam.vy) || 1;

        ctx.strokeStyle = "#fff6b8";

        ctx.shadowColor = "#fff08a";

        ctx.shadowBlur = 20;

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(beam.x - beam.vx / length * 34, beam.y - beam.vy / length * 34);

        ctx.lineTo(beam.x, beam.y);

        ctx.stroke();

        ctx.strokeStyle = "#ffffff";

        ctx.shadowBlur = 0;

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(beam.x - beam.vx / length * 34, beam.y - beam.vy / length * 34);

        ctx.lineTo(beam.x, beam.y);

        ctx.stroke();

    }

    for(let blast of energyBlasts) {

        ctx.fillStyle = "#67f7ff";

        ctx.shadowColor = "#10c7ff";

        ctx.shadowBlur = 24;

        ctx.beginPath();

        ctx.arc(blast.x, blast.y, 14, 0, Math.PI * 2);

        ctx.fill();

        ctx.fillStyle = "#efffff";

        ctx.beginPath();

        ctx.arc(blast.x, blast.y, 6, 0, Math.PI * 2);

        ctx.fill();

    }

    for(let fireball of fireballs) {

        ctx.fillStyle = "#ff8a22";

        ctx.shadowColor = "#ff3d00";

        ctx.shadowBlur = 16;

        ctx.beginPath();

        ctx.arc(fireball.x, fireball.y, 7, 0, Math.PI * 2);

        ctx.fill();

    }

    for(let explosion of explosions) {

        // Some attacks, including the Ironclad cannon, use a lifetime above
        // 18 frames. Canvas arcs reject negative radii, which previously
        // stopped the entire frame loop as soon as one of those blasts drew.
        let radius = Math.max(1, (18 - explosion.life) * 2 + 8);

        ctx.globalAlpha = Math.max(0, Math.min(1, explosion.life / 18));

        ctx.strokeStyle = "#b8ffff";

        ctx.shadowColor = "#12dfff";

        ctx.shadowBlur = 20;

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(explosion.x, explosion.y, radius, 0, Math.PI * 2);

        ctx.stroke();

        ctx.globalAlpha = 1;

    }

    if(laserTimer > 0) {

        let centerX = player.x + player.width / 2;

        let centerY = player.y + player.height / 2;

        ctx.strokeStyle = "#50f6ff";

        ctx.shadowColor = "#0ccfff";

        ctx.shadowBlur = 20;

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(centerX, centerY);

        ctx.lineTo(laserEndX, laserEndY);

        ctx.stroke();

    }

    if(grapplingHook.state !== "idle") {

        let centerX = player.x + player.width / 2;

        let centerY = player.y + player.height / 2;

        ctx.strokeStyle = "#b9c7d2";

        ctx.shadowColor = "#7c8d9d";

        ctx.shadowBlur = 6;

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(centerX, centerY);

        ctx.lineTo(grapplingHook.x, grapplingHook.y);

        ctx.stroke();

        ctx.fillStyle = grapplingHook.state === "anchored" ? "#ffd166" : "#dbe9f4";

        ctx.beginPath();

        ctx.arc(grapplingHook.x, grapplingHook.y, 5, 0, Math.PI * 2);

        ctx.fill();

    }

    if(ninjaKunai.state !== "idle") {

        ctx.save();

        ctx.translate(ninjaKunai.x, ninjaKunai.y);

        ctx.rotate(ninjaKunai.angle);

        ctx.strokeStyle = ninjaKunai.state === "anchored" ? "#aeb8ff" : "#e4e9ff";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(-8, 0);

        ctx.lineTo(7, 0);

        ctx.stroke();

        ctx.fillStyle = "#7b89d6";

        ctx.beginPath();

        ctx.moveTo(9, 0);

        ctx.lineTo(4, -4);

        ctx.lineTo(4, 4);

        ctx.fill();

        ctx.restore();

    }

    ctx.restore();

}


function drawMageAttackEffects() {

    if(playerClass !== "mage") return;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    if(mageConeActive) {

        ctx.save();

        ctx.translate(centerX, centerY);

        ctx.rotate(player.angle);

        let halfAngle = Math.PI * 25 / 360;

        if(mageAttackMode === 1) {

            // Fire is a hot, layered cone with individual flame tongues.
            ctx.fillStyle = "rgba(255, 74, 20, 0.22)";

            ctx.shadowColor = "#ff4d18";

            ctx.shadowBlur = 22;

            ctx.beginPath();

            ctx.moveTo(0, 0);

            ctx.arc(0, 0, 202, -halfAngle, halfAngle);

            ctx.closePath();

            ctx.fill();

            for(let flame = 0; flame < 9; flame++) {

                let distance = 28 + flame * 14;

                let sway = Math.sin(Date.now() * 0.014 + flame * 2.7) * halfAngle * 0.72;

                let width = 5 + (flame % 3) * 2;

                ctx.fillStyle = flame % 2 ? "#ff7a1f" : "#ffd45a";

                ctx.beginPath();

                ctx.moveTo(distance - 12, sway * distance * 0.35);

                ctx.lineTo(distance + 14, sway * distance);

                ctx.lineTo(distance - 5, sway * distance + width);

                ctx.fill();

            }

        }

        else if(mageAttackMode === 2) {

            // Frost spreads as a pale mist lined with spinning ice shards.
            ctx.fillStyle = "rgba(116, 226, 255, 0.20)";

            ctx.shadowColor = "#8cecff";

            ctx.shadowBlur = 18;

            ctx.beginPath();

            ctx.moveTo(0, 0);

            ctx.arc(0, 0, 202, -halfAngle, halfAngle);

            ctx.closePath();

            ctx.fill();

            for(let shard = 0; shard < 8; shard++) {

                let distance = 30 + shard * 16;

                let angle = -halfAngle * 0.82 + (shard % 4) * halfAngle * 0.54 + Math.sin(Date.now() * 0.004 + shard) * 0.06;

                let shardX = Math.cos(angle) * distance;

                let shardY = Math.sin(angle) * distance;

                ctx.fillStyle = shard % 2 ? "#d9fbff" : "#78dff8";

                ctx.beginPath();

                ctx.moveTo(shardX + 9, shardY);

                ctx.lineTo(shardX, shardY - 5);

                ctx.lineTo(shardX - 7, shardY + 3);

                ctx.lineTo(shardX + 1, shardY + 7);

                ctx.fill();

            }

        }

        else {

            // Lightning charges in the Mage's hands; the actual attack arrives as target pillars.
            ctx.strokeStyle = "#eab7ff";

            ctx.shadowColor = "#aa63ff";

            ctx.shadowBlur = 20;

            ctx.lineWidth = 3;

            for(let spark = 0; spark < 4; spark++) {

                let angle = Date.now() * 0.012 + spark * Math.PI / 2;

                ctx.beginPath();

                ctx.moveTo(Math.cos(angle) * 8, Math.sin(angle) * 8);

                ctx.lineTo(Math.cos(angle + 0.7) * 25, Math.sin(angle + 0.7) * 25);

                ctx.stroke();

            }

        }

        ctx.restore();

    }

    ctx.save();

    ctx.strokeStyle = "#e2b8ff";

    ctx.shadowColor = "#a855f7";

    ctx.shadowBlur = 14;

    ctx.lineWidth = 3;

    for(let chain of lightningChains) {

        if(chain.pillars) {

            for(let target of chain.points) {

                for(let strike = 0; strike < 3; strike++) {

                    let offset = (strike - 1) * 10 + Math.sin(Date.now() * 0.04 + strike * 4) * 3;

                    ctx.strokeStyle = strike === 1 ? "#ffffff" : "#b66cff";

                    ctx.lineWidth = strike === 1 ? 3 : 2;

                    ctx.beginPath();

                    ctx.moveTo(target.x + offset, target.y - 72);

                    for(let segment = 1; segment < 5; segment++) {

                        let progress = segment / 5;

                        ctx.lineTo(target.x + offset + Math.sin(Date.now() * 0.05 + segment * 5 + strike) * 9, target.y - 72 + progress * 94);

                    }

                    ctx.lineTo(target.x + offset, target.y + 22);

                    ctx.stroke();

                }

                // Short grasping arcs claw from the pillar toward the caster rather than forming one straight beam.
                let dx = (chain.origin ? chain.origin.x : centerX) - target.x;

                let dy = (chain.origin ? chain.origin.y : centerY) - target.y;

                ctx.strokeStyle = "#d9a7ff";

                ctx.lineWidth = 2;

                for(let claw = 0; claw < 2; claw++) {

                    ctx.beginPath();

                    ctx.moveTo(target.x + (claw ? 12 : -12), target.y);

                    ctx.lineTo(target.x + dx * 0.22 + (claw ? 9 : -9), target.y + dy * 0.22);

                    ctx.lineTo(target.x + dx * 0.38, target.y + dy * 0.38);

                    ctx.stroke();

                }

            }

            continue;

        }

        if(chain.points.length < 2) continue;

        for(let point = 1; point < chain.points.length; point++) {

            let from = chain.points[point - 1];

            let to = chain.points[point];

            let dx = to.x - from.x;

            let dy = to.y - from.y;

            ctx.beginPath();

            ctx.moveTo(from.x, from.y);

            for(let step = 1; step < 5; step++) {

                let progress = step / 5;

                let perpendicular = Math.sin(Date.now() * 0.025 + point * 7 + step) * 6;

                ctx.lineTo(from.x + dx * progress - dy / Math.max(1, Math.hypot(dx, dy)) * perpendicular, from.y + dy * progress + dx / Math.max(1, Math.hypot(dx, dy)) * perpendicular);

            }

            ctx.lineTo(to.x, to.y);

            ctx.stroke();

        }

    }

    ctx.restore();

}


function drawBowCharge() {

    if(!bowHeld) return;

    let percent = bowCharge / maxBowCharge;

    let x = player.x - 12;

    let y = player.y - 31;

    ctx.fillStyle = "#1b1623";

    ctx.fillRect(x, y, 52, 6);

    ctx.fillStyle = percent >= 0.7 ? "#f5c451" : "#c98942";

    ctx.fillRect(x, y, 52 * percent, 6);

    ctx.strokeStyle = "#fff2c2";

    ctx.strokeRect(x, y, 52, 6);

}


function drawDashEffect() {


    if(dashTimer <= 0) {

        return;

    }


    ctx.save();


    ctx.globalAlpha =

        dashTimer /

        12;


    ctx.fillStyle = "#9be7ff";


    ctx.beginPath();


    ctx.arc(

        player.x +

        player.width / 2,

        player.y +

        player.height / 2,

        35,

        0,

        Math.PI * 2

    );


    ctx.fill();


    ctx.restore();

}

function drawChargeIndicator() {

    );

function drawLighting() {


    // Much lighter darkness overlay

    ctx.fillStyle =

        darknessTimer > 0 ? "rgba(0,0,0,0.62)" : "rgba(0,0,0,0.28)";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    // Player light

    drawLight(

        player.x +

        player.width / 2,

        player.y +

        player.height / 2,

        darknessTimer > 0 ? 100 : 220

    );


    // Torch lights

    for(let torch of torches[currentRoom]) {


        drawLight(

            torch.x,

            torch.y,

            150

        );

    }

}


// ======================================================
// LIGHT
// ======================================================

function drawLight(

    x,

    y,

    radius

) {


    let gradient =

        ctx.createRadialGradient(

            x,

            y,

            0,

            x,

            y,

            radius

        );


    gradient.addColorStop(

        0,

        "rgba(255,255,255,0.40)"

    );


    gradient.addColorStop(

        0.5,

        "rgba(255,255,255,0.15)"

    );


    gradient.addColorStop(

        1,

        "rgba(255,255,255,0)"

    );


    ctx.fillStyle = gradient;


    ctx.beginPath();


    ctx.arc(

        x,

        y,

        radius,

        0,

        Math.PI * 2

    );


    ctx.fill();

}

function drawBossHealthBar() {

    let king = enemies.find(function(enemy) { return enemy.alive && enemy.room === currentRoom && enemy.isBoss; });

    if(!king) return;

    let x = 220;

    let y = 16;

    let width = 360;

    let percent = Math.max(0, king.health / king.maxHealth);

    ctx.save();

    ctx.fillStyle = "#17131a";

    ctx.fillRect(x, y, width, 28);

    ctx.strokeStyle = "#f0bf47";

    ctx.lineWidth = 3;

    ctx.strokeRect(x, y, width, 28);

    ctx.fillStyle = king.type === "phantomKing" ? "#4b5b9d" : king.type === "broodmother" ? "#587c2f" : king.type === "forgemaster" ? "#b54828" : "#316b45";

    ctx.fillRect(x + 4, y + 17, (width - 8) * percent, 7);

    ctx.fillStyle = king.type === "phantomKing" ? "#b8ecff" : king.type === "broodmother" ? "#c7f16c" : king.type === "forgemaster" ? "#ffbf59" : "#77e37a";

    ctx.fillRect(x + 4, y + 17, Math.max(0, (width - 8) * percent - 3), 2);

    ctx.fillStyle = "#fff2b0";

    ctx.font = "bold 14px Courier New";

    ctx.textAlign = "center";

    let bossName = king.type === "phantomKing" ? "THE PHANTOM KING" : king.type === "broodmother" ? "THE BROODMOTHER" : king.type === "forgemaster" ? "THE INFERNAL FORGEMASTER" : king.type === "frostboundQueen" ? "THE FROSTBOUND QUEEN" : king.type === "voidwalker" ? "THE VOIDWALKER" : king.type === "dungeonHeart" ? "THE DUNGEON HEART" : "SLIME KING";

    let phaseText = king.type === "phantomKing" ? "  PHASE " + king.phase + (king.possessionName ? " — " + king.possessionName : "") : (king.type === "broodmother" || king.type === "forgemaster" || king.type === "frostboundQueen" || king.type === "voidwalker") ? "  PHASE " + king.phase : "";

    ctx.fillText(bossName + phaseText + "  " + Math.ceil(king.health) + " / " + king.maxHealth, x + width / 2, y + 13);

    ctx.restore();

}

function drawRoomTransition() {

    if(!roomTransition) return;

    if(roomTransition.timer === 18 && !roomTransition.switched) {

        let previousRoom = currentRoom;

        currentRoom = roomTransition.nextRoom;

        maybeSpawnLowHealthShrine(currentRoom);

        player.x = roomTransition.entryX;

        player.y = roomTransition.entryY;

        // Active companions follow their summoner through the doorway. Their timers,
        // cooldowns, and combat state are preserved; only their safe room position changes.
        let carriedSummons = arcaneSummons.filter(function(summon) { return summon.room === previousRoom; });

        for(let index = 0; index < carriedSummons.length; index++) {

            let summon = carriedSummons[index];

            let offsetX = -26 + index * 26;

            let offsetY = index % 2 === 0 ? -20 : 20;

            let spawn = findSafeSummonSpawn(player.x + offsetX, player.y + offsetY, summon.width, summon.height);

            summon.room = currentRoom;

            summon.x = spawn.x;

            summon.y = spawn.y;

            summon.moving = false;

            summon.dashTimer = 0;

        }

        roomTransition.switched = true;

    }

    let outgoing = roomTransition.timer > 18;

    let progress = outgoing ? (36 - roomTransition.timer) / 18 : (18 - roomTransition.timer) / 18;

    let scale = outgoing ? 1 + progress * 0.45 : 1.45 - progress * 0.45;

    ctx.save();

    ctx.translate(canvas.width / 2, canvas.height / 2);

    ctx.scale(scale, scale);

    ctx.translate(-canvas.width / 2, -canvas.height / 2);

    drawGame();

    ctx.restore();

    ctx.fillStyle = "rgba(0, 0, 0, " + (outgoing ? progress : 1 - progress) + ")";

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    roomTransition.timer--;

    if(roomTransition.timer < 0) {

        gameState = roomTransition.nextState;

        roomTransition = null;

        // Boss introductions begin on room entry instead of after walking to the boss.
        if(gameState === "playing") startBossDialogueForRoom(currentRoom);

    }

}


function maybeSpawnLowHealthShrine(room) {

    let healthPercent = player.health / Math.max(1, player.maxHealth);

    if(isBossOrShrineRoom(room) || healthPercent > 0.50 || healingShrines.some(function(shrine) { return shrine.room === room; })) return;

    // The lower the health, the more likely a large emergency shrine appears on entry.
    let chance = 0.30 + (0.50 - healthPercent) * 1.0;

    if(Math.random() >= chance) return;

    let corners = [{x: 42, y: 48}, {x: 700, y: 48}, {x: 42, y: 500}, {x: 700, y: 500}];

    let position = corners.find(function(corner) { return roomHasOpenSpace(room, corner.x, corner.y, 58, 70); });

    if(position) healingShrines.push({room: room, x: position.x, y: position.y, width: 58, height: 70, used: false});

}

    ctx.save();

    ctx.translate((leftEdge + rightEdge) / 2, 0);

function updateBruiserDash() {

    if(bruiserDashTimer <= 0) return;

    let oldX = player.x;

    let oldY = player.y;

    player.x += Math.cos(player.angle) * 5;

    player.y += Math.sin(player.angle) * 5;

    if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) {

        player.x = oldX;

        player.y = oldY;

        bruiserDashTimer = 0;

        return;

    }

    bruiserDashTimer--;

    checkBruiserStrike(42, 46);

}


function checkBruiserStrike(damage, range) {

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    for(let enemy of enemies) {

        if(!enemy.alive || enemy.room !== currentRoom || bruiserDashHitEnemies.has(enemy)) continue;

        let dx = enemy.x + enemy.width / 2 - centerX;

        let dy = enemy.y + enemy.height / 2 - centerY;

        let distance = Math.hypot(dx, dy);

        let angleDifference = Math.abs(normalizeAngle(Math.atan2(dy, dx) - player.angle));

        if(distance <= range && angleDifference <= Math.PI / 3) {

            bruiserDashHitEnemies.add(enemy);

            damageEnemy(enemy, damage);

        }

    }

    let playerCenterX = player.x + player.width / 2;

    let playerCenterY = player.y + player.height / 2;

    damageDestructibleIceWallAt(playerCenterX + Math.cos(player.angle) * range, playerCenterY + Math.sin(player.angle) * range, damage);

}


function checkBruiserSweep() {

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    for(let enemy of enemies) {

        // Two-metre radial slam: every enemy around the Bruiser is hit.
        if(enemy.alive && enemy.room === currentRoom && Math.hypot(enemy.x + enemy.width / 2 - centerX, enemy.y + enemy.height / 2 - centerY) <= 120) damageEnemy(enemy, 62);

    }

}


function knockbackAndStunEnemy(enemy, originX, originY, distance, stunFrames) {

    let dx = enemy.x + enemy.width / 2 - originX;

    let dy = enemy.y + enemy.height / 2 - originY;

    let length = Math.hypot(dx, dy) || 1;

    // Move in short validated steps. This prevents large bear knockbacks from
    // tunnelling through terrain or pushing an enemy beyond the map edge.
    let stepCount = Math.max(1, Math.ceil(distance / 4));

    let stepX = dx / length * distance / stepCount;

    let stepY = dy / length * distance / stepCount;

    for(let step = 0; step < stepCount; step++) {

        let nextX = Math.max(20, Math.min(canvas.width - enemy.width - 20, enemy.x + stepX));

        let nextY = Math.max(20, Math.min(canvas.height - enemy.height - 20, enemy.y + stepY));

        let candidate = {x: nextX, y: nextY, width: enemy.width, height: enemy.height};

        if(getCurrentWalls().some(function(wall) { return checkCollision(candidate, wall); })) break;

        enemy.x = nextX;

        enemy.y = nextY;

    }

    enemy.stunTimer = Math.max(enemy.stunTimer || 0, stunFrames);

}


function bruiserShockwave(x, y) {

    bruiserShockwaves.push({x: x, y: y, life: 22});

    screenShake = Math.max(screenShake, 12);

    for(let enemy of enemies) {

        if(!enemy.alive || enemy.room !== currentRoom) continue;

        if(Math.hypot(enemy.x + enemy.width / 2 - x, enemy.y + enemy.height / 2 - y) <= 118) {

            damageEnemy(enemy, 48);

            knockbackAndStunEnemy(enemy, x, y, 42, 30);

        }

    }

}


function startBruiserCharge() {

    playSfx("playerAbility");

    if(playerClass !== "bruiser" || shieldRaised || bruiserDashTimer > 0 || bruiserChargeTimer > 0 || bruiserChargeCooldown > 0) return;

    bruiserChargeTimer = 24;

    bruiserChargeCooldown = 180;

    bruiserChargeHitEnemies = new Set();

}


function updateBruiserCharge() {

    if(bruiserChargeTimer <= 0) return;

    let oldX = player.x;

    let oldY = player.y;

    player.x += Math.cos(player.angle) * 10;

    player.y += Math.sin(player.angle) * 10;

    if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) {

        player.x = oldX;

        player.y = oldY;

        bruiserChargeTimer = 0;

        bruiserShockwave(player.x + player.width / 2, player.y + player.height / 2);

        return;

    }

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    for(let enemy of enemies) {

        if(!enemy.alive || enemy.room !== currentRoom || bruiserChargeHitEnemies.has(enemy)) continue;

        if(Math.hypot(enemy.x + enemy.width / 2 - centerX, enemy.y + enemy.height / 2 - centerY) <= 42) {

            bruiserChargeHitEnemies.add(enemy);

            damageEnemy(enemy, 58);

            knockbackAndStunEnemy(enemy, centerX, centerY, 46, 30);

        }

    }

    bruiserChargeTimer--;

}


function drawDeathSequence() {

    drawGame();

    let progress = 1 - deathTimer / 100;

    ctx.fillStyle = "rgba(150, 0, 0, " + (0.15 + progress * 0.8) + ")";

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255,255,255," + progress + ")";

    ctx.font = "42px Georgia";

    ctx.textAlign = "center";

    ctx.fillText("YOU DIED", 400, 300);

    ctx.textAlign = "left";

}

// ======================================================
// CLICK TO RESTART
// ======================================================

canvas.addEventListener("click", function(e) {

    updateCanvasPointer(e);

    if(suppressNextCanvasClick) {

        suppressNextCanvasClick = false;

        return;

    }


    // Some browsers suppress a canvas mousedown while activating audio. The
    // click fallback keeps title and class selection responsive in that case.
    if(gameState === "start" && mouse.x >= 280 && mouse.x <= 520 && mouse.y >= 330 && mouse.y <= 420) {

        gameState = "classSelect";

        return;

    }

    if(gameState === "start" && mouse.x >= 280 && mouse.x <= 520 && mouse.y >= 490 && mouse.y <= 570) {

        classInfoScroll = 0;

        gameState = "classInfo";

        return;

    }

    if(gameState === "classSelect" && choosePlayerClass(mouse.x, mouse.y)) {

        currentRoom = 0;

        player.x = 100;

        player.y = 300;

        oldManDialogue = false;

        oldManDialoguePage = 0;

        gameState = "lobby";

        return;

    }

    if(

        gameState === "won" ||

        gameState === "gameover"

    ) {

        resetGame();

    }

});


// ======================================================
// MAIN GAME LOOP
// ======================================================

function gameLoop() {


    if(gameState === "start") {

        drawTitleScreen();

    }

    else if(gameState === "enemyCodex") {

        drawEnemyCodex();

    }

    else if(gameState === "classInfo") {

        drawClassInformation();

    }

    else if(gameState === "classSelect") {

        drawStartScreen();

    }

    else if(gameState === "bossDialogue") {

        drawBossDialogue();

    }

    else if(gameState === "lobby") {

        updateCharge();

        updateMageFire();

        updateBow();

        movePlayer();

        updateCyborgGatling();

        updateCyborgThruster();

        updateOwenPowers();

        updateArcaneSummons();

        updateDash();

        updateBruiserDash();

        updateBruiserCharge();

        updateBerserker();

        updateBattlemageCharge();

        updateGrapplingHook();

        updateNinjaKunai();

        updateProjectiles();

        updateCombat();

        updateDamageCooldown();

        drawLobby();

    }


    else if(gameState === "playing") {


        updateCharge();

        updateMageFire();

        updateBow();


        movePlayer();

        updateCyborgGatling();

        updateCyborgThruster();

        updateOwenPowers();

        updateArcaneSummons();


        updateDash();

        updateBruiserDash();

        updateBruiserCharge();

        updateBerserker();

        updateBattlemageCharge();

        updateGrapplingHook();

        updateNinjaKunai();


        updateEnemies();

        updateTraps();

        updateProjectiles();


        updateCombat();


        updateDamageCooldown();


        drawGame();

    }

    else if(gameState === "blessing") {

        drawBlessingScreen();

    }

    else if(gameState === "trading") {

        drawTraderScreen();

    }

    else if(gameState === "traderTalk") {

        drawTraderTalk();

    }

    else if(gameState === "oldManTalk") {

        drawOldManTalk();

    }

    else if(gameState === "oldManVanish") {

        updateOldManVanish();

        drawOldManVanish();

    }

    else if(gameState === "transition") {

        drawRoomTransition();

    }

    else if(gameState === "heartEscape") {

        updateDungeonHeartEscape();

        drawDungeonHeartEscape();

    }

    else if(gameState === "dying") {

        deathTimer--;

        drawDeathSequence();

        if(deathTimer <= 0) gameState = "gameover";

    }


    else if(gameState === "won") {

        drawWinScreen();

    }


    else if(gameState === "gameover") {

        drawGameOverScreen();

    }


    requestAnimationFrame(gameLoop);

}


// ======================================================
// START
// ======================================================

generateDungeon();

gameLoop();

</script>
