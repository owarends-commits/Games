    let hiddenByNinjaVeil = playerClass === "stealth" && ninjaInvisibilityTimer > 0;

    if(hiddenBySmoke || hiddenByNinjaVeil) {

        ctx.save();

        ctx.globalAlpha = hiddenByNinjaVeil ? 0.12 : 0.22;

    }

    let running = movementLightning > 0;

    if(running) {

        ctx.save();

        ctx.translate(0, Math.sin(Date.now() * 0.035) * 2);

    }

    if(playerClass === "cyborg") drawCyborg();

    else if(playerClass === "mage") drawWizard();

    else if(playerClass === "bruiser") drawBruiser();

    else if(playerClass === "stealth") drawStealth();

    else if(playerClass === "musketeer") drawMusketeer();

    else if(playerClass === "owen") drawOwen();

    else drawKnight();

    if(parryShineTimer > 0) drawParryShine();

    if(running) ctx.restore();

    if(hiddenBySmoke || hiddenByNinjaVeil) ctx.restore();

    return;


    if(

        damageCooldown > 0 &&

        Math.floor(

            damageCooldown / 5

        ) % 2 === 0

    ) {

        ctx.fillStyle = "white";

    }

    else {

        ctx.fillStyle = "#36d45b";

    }


    ctx.fillRect(

        player.x,

        player.y,

        player.width,

        player.height

    );


    ctx.fillStyle = "#d6a36a";


    ctx.fillRect(

        player.x + 6,

        player.y + 4,

        16,

        16

    );


    // Direction indicator

    ctx.strokeStyle = "white";

    ctx.lineWidth = 3;


    ctx.beginPath();


    ctx.moveTo(

        player.x +

        player.width / 2,

        player.y +

        player.height / 2

    );


    ctx.lineTo(

        player.x +

        player.width / 2 +

        Math.cos(player.angle) *

        18,

        player.y +

        player.height / 2 +

        Math.sin(player.angle) *

        18

    );


    ctx.stroke();


    ctx.lineWidth = 1;

}

function drawLightningSegment(x1, y1, x2, y2) {

    let midX = (x1 + x2) / 2 + (Math.random() - 0.5) * 10;

    let midY = (y1 + y2) / 2 + (Math.random() - 0.5) * 10;

    ctx.beginPath();

    ctx.moveTo(x1, y1);

    ctx.lineTo(midX, midY);

    ctx.lineTo(x2, y2);

    ctx.stroke();

}


function drawLightningEffects() {

    let cx = player.x + player.width / 2;

    let cy = player.y + player.height / 2;

    ctx.save();

    ctx.strokeStyle = "#a9f6ff";

    ctx.shadowColor = "#38bdf8";

    ctx.shadowBlur = 14;

    ctx.lineWidth = 2;

    if(movementLightning > 0) {

        let tailX = cx - Math.cos(player.angle) * 18;

        let tailY = cy - Math.sin(player.angle) * 18;

        drawLightningSegment(cx, cy, tailX, tailY);

        drawLightningSegment(tailX, tailY, tailX - 8, tailY + 5);

    }

    if(attackTimer > 0) {

        let tipX = cx + Math.cos(player.angle) * 58;

        let tipY = cy + Math.sin(player.angle) * 58;

        drawLightningSegment(cx, cy, tipX, tipY);

        drawLightningSegment(tipX, tipY, tipX - Math.sin(player.angle) * 16, tipY + Math.cos(player.angle) * 16);

    }

    ctx.restore();

}

function drawParryShine() {

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    let flash = parryShineTimer / 12;

    ctx.save();

    ctx.translate(centerX, centerY);

    ctx.rotate(player.angle);

    ctx.globalAlpha = Math.min(1, flash * 1.5);

    ctx.strokeStyle = "#ffe36b";

    ctx.shadowColor = "#ffd23f";

    ctx.shadowBlur = 18;

    ctx.lineWidth = 4;

    // The flash is positioned just in front of the character, directly on the raised shield.
    ctx.strokeRect(12, -13, 10, 26);

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(7, 0);

    ctx.lineTo(28, 0);

    ctx.moveTo(17, -18);

    ctx.lineTo(17, 18);

    ctx.stroke();

    ctx.restore();

}


function drawAttack() {


    // Every non-Hero class uses its own attack animation rather than the sword sweep.
    if(playerClass !== "hero") {

        drawClassAttackAnimation();

        return;

    }


    if(attackTimer <= 0) {

        return;

    }


    let centerX =

        player.x +

        player.width / 2;


    let centerY =

        player.y +

        player.height / 2;


    ctx.save();


    ctx.translate(

        centerX,

        centerY

    );


    ctx.rotate(

        player.angle

    );


    // Sweep the slash through the aim direction instead of leaving a static arc.

    let sweepProgress = 1 - Math.min(attackTimer, 15) / 15;

    ctx.rotate(-0.9 + sweepProgress * 1.8);

    ctx.globalAlpha = 0.25 + sweepProgress * 0.7;

    ctx.shadowColor = "#8be9ff";

    ctx.shadowBlur = 16;

    ctx.strokeStyle =

        "#66d9ff";


    ctx.lineWidth = 13;


    ctx.beginPath();


    ctx.arc(

        0,

        0,

        48,

        -0.9,

        0.9

    );


    ctx.stroke();


    ctx.shadowBlur = 0;

    ctx.strokeStyle = "white";

    ctx.lineWidth = 3;


    ctx.beginPath();


    ctx.moveTo(

        10,

        -35

    );


    ctx.lineTo(

        50,

        0

    );


    ctx.lineTo(

        10,

        35

    );


    ctx.stroke();


    ctx.restore();


    ctx.lineWidth = 1;

}

        ctx.strokeStyle = "#ff2634";

function drawProjectiles() {

    ctx.save();

    for(let smoke of smokeClouds) {

        let progress = 1 - smoke.life / 24;

        ctx.globalAlpha = smoke.life / 24;

        ctx.fillStyle = "#a7a0b6";

        ctx.beginPath();

        ctx.arc(smoke.x, smoke.y, 14 + progress * 28, 0, Math.PI * 2);

        ctx.fill();

    }

    ctx.globalAlpha = 1;

    for(let arrow of arrows) {

        ctx.translate(arrow.x, arrow.y);

        ctx.rotate(arrow.angle);

    ctx.strokeStyle = "#e6c48a";

    ctx.lineWidth = 2;

    ctx.shadowColor = "#8be9ff";

    ctx.shadowBlur = 8;

        ctx.beginPath();

        ctx.moveTo(-8, 0);

        ctx.lineTo(8, 0);

        ctx.stroke();

        ctx.fillStyle = "#d9e3e8";

        ctx.beginPath();

        ctx.moveTo(10, 0);

        ctx.lineTo(5, -3);

        ctx.lineTo(5, 3);

        ctx.fill();

        ctx.rotate(-arrow.angle);

        ctx.translate(-arrow.x, -arrow.y);

    }

    for(let shot of musketShots) {

        ctx.fillStyle = "#ffe8a3";

        ctx.shadowColor = "#ffb347";

        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(shot.x, shot.y, 4, 0, Math.PI * 2);

        ctx.fill();

    }

    for(let shuriken of ninjaShurikens) {

        ctx.save();

        ctx.translate(shuriken.x, shuriken.y);

        ctx.rotate(shuriken.angle + (shuriken.life % 4) * Math.PI / 4);

        ctx.fillStyle = "#d9e3ef";

        ctx.fillRect(-7, -2, 14, 4);

        ctx.fillRect(-2, -7, 4, 14);

        ctx.fillStyle = "#71839a";

        ctx.fillRect(-2, -2, 4, 4);

        ctx.restore();

    }

    for(let shot of cyborgShots) {

        ctx.fillStyle = "#a8ffff";

        ctx.shadowColor = "#27eaff";

        ctx.shadowBlur = 12;

        ctx.fillRect(shot.x - 3, shot.y - 3, 6, 6);

        ctx.fillStyle = "#42bfff";

        ctx.fillRect(shot.x - 6, shot.y - 1, 5, 2);

    }

    if(cyborgThrusterBeamTimer > 0) {

        let centerX = player.x + player.width / 2;

        let centerY = player.y + player.height / 2;

        ctx.strokeStyle = "#3defff";

        ctx.shadowColor = "#159dff";

        ctx.shadowBlur = 22;

        ctx.lineWidth = 9;

        ctx.beginPath();

        ctx.moveTo(centerX, centerY);

        ctx.lineTo(cyborgBeamEndX, cyborgBeamEndY);

        ctx.stroke();

        ctx.strokeStyle = "#efffff";

        ctx.shadowBlur = 0;

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(centerX, centerY);

        ctx.lineTo(cyborgBeamEndX, cyborgBeamEndY);

        ctx.stroke();

    }

    // Rendering follows the held Shift state, while damage is still pulsed separately.
    // This keeps the chest beam as one solid, continuous line instead of flickering.
    if(playerClass === "owen" && owenChestBeamActive) {

        let startX = player.x + player.width / 2;

        let startY = player.y + player.height * 0.37;

        ctx.strokeStyle = "#ff2e38";

        ctx.shadowColor = "#ff0718";

        ctx.shadowBlur = 24;

        ctx.lineWidth = 11;

        ctx.beginPath();

        ctx.moveTo(startX, startY);

        ctx.lineTo(owenBeamEndX, owenBeamEndY);

        ctx.stroke();

        ctx.strokeStyle = "#fff2d1";

        ctx.shadowBlur = 0;

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(startX, startY);

        ctx.lineTo(owenBeamEndX, owenBeamEndY);

        ctx.stroke();

        // Electrical red forks flicker along the otherwise solid beam core.
        let beamDX = owenBeamEndX - startX;

        let beamDY = owenBeamEndY - startY;

        let beamLength = Math.hypot(beamDX, beamDY) || 1;

        let normalX = -beamDY / beamLength;

        let normalY = beamDX / beamLength;

        ctx.strokeStyle = "#ff5260";

        ctx.shadowColor = "#ff111f";

        ctx.shadowBlur = 16;

        ctx.lineWidth = 2;

        for(let fork = 1; fork <= 4; fork++) {

            let progress = ((Date.now() / 85 + fork * 0.23) % 1) * 0.72 + 0.12;

            let forkX = startX + beamDX * progress;

            let forkY = startY + beamDY * progress;

            let side = fork % 2 === 0 ? 1 : -1;

            ctx.beginPath();

            ctx.moveTo(forkX, forkY);

            ctx.lineTo(forkX + normalX * 11 * side + beamDX / beamLength * 6, forkY + normalY * 11 * side + beamDY / beamLength * 6);

            ctx.lineTo(forkX + normalX * 20 * side, forkY + normalY * 20 * side);

            ctx.stroke();

        }

    }

    // Beam kills leave a fast, drifting pile of ash instead of a normal body.
    for(let ash of ashBursts) {

        ctx.globalAlpha = Math.max(0, ash.life / ash.maxLife);

        ctx.fillStyle = ash.life > 16 ? "#c8d3db" : "#747b84";

        ctx.fillRect(Math.round(ash.x), Math.round(ash.y), ash.size, ash.size);

    }

    ctx.globalAlpha = 1;

    for(let pellet of shotgunPellets) {

        ctx.fillStyle = "#ffcc72";

        ctx.shadowColor = "#ff8f3d";

        ctx.shadowBlur = 8;

        ctx.beginPath();

        ctx.arc(pellet.x, pellet.y, 3, 0, Math.PI * 2);

        ctx.fill();

    }

    for(let bolt of enemyProjectiles) {

        ctx.fillStyle = bolt.color || "#742bda";

        ctx.shadowColor = bolt.color || "#c26cff";

        ctx.shadowBlur = 12;

        ctx.beginPath();

        ctx.arc(bolt.x, bolt.y, bolt.effect === "slow" ? 8 : 6, 0, Math.PI * 2);

        ctx.fill();

    }

    for(let beam of reflectedProjectiles) {

        let length = Math.hypot(beam.vx, beam.vy) || 1;

        ctx.strokeStyle = "#fff6b8";

        ctx.shadowColor = "#fff08a";

        ctx.shadowBlur = 20;

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(beam.x - beam.vx / length * 34, beam.y - beam.vy / length * 34);

        ctx.lineTo(beam.x, beam.y);

        ctx.stroke();

        ctx.strokeStyle = "#ffffff";

        ctx.shadowBlur = 0;

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(beam.x - beam.vx / length * 34, beam.y - beam.vy / length * 34);

        ctx.lineTo(beam.x, beam.y);

        ctx.stroke();

    }

    for(let blast of energyBlasts) {

        ctx.fillStyle = "#67f7ff";

        ctx.shadowColor = "#10c7ff";

        ctx.shadowBlur = 24;

        ctx.beginPath();

        ctx.arc(blast.x, blast.y, 14, 0, Math.PI * 2);

        ctx.fill();

        ctx.fillStyle = "#efffff";

        ctx.beginPath();

        ctx.arc(blast.x, blast.y, 6, 0, Math.PI * 2);

        ctx.fill();

    }

    for(let fireball of fireballs) {

        ctx.fillStyle = "#ff8a22";

        ctx.shadowColor = "#ff3d00";

        ctx.shadowBlur = 16;

        ctx.beginPath();

        ctx.arc(fireball.x, fireball.y, 7, 0, Math.PI * 2);

        ctx.fill();

    }

    for(let explosion of explosions) {

        let radius = (18 - explosion.life) * 2 + 8;

        ctx.globalAlpha = explosion.life / 18;

        ctx.strokeStyle = "#b8ffff";

        ctx.shadowColor = "#12dfff";

        ctx.shadowBlur = 20;

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(explosion.x, explosion.y, radius, 0, Math.PI * 2);

        ctx.stroke();

        ctx.globalAlpha = 1;

    }

    if(laserTimer > 0) {

        let centerX = player.x + player.width / 2;

        let centerY = player.y + player.height / 2;

        ctx.strokeStyle = "#50f6ff";

        ctx.shadowColor = "#0ccfff";

        ctx.shadowBlur = 20;

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(centerX, centerY);

        ctx.lineTo(laserEndX, laserEndY);

        ctx.stroke();

    }

    if(grapplingHook.state !== "idle") {

        let centerX = player.x + player.width / 2;

        let centerY = player.y + player.height / 2;

        ctx.strokeStyle = "#b9c7d2";

        ctx.shadowColor = "#7c8d9d";

        ctx.shadowBlur = 6;

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(centerX, centerY);

        ctx.lineTo(grapplingHook.x, grapplingHook.y);

        ctx.stroke();

        ctx.fillStyle = grapplingHook.state === "anchored" ? "#ffd166" : "#dbe9f4";

        ctx.beginPath();

        ctx.arc(grapplingHook.x, grapplingHook.y, 5, 0, Math.PI * 2);

        ctx.fill();

    }

    if(ninjaKunai.state !== "idle") {

        ctx.save();

        ctx.translate(ninjaKunai.x, ninjaKunai.y);

        ctx.rotate(ninjaKunai.angle);

        ctx.strokeStyle = ninjaKunai.state === "anchored" ? "#aeb8ff" : "#e4e9ff";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(-8, 0);

        ctx.lineTo(7, 0);

        ctx.stroke();

        ctx.fillStyle = "#7b89d6";

        ctx.beginPath();

        ctx.moveTo(9, 0);

        ctx.lineTo(4, -4);

        ctx.lineTo(4, 4);

        ctx.fill();

        ctx.restore();

    }

    ctx.restore();

}


function drawMageAttackEffects() {

    if(playerClass !== "mage") return;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    if(mageConeActive) {

        ctx.save();

        ctx.translate(centerX, centerY);

        ctx.rotate(player.angle);

        let halfAngle = Math.PI * 25 / 360;

        if(mageAttackMode === 1) {

            // Fire is a hot, layered cone with individual flame tongues.
            ctx.fillStyle = "rgba(255, 74, 20, 0.22)";

            ctx.shadowColor = "#ff4d18";

            ctx.shadowBlur = 22;

            ctx.beginPath();

            ctx.moveTo(0, 0);

            ctx.arc(0, 0, 155, -halfAngle, halfAngle);

            ctx.closePath();

            ctx.fill();

            for(let flame = 0; flame < 9; flame++) {

                let distance = 28 + flame * 14;

                let sway = Math.sin(Date.now() * 0.014 + flame * 2.7) * halfAngle * 0.72;

                let width = 5 + (flame % 3) * 2;

                ctx.fillStyle = flame % 2 ? "#ff7a1f" : "#ffd45a";

                ctx.beginPath();

                ctx.moveTo(distance - 12, sway * distance * 0.35);

                ctx.lineTo(distance + 14, sway * distance);

                ctx.lineTo(distance - 5, sway * distance + width);

                ctx.fill();

            }

        }

        else if(mageAttackMode === 2) {

            // Frost spreads as a pale mist lined with spinning ice shards.
            ctx.fillStyle = "rgba(116, 226, 255, 0.20)";

            ctx.shadowColor = "#8cecff";

            ctx.shadowBlur = 18;

            ctx.beginPath();

            ctx.moveTo(0, 0);

            ctx.arc(0, 0, 155, -halfAngle, halfAngle);

            ctx.closePath();

            ctx.fill();

            for(let shard = 0; shard < 8; shard++) {

                let distance = 30 + shard * 16;

                let angle = -halfAngle * 0.82 + (shard % 4) * halfAngle * 0.54 + Math.sin(Date.now() * 0.004 + shard) * 0.06;

                let shardX = Math.cos(angle) * distance;

                let shardY = Math.sin(angle) * distance;

                ctx.fillStyle = shard % 2 ? "#d9fbff" : "#78dff8";

                ctx.beginPath();

                ctx.moveTo(shardX + 9, shardY);

                ctx.lineTo(shardX, shardY - 5);

                ctx.lineTo(shardX - 7, shardY + 3);

                ctx.lineTo(shardX + 1, shardY + 7);

                ctx.fill();

            }

        }

        else {

            // Lightning is a focused beam. Chain arcs are drawn separately after a hit.
            ctx.strokeStyle = "#eab7ff";

            ctx.shadowColor = "#aa63ff";

            ctx.shadowBlur = 20;

            ctx.lineWidth = 7;

            ctx.beginPath();

            ctx.moveTo(4, 0);

            ctx.lineTo(380, 0);

            ctx.stroke();

            ctx.strokeStyle = "#ffffff";

            ctx.shadowBlur = 0;

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.moveTo(4, 0);

            ctx.lineTo(380, 0);

            ctx.stroke();

        }

        ctx.restore();

    }

    ctx.save();

    ctx.strokeStyle = "#e2b8ff";

    ctx.shadowColor = "#a855f7";

    ctx.shadowBlur = 14;

    ctx.lineWidth = 3;

    for(let chain of lightningChains) {

        if(chain.points.length < 2) continue;

        for(let point = 1; point < chain.points.length; point++) {

            let from = chain.points[point - 1];

            let to = chain.points[point];

            let dx = to.x - from.x;

            let dy = to.y - from.y;

            ctx.beginPath();

            ctx.moveTo(from.x, from.y);

            for(let step = 1; step < 5; step++) {

                let progress = step / 5;

                let perpendicular = Math.sin(Date.now() * 0.025 + point * 7 + step) * 6;

                ctx.lineTo(from.x + dx * progress - dy / Math.max(1, Math.hypot(dx, dy)) * perpendicular, from.y + dy * progress + dx / Math.max(1, Math.hypot(dx, dy)) * perpendicular);

            }

            ctx.lineTo(to.x, to.y);

            ctx.stroke();

        }

    }

    ctx.restore();

}

// ======================================================
// LIGHT
// ======================================================

function drawLight(

    x,

    y,

    radius

) {


    let gradient =

        ctx.createRadialGradient(

            x,

            y,

            0,

            x,

            y,

            radius

        );


    gradient.addColorStop(

        0,

        "rgba(255,255,255,0.40)"

    );


    gradient.addColorStop(

        0.5,

        "rgba(255,255,255,0.15)"

    );


    gradient.addColorStop(

        1,

        "rgba(255,255,255,0)"

    );


    ctx.fillStyle = gradient;


    ctx.beginPath();


    ctx.arc(

        x,

        y,

        radius,

        0,

        Math.PI * 2

    );


    ctx.fill();

}

function buyTraderOffer(index) {

    let offers = [{name: "Small Heal", cost: 30, heal: 25}, {name: "Medium Heal", cost: 70, heal: 50}, {name: "Relic Nova", cost: 160, ability: true}];

    let offer = offers[index];

    if(!offer || gold < offer.cost) return;

    if(offer.ability && traderAbility) return;

    gold -= offer.cost;

    if(offer.ability) traderAbility = true;

    else player.health = Math.min(player.maxHealth, player.health + offer.heal);

    if(activeTrader) activeTrader.used = true;

    activeTrader = null;

    gameState = "playing";

}

        roomTransition.switched = true;

    }

    let outgoing = roomTransition.timer > 18;

    let progress = outgoing ? (36 - roomTransition.timer) / 18 : (18 - roomTransition.timer) / 18;

    let scale = outgoing ? 1 + progress * 0.45 : 1.45 - progress * 0.45;

    ctx.save();

    ctx.translate(canvas.width / 2, canvas.height / 2);

    ctx.scale(scale, scale);

    ctx.translate(-canvas.width / 2, -canvas.height / 2);

    drawGame();

    ctx.restore();

    ctx.fillStyle = "rgba(0, 0, 0, " + (outgoing ? progress : 1 - progress) + ")";

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    roomTransition.timer--;

    if(roomTransition.timer < 0) {

        gameState = roomTransition.nextState;

        roomTransition = null;

    }

}

function updateBruiserDash() {

    if(bruiserDashTimer <= 0) return;

    let oldX = player.x;

    let oldY = player.y;

    player.x += Math.cos(player.angle) * 5;

    player.y += Math.sin(player.angle) * 5;

    if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) {

        player.x = oldX;

        player.y = oldY;

        bruiserDashTimer = 0;

        return;

    }

    bruiserDashTimer--;

    checkBruiserStrike(42, 46);

}


function checkBruiserStrike(damage, range) {

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    for(let enemy of enemies) {

        if(!enemy.alive || enemy.room !== currentRoom || bruiserDashHitEnemies.has(enemy)) continue;

        let dx = enemy.x + enemy.width / 2 - centerX;

        let dy = enemy.y + enemy.height / 2 - centerY;

        let distance = Math.hypot(dx, dy);

        let angleDifference = Math.abs(normalizeAngle(Math.atan2(dy, dx) - player.angle));

        if(distance <= range && angleDifference <= Math.PI / 3) {

            bruiserDashHitEnemies.add(enemy);

            damageEnemy(enemy, damage);

        }

    }

}


function checkBruiserSweep() {

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    for(let enemy of enemies) {

        // Two-metre radial slam: every enemy around the Bruiser is hit.
        if(enemy.alive && enemy.room === currentRoom && Math.hypot(enemy.x + enemy.width / 2 - centerX, enemy.y + enemy.height / 2 - centerY) <= 120) damageEnemy(enemy, 62);

    }

}


function knockbackAndStunEnemy(enemy, originX, originY, distance, stunFrames) {

    let dx = enemy.x + enemy.width / 2 - originX;

    let dy = enemy.y + enemy.height / 2 - originY;

    let length = Math.hypot(dx, dy) || 1;

    let oldX = enemy.x;

    let oldY = enemy.y;

    enemy.x += dx / length * distance;

    enemy.y += dy / length * distance;

    if(getCurrentWalls().some(function(wall) { return checkCollision(enemy, wall); })) {

        enemy.x = oldX;

        enemy.y = oldY;

    }

    enemy.stunTimer = Math.max(enemy.stunTimer || 0, stunFrames);

}


function bruiserShockwave(x, y) {

    bruiserShockwaves.push({x: x, y: y, life: 22});

    screenShake = Math.max(screenShake, 12);

    for(let enemy of enemies) {

        if(!enemy.alive || enemy.room !== currentRoom) continue;

        if(Math.hypot(enemy.x + enemy.width / 2 - x, enemy.y + enemy.height / 2 - y) <= 118) {

            damageEnemy(enemy, 48);

            knockbackAndStunEnemy(enemy, x, y, 42, 30);

        }

    }

}


function startBruiserCharge() {

    if(playerClass !== "bruiser" || shieldRaised || bruiserDashTimer > 0 || bruiserChargeTimer > 0 || bruiserChargeCooldown > 0) return;

    bruiserChargeTimer = 24;

    bruiserChargeCooldown = 180;

    bruiserChargeHitEnemies = new Set();

}


function updateBruiserCharge() {

    if(bruiserChargeTimer <= 0) return;

    let oldX = player.x;

    let oldY = player.y;

    player.x += Math.cos(player.angle) * 10;

    player.y += Math.sin(player.angle) * 10;

    if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) {

        player.x = oldX;

        player.y = oldY;

        bruiserChargeTimer = 0;

        bruiserShockwave(player.x + player.width / 2, player.y + player.height / 2);

        return;

    }

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    for(let enemy of enemies) {

        if(!enemy.alive || enemy.room !== currentRoom || bruiserChargeHitEnemies.has(enemy)) continue;

        if(Math.hypot(enemy.x + enemy.width / 2 - centerX, enemy.y + enemy.height / 2 - centerY) <= 42) {

            bruiserChargeHitEnemies.add(enemy);

            damageEnemy(enemy, 58);

            knockbackAndStunEnemy(enemy, centerX, centerY, 46, 30);

        }

    }

    bruiserChargeTimer--;

}


function drawDeathSequence() {

}

// ======================================================
// MAIN GAME LOOP
// ======================================================

function gameLoop() {


    if(gameState === "start") {

        drawTitleScreen();

    }

    else if(gameState === "classSelect") {

        drawStartScreen();

    }

    else if(gameState === "lobby") {

        updateCharge();

        updateMageFire();

        updateBow();

        movePlayer();

        updateCyborgGatling();

        updateCyborgThruster();

        updateOwenPowers();

        updateDash();

        updateBruiserDash();

        updateBruiserCharge();

        updateGrapplingHook();

        updateNinjaKunai();

        updateProjectiles();

        updateCombat();

        updateDamageCooldown();

        drawLobby();

    }


    else if(gameState === "playing") {


        updateCharge();

        updateMageFire();

        updateBow();


        movePlayer();

        updateCyborgGatling();

        updateCyborgThruster();

        updateOwenPowers();


        updateDash();

        updateBruiserDash();

        updateBruiserCharge();

        updateGrapplingHook();

        updateNinjaKunai();


        updateEnemies();

        updateTraps();

        updateProjectiles();


        updateCombat();


        updateDamageCooldown();


        drawGame();

    }

    else if(gameState === "blessing") {

        drawBlessingScreen();

    }

    else if(gameState === "trading") {

        drawTraderScreen();

    }

    else if(gameState === "traderTalk") {

        drawTraderTalk();

    }

    else if(gameState === "transition") {

        drawRoomTransition();

    }

    else if(gameState === "dying") {

        deathTimer--;

        drawDeathSequence();

        if(deathTimer <= 0) gameState = "gameover";

    }


    else if(gameState === "won") {

        drawWinScreen();

    }


    else if(gameState === "gameover") {

        drawGameOverScreen();

    }


    requestAnimationFrame(gameLoop);

}


// ======================================================
// START
// ======================================================

generateDungeon();

gameLoop();
