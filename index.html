canvas.addEventListener("mousemove", function(e) {

    let rect = canvas.getBoundingClientRect();

    mouse.x =

        e.clientX -

        rect.left;

    mouse.y =

        e.clientY -

        rect.top;

});


canvas.addEventListener("mousedown", function(e) {

    if(e.button !== 0) return;

    let rect = canvas.getBoundingClientRect();

    mouse.x = e.clientX - rect.left;

    mouse.y = e.clientY - rect.top;

    mouse.down = true;

    if(gameState === "blessing") {

        let choiceIndex = Math.floor((mouse.x - 55) / 235);

        if(mouse.y >= 270 && mouse.y <= 445 && choiceIndex >= 0 && choiceIndex < 3) chooseShrineBuff(choiceIndex);

        mouse.down = false;

        return;

    }

    if(gameState === "trading") {

        let choiceIndex = Math.floor((mouse.x - 55) / 235);

        if(mouse.y >= 270 && mouse.y <= 445 && choiceIndex >= 0 && choiceIndex < 3) buyTraderOffer(choiceIndex);

        if(mouse.y >= 465 && mouse.y <= 515 && mouse.x >= 290 && mouse.x <= 510) cancelTrade();

        mouse.down = false;

        return;

    }

    if(gameState === "start") {

        if(mouse.x >= 300 && mouse.x <= 500 && mouse.y >= 350 && mouse.y <= 408) gameState = "classSelect";

        mouse.down = false;

        return;

    }

    if(gameState === "classSelect") {

        choosePlayerClass(mouse.x, mouse.y);

        currentRoom = 0;

        player.x = 100;

        player.y = 300;

        oldManDialogue = false;

        gameState = "lobby";

        return;

    }

    if(gameState === "playing" || gameState === "lobby") {

        if(shieldRaised) return;

        attackPressActive = true;

        attackHoldTime = 0;

    }

});


canvas.addEventListener("mouseup", function(e) {

    if(e.button !== 0) return;

    mouse.down = false;

    releaseAttack();

});


canvas.addEventListener("mouseleave", function() {

    mouse.down = false;

    attackPressActive = false;

    isCharging = false;

});


window.addEventListener("keydown", function(e) {

    let keyName = e.key.toLowerCase();

    if(keyName in keys) {

        keys[keyName] = true;

        e.preventDefault();

    }

    if(keyName === "shift") {

        if(playerClass === "owen") {

            owenChestBeamActive = true;

            e.preventDefault();

            return;

        }

        if(!shieldRaised) parryTimer = 15;

        shieldRaised = true;

        // Raising a shield immediately cancels any held offensive action.
        attackPressActive = false;

        bowHeld = false;

        isCharging = false;

        dashTimer = 0;

        grapplingHook.state = "idle";

        ninjaKunai.state = "idle";

        e.preventDefault();

    }

    if(keyName === "e" && !e.repeat && gameState === "lobby" && isNearOldMan()) {

        oldManDialogue = !oldManDialogue;

        e.preventDefault();

        return;

    }

    if(gameState === "traderTalk") {

        gameState = "trading";

        mouse.down = false;

        return;

    }

    if(keyName === "e" && !e.repeat && gameState === "traderTalk") {

        gameState = "trading";

        e.preventDefault();

        return;

    }

    if(keyName === "e" && !e.repeat && (gameState === "playing" || gameState === "lobby")) {

        if(playerClass !== "hero" || shieldRaised) return;

        bowHeld = true;

        bowCharge = 0;

        e.preventDefault();

    }

    if((keyName === "1" || keyName === "2" || keyName === "3") && playerClass === "mage") {

        mageAttackMode = Number(keyName);

        e.preventDefault();

    }

    if(keyName === "q" && !e.repeat && (gameState === "playing" || gameState === "lobby") && traderAbility && traderAbilityCooldown <= 0 && !shieldRaised) {

        castRelicNova();

        e.preventDefault();

    }

});


window.addEventListener("keyup", function(e) {

    let keyName = e.key.toLowerCase();

    if(keyName in keys) {

        keys[keyName] = false;

        e.preventDefault();

    if(keyName === "shift") {

        if(playerClass === "owen") {

            owenChestBeamActive = false;

            e.preventDefault();

            return;

        }

        shieldRaised = false;

        parryTimer = 0;

        e.preventDefault();

        e.preventDefault();

        releaseGrapplingHook();

        e.preventDefault();

    }

        releaseNinjaKunai();

        e.preventDefault();

        e.preventDefault();

    }

    if(e.code === "Space" && playerClass === "owen") {

        owenFlying = false;

        e.preventDefault();

    }

    if(keyName === " ") {

        e.preventDefault();

    }

// ======================================================
// COLLISION
// ======================================================

function checkCollision(a, b) {

    return (

        a.x < b.x + b.width &&

        a.x + a.width > b.x &&

        a.y < b.y + b.height &&

        a.y + a.height > b.y

    );

}


// ======================================================
// CURRENT SOLID TERRAIN
// ======================================================

function getCurrentWalls() {

    // Water is solid terrain for actors; projectile checks use getCurrentRoomWalls().
    return (rooms[currentRoom] || []).concat(waterPools[currentRoom] || []);

}


function getCurrentRoomWalls() {

    // Projectile collision uses only masonry; shots travel cleanly over water.
    return rooms[currentRoom] || [];

}


function randomBetween(min, max) {

    return min + Math.floor(Math.random() * (max - min + 1));

}


function roomHasOpenSpace(room, x, y, width, height) {

    let candidate = {x: x, y: y, width: width, height: height};

    return !rooms[room].some(function(wall) { return checkCollision(candidate, wall); }) && !(waterPools[room] || []).some(function(pool) { return checkCollision(candidate, pool); });

}


function randomOpenPosition(room, width, height) {

    for(let attempt = 0; attempt < 80; attempt++) {

        let x = randomBetween(55, 725 - width);

        let y = randomBetween(55, 525 - height);

        if(roomHasOpenSpace(room, x, y, width, height)) return {x: x, y: y};

    }

    // The central travel lane is intentionally kept clear by the generator.
    return {x: 370, y: 300};

}


function createRoomBorder(room) {

    let border = [

        {x: 0, y: 0, width: 800, height: 20},

        {x: 0, y: 580, width: 800, height: 20},

        {x: 0, y: 0, width: 20, height: 600}

    ];

    if(room === 0 || room === 1) {

        border.push({x: 780, y: 0, width: 20, height: 230}, {x: 780, y: 370, width: 20, height: 230});

    }

    else if(room < roomCount) {

        border[2] = {x: 0, y: 0, width: 20, height: 230};

        border.push({x: 0, y: 370, width: 20, height: 230}, {x: 780, y: 0, width: 20, height: 230}, {x: 780, y: 370, width: 20, height: 230});

    }

    else {

        border[2] = {x: 0, y: 0, width: 20, height: 230};

        border.push({x: 0, y: 370, width: 20, height: 230}, {x: 780, y: 0, width: 20, height: 600});

    }

    return border;

}

    keyRoom = randomBetween(7, 12);

    treasureRoom = randomBetween(keyRoom + 2, 20);

    // The first checkpoint rolls normally; each missed checkpoint guarantees the next one.
    let previousSafeCheckpoint = true;

    for(let room = 1; room <= roomCount; room++) {

        rooms[room] = createRoomBorder(room);

        torches[room] = [

            {x: 95, y: 20, side: "top"}, {x: 705, y: 20, side: "top"},

            {x: 120, y: 580, side: "bottom"}, {x: 680, y: 580, side: "bottom"}

        // Several shallow pools add water while leaving the central travel lanes open.
        waterPools[room] = [
            {x: 45 + (room * 71) % 160, y: 55 + (room * 43) % 105, width: 105, height: 36},
            {x: 595 + (room * 29) % 95, y: 55 + (room * 31) % 115, width: 88, height: 34},
            {x: 55 + (room * 47) % 150, y: 455 + (room * 19) % 55, width: 112, height: 32},
            {x: 575 + (room * 37) % 100, y: 430 + (room * 37) % 70, width: 110, height: 38}
        ];

        // Every third room has a 50% safe-room roll. Missing one guarantees the next checkpoint.
        if(room % 3 === 0 && room < roomCount) {

            let makeSafeRoom = !previousSafeCheckpoint || Math.random() < 0.50;

            previousSafeCheckpoint = makeSafeRoom;

            if(makeSafeRoom) {

                let safeTypes = ["shrine", "trader", "cache"].sort(function() { return Math.random() - 0.5; }).slice(0, 2);

                let safePositions = [{x: 285, y: 275}, {x: 475, y: 275}];

                }

                continue;

            }

        }

        // Denser, varied layouts leave the middle route clear while providing cover.
        addRoomCoverLayout(room);

        // Sparse pressure plates: a room may have one or two, including boss rooms.
        // Safe rooms continue above before reaching this point and remain hazard-free.
        let spikeCount = Math.random() < 0.30 ? 1 : 0;

        if(Math.random() < 0.07) spikeCount++;

        for(let spikeIndex = 0; spikeIndex < spikeCount; spikeIndex++) {

            let spikePosition = randomOpenPosition(room, 30, 30);

            traps.push({room: room, x: spikePosition.x, y: spikePosition.y, width: 30, height: 30, damage: 5, cooldown: 0, activeTimer: 0});

        // Room 7 is reserved for the Slime King and his summons.
        if(room === 7) {

            enemies.push({x: kingPosition.x, y: kingPosition.y, width: 66, height: 66, speed: 0.72, health: 800, maxHealth: 800, room: room, type: "slimeKing", isBoss: true, freezeImmune: true, hitFlash: 0, alive: true, attackCooldown: 75, attackTimer: 0, jumpTimer: 0, jumpStartX: 0, jumpStartY: 0, jumpTargetX: 0, jumpTargetY: 0, spawnCooldown: 90});

            roomEncounters.push({type: "boss", room: room, x: kingPosition.x, y: kingPosition.y, width: 66, height: 66, used: false});

            continue;

        }

        // A healing shrine appears in a clear room corner 10% of the time.
        if(Math.random() < 0.10) {

            let corners = [{x: 42, y: 48}, {x: 724, y: 48}, {x: 42, y: 510}, {x: 724, y: 510}];

            let shrinePosition = corners.find(function(corner) { return roomHasOpenSpace(room, corner.x, corner.y, 34, 38); });

            if(shrinePosition) healingShrines.push({room: room, x: shrinePosition.x, y: shrinePosition.y, width: 34, height: 38, used: false});

        // Weighted projectile-focused enemy roster. Weights preserve the supplied spawn-rate ratios.
        let enemyProfiles = [

            {type: "bloodCultist", weight: 18, health: 80, speed: 1.0, width: 30, height: 36, projectileSpeed: 6, projectileDamage: 13, projectileColor: "#c51f38", effect: "bleed"},
            {type: "eye", weight: 8, health: 115, speed: 0.8, width: 42, height: 34, projectileSpeed: 7, projectileDamage: 14, projectileColor: "#c878ff", effect: "homing"},
            {type: "plagueRat", weight: 15, health: 65, speed: 1.8, width: 36, height: 24, projectileSpeed: 4, projectileDamage: 12, projectileColor: "#65d94e", effect: "poisonCloud"},
            {type: "flameWraith", weight: 12, health: 76, speed: 1.5, width: 30, height: 38, projectileSpeed: 6.5, projectileDamage: 14, projectileColor: "#58baff", effect: "burn"},
            {type: "shadowArcher", weight: 10, health: 70, speed: 1.3, width: 28, height: 40, projectileSpeed: 9, projectileDamage: 16, projectileColor: "#15131d", effect: "piercing"},
            {type: "crystalCrawler", weight: 10, health: 120, speed: 0.7, width: 38, height: 28, projectileSpeed: 5, projectileDamage: 14, projectileColor: "#75f4ff", effect: "splinter"},
            {type: "voidPriest", weight: 5, health: 110, speed: 0.6, width: 32, height: 42, projectileSpeed: 3.5, projectileDamage: 16, projectileColor: "#28143d", effect: "gravity"},
            {type: "mimicMage", weight: 6, health: 100, speed: 1.0, width: 36, height: 30, projectileSpeed: 5, projectileDamage: 12, projectileColor: "#f5bd3e", effect: "greed"},
            {type: "frostWitch", weight: 8, health: 78, speed: 0.9, width: 30, height: 38, projectileSpeed: 5, projectileDamage: 13, projectileColor: "#bff5ff", effect: "freeze"},
            {type: "cursedKnight", weight: 4, health: 145, speed: 1.1, width: 34, height: 40, projectileSpeed: 6, projectileDamage: 18, projectileColor: "#d83e58", effect: "boomerang"},
            {type: "lantern", weight: 7, health: 84, speed: 1.4, width: 28, height: 34, projectileSpeed: 4.5, projectileDamage: 10, projectileColor: "#ffce55", effect: "darkness"},
            {type: "rottingShaman", weight: 8, health: 92, speed: 0.8, width: 30, height: 38, projectileSpeed: 4, projectileDamage: 12, projectileColor: "#6fc95c", effect: "summon"},
            {type: "hive", weight: 5, health: 105, speed: 1.6, width: 38, height: 34, projectileSpeed: 7, projectileDamage: 12, projectileColor: "#d9c64a", effect: "swarm"},
            {type: "bloodOrb", weight: 3, health: 125, speed: 0.5, width: 34, height: 34, projectileSpeed: 3, projectileDamage: 20, projectileColor: "#d62c3b", effect: "explosion"},
            {type: "jester", weight: 4, health: 95, speed: 2.0, width: 30, height: 38, projectileSpeed: 8, projectileDamage: 14, projectileColor: "#ff6ccf", effect: "ricochet"}
        ];

        for(let count = 0; count < randomBetween(3, 5); count++) {

            let total = 0;

            for(let candidate of enemyProfiles) total += candidate.weight;

            let roll = randomBetween(1, total);

            let profile = enemyProfiles[0];

            let cumulativeWeight = 0;

            for(let candidate of enemyProfiles) { cumulativeWeight += candidate.weight; if(roll <= cumulativeWeight) { profile = candidate; break; } }

            let position = randomOpenPosition(room, profile.width, profile.height);

            enemies.push({x: position.x, y: position.y, width: profile.width, height: profile.height, speed: profile.speed, health: profile.health, maxHealth: profile.health, room: room, type: profile.type, hitFlash: 0, alive: true, attackCooldown: randomBetween(34, ENEMY_ATTACK_COOLDOWN), attackTimer: 0, attackRange: 390, projectileSpeed: profile.projectileSpeed * PROJECTILE_SPEED_MULTIPLIER, projectileDamage: profile.projectileDamage, projectileColor: profile.projectileColor, effect: profile.effect, damageByHealth: profile.damageByHealth});

        }

    }

    let keyPosition = randomOpenPosition(keyRoom, key.width, key.height);

    key.x = keyPosition.x;

    key.y = keyPosition.y;

    let treasurePosition = randomOpenPosition(treasureRoom, treasure.width, treasure.height);

    treasure.x = treasurePosition.x;

    treasure.y = treasurePosition.y;

    treasure.collected = true;

    // One center chest per traversable room. Rare black-and-gold chests replace gold with aid.
    for(let room = 1; room < roomCount; room++) {

        let rare = Math.random() < 0.08;

        treasures.push({room: room, x: rare ? 380 : 386, y: rare ? 284 : 288, width: rare ? 40 : 28, height: rare ? 32 : 24, gold: rare ? 0 : randomBetween(1, 50), rare: rare, reward: rare ? (Math.random() < 0.5 ? "heal" : "ability") : null, collected: false});

    }

    let encounterTypes = ["shrine", "boss", "trader", "evilShrine"];

    // Safe rooms above replace the former random special-encounter spawns.
    for(let blockStart = roomCount + 1; blockStart <= roomCount; blockStart += 3) {

        let candidates = [];

        for(let room = blockStart; room < Math.min(roomCount + 1, blockStart + 3); room++) if(!shrineRooms[room]) candidates.push(room);

        if(candidates.length === 0) continue;

        let encounterRoom = candidates[randomBetween(0, candidates.length - 1)];

        let encounterType = encounterTypes[randomBetween(0, encounterTypes.length - 1)];

        let encounterPosition = randomOpenPosition(encounterRoom, encounterType === "boss" ? 44 : 34, encounterType === "boss" ? 44 : 34);

        let encounter = {

            type: encounterType,

            room: encounterRoom,

            x: encounterPosition.x,

            y: encounterPosition.y,

            width: encounterType === "boss" ? 44 : 34,

            height: encounterType === "boss" ? 44 : 34,

            used: false

        };

        roomEncounters.push(encounter);

        if(encounterType === "boss") {

        enemies.push({

            x: encounterPosition.x,

            y: encounterPosition.y,

            width: 44,

            height: 44,

            speed: 0.7,

            health: 350,

            maxHealth: 350,

            room: encounterRoom,

            type: "boss",

            isBoss: true,

            hitFlash: 0,

            alive: true,

            attackCooldown: 0,

            attackTimer: 0,

            attackRange: 58

            });

        }
    }

}


// ======================================================
// PLAYER MOVEMENT
// ======================================================

function movePlayer() {

    if(gameState !== "playing" && gameState !== "lobby") {

        return;

    }


    // Calculate direction toward mouse

    let centerX =

        player.x +

        player.width / 2;


    let centerY =

        player.y +

        player.height / 2;


    let dx =

        mouse.x -

        centerX;


    let dy =

        mouse.y -

        centerY;


    let distance =

        Math.sqrt(

            dx * dx +

            dy * dy

        );


    // Update facing direction

    if(distance > 5) {

        player.angle =

            Math.atan2(

                dy,

                dx

            );

    }


    // Movement and aiming are independent: WASD follows the map axes while
    // the mouse keeps controlling the direction the character faces.

    let moveX = 0;

    let moveY = 0;

    if(keys.w) moveY--;

    if(keys.a) moveX--;

    if(keys.s) moveY++;

    if(keys.d) moveX++;

    let moveLength = Math.sqrt(moveX * moveX + moveY * moveY);

    // Do not allow a diagonal input to move faster than a single direction.

    if(

        moveLength > 0 &&

        dashTimer <= 0 &&

        playerFreezeTimer <= 0 &&

        bruiserChargeTimer <= 0 &&

        grapplingHook.state !== "pulling"

    ) {

        let oldX = player.x;

        let oldY = player.y;

        let standingInSlime = slimePuddles.some(function(puddle) { return puddle.room === currentRoom && checkCollision(player, puddle); });

        let moveSpeed = player.speed * (playerClass === "stealth" && isCharging ? 2 : 1) * (playerSlowTimer > 0 ? 0.65 : 1) * (standingInSlime ? 0.8 : 1) * (ouchFireTimer > 0 ? 1.15 : 1);


        player.x +=

            (moveX / moveLength) *

            moveSpeed;


        player.y +=

            (moveY / moveLength) *

            moveSpeed;


        movementLightning = 3;


        for(let wall of getCurrentWalls()) {

            if(checkCollision(player, wall)) {

                player.x = oldX;

                player.y = oldY;

            }

        }

    }


    checkDoors();

    checkItems();

    checkExit();

}


// ======================================================
// HERO GRAPPLING HOOK
// ======================================================

function startGrapplingHook() {

    if(playerClass !== "hero" || shieldRaised || grapplingHook.state !== "idle") return;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    grapplingHook = {

        state: "flying",

        x: centerX,

        y: centerY,

        vx: Math.cos(player.angle) * 18,

        vy: Math.sin(player.angle) * 18,

        life: 90

    };

}


function releaseGrapplingHook() {

    if(grapplingHook.state === "anchored") {

        grapplingHook.state = "pulling";

    }

    else if(grapplingHook.state === "flying") {

        grapplingHook.state = "retracting";

    }

}


function updateGrapplingHook() {

    if(playerClass !== "hero" || grapplingHook.state === "idle") return;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    if(grapplingHook.state === "flying") {

        grapplingHook.x += grapplingHook.vx;

        grapplingHook.y += grapplingHook.vy;

        grapplingHook.life--;

        if(pointHitsWall(grapplingHook.x, grapplingHook.y)) {

            grapplingHook.state = "anchored";

        }

        else if(grapplingHook.life <= 0) {

            grapplingHook.state = "retracting";

        }

    }

    else if(grapplingHook.state === "retracting") {

        let dx = centerX - grapplingHook.x;

        let dy = centerY - grapplingHook.y;

        let distance = Math.hypot(dx, dy);

        if(distance <= 16) {

            grapplingHook.state = "idle";

        }

        else {

            grapplingHook.x += dx / distance * 26;

            grapplingHook.y += dy / distance * 26;

        }

    }

    else if(grapplingHook.state === "pulling") {

        let dx = grapplingHook.x - centerX;

        let dy = grapplingHook.y - centerY;

        let distance = Math.hypot(dx, dy);

        if(distance <= 18) {

            grapplingHook.state = "idle";

            return;

        }

        let oldX = player.x;

        let oldY = player.y;

        player.x += dx / distance * 22 * build.hookMultiplier;

        player.y += dy / distance * 22 * build.hookMultiplier;

        if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) {

            player.x = oldX;

            player.y = oldY;

            grapplingHook.state = "idle";

        }

    }

}


// ======================================================
// DASH MOVEMENT
// ======================================================

function updateDash() {

    if(shieldRaised) {

        dashTimer = 0;

        return;

    }

    if(dashTimer <= 0) {

        return;

    }


    let oldX = player.x;

    let oldY = player.y;


    player.x +=

        Math.cos(

            player.angle

        ) *

        dashSpeed;


    player.y +=

        Math.sin(

            player.angle

        ) *

        dashSpeed;


    for(let wall of getCurrentWalls()) {

        if(checkCollision(player, wall)) {

            player.x = oldX;

            player.y = oldY;

            dashTimer = 0;

        }

    }


    dashTimer--;

    movementLightning = 4;


    checkDashHit();

}


// ======================================================
// CHARGE ATTACK
// ======================================================

function getChargeCap() {

    if(playerClass === "hero") return maxChargeTime / 4;

    if(playerClass === "bruiser" || playerClass === "musketeer") return maxChargeTime / 2;

    // A short 1.25-second charge creates the Ninja's decoy/invisibility play.
    if(playerClass === "stealth") return 75;

    return maxChargeTime;

}


function startNinjaKunai() {

    if(playerClass !== "stealth" || shieldRaised || ninjaKunai.state !== "idle") return;

    ninjaKunai = {

        state: "flying",

        x: player.x + player.width / 2,

        y: player.y + player.height / 2,

        vx: Math.cos(player.angle) * 13,

        vy: Math.sin(player.angle) * 13,

        life: 75,

        angle: player.angle

    };

}


function releaseNinjaKunai() {

    if(playerClass !== "stealth" || ninjaKunai.state === "idle") return;

    let oldX = player.x;

    let oldY = player.y;

    player.x = ninjaKunai.x - player.width / 2;

    player.y = ninjaKunai.y - player.height / 2;

    // A kunai embedded in a wall lands the Ninja at the nearest clear edge.
    for(let step = 0; step < 18 && getCurrentWalls().some(function(wall) { return checkCollision(player, wall); }); step++) {

        player.x -= Math.cos(ninjaKunai.angle) * 3;

        player.y -= Math.sin(ninjaKunai.angle) * 3;

    }

    if(gameState === "lobby" && oldManDialogue) return;

    if(getCurrentWalls().some(function(wall) { return checkCollision(player, wall); })) {

        player.x = oldX;

        player.y = oldY;

    }

    ninjaKunai.state = "idle";

}


function updateNinjaKunai() {

    if(playerClass !== "stealth" || ninjaKunai.state === "idle") return;

    if(ninjaKunai.state === "flying") {

        ninjaKunai.x += ninjaKunai.vx;

        ninjaKunai.y += ninjaKunai.vy;

        ninjaKunai.life--;

        if(pointHitsWall(ninjaKunai.x, ninjaKunai.y)) ninjaKunai.state = "anchored";

        else if(ninjaKunai.life <= 0 || ninjaKunai.x < 0 || ninjaKunai.x > canvas.width || ninjaKunai.y < 0 || ninjaKunai.y > canvas.height) ninjaKunai.state = "idle";

    }

}

function updateCharge() {

    if(playerClass === "mage" || playerClass === "cyborg" || playerClass === "owen") return;

    if(shieldRaised) return;


    if(

        mouse.down &&

        attackPressActive &&

        attackCooldown <= 0 &&

        dashTimer <= 0

    ) {

        attackHoldTime++;

        // Keep a short click window before the sword begins to charge.

        let chargeDelay = playerClass === "hero" ? 3 : playerClass === "bruiser" ? 4 : playerClass === "musketeer" ? 8 : chargeStartDelay;

        if(attackHoldTime >= chargeDelay) {

            isCharging = true;

            chargeTime = attackHoldTime - chargeDelay;

        }

        let chargeCap = getChargeCap();

        if(chargeTime >= chargeCap) {

            chargeTime = chargeCap;

            if(playerClass === "stealth") releaseAttack();

        }

    }

}


// ======================================================
// RELEASE ATTACK
// ======================================================

function releaseAttack() {


    if(!attackPressActive) {

        return;

    }


    attackPressActive = false;


    isCharging = false;

    if(shieldRaised) {

        attackHoldTime = 0;

        chargeTime = 0;

        return;

    }

    // The mage fires continuously while the button is held, so releasing it
    // never creates a separate melee attack.
    if(playerClass === "mage" || playerClass === "cyborg") {

        attackHoldTime = 0;

        chargeTime = 0;

        return;

    }


    // Charged attacks only complete after their class-specific meter is full.
    if(chargeTime < getChargeCap()) {

        normalAttack();

    }


    // Long hold = dash

    else if(playerClass === "stealth") {

        // Charge completion creates a decoy and makes the Ninja untargetable for 1.75 seconds.
        assassinClone = {x: player.x, y: player.y, width: player.width, height: player.height, life: 105};

        ninjaInvisibilityTimer = 105;

        attackTimer = 0;

        attackHitboxTimer = 0;

        attackCooldown = 0;

        fireNinjaShurikens();

    }

    else if(playerClass === "bruiser") {

        attackTimer = 24;

        attackCooldown = 48;

        checkBruiserSweep();

    }

    else if(playerClass === "musketeer") {

        if(musketeerOverheatTimer <= 0) fireShotgun();

        else normalAttack();

    }

    else {

        dashHitEnemies = new Set();

        dashTimer = dashDuration;

        attackCooldown = 45;

        attackTimer = 20;

        attackHitboxTimer = 15;

    }


    chargeTime = 0;

    attackHoldTime = 0;

}


// ======================================================
// NORMAL ATTACK
// ======================================================

function normalAttack() {

    if(shieldRaised) return;


    if(attackCooldown > 0) {

        return;

    }


    if(playerClass === "cyborg") {

        fireLaser();

        return;

    }

    if(playerClass === "owen") {

        owenPunch();

        return;

    }

    if(playerClass === "musketeer") {

        fireMusketShot();

        return;

    }

    if(playerClass === "bruiser") {

        attackTimer = 18;

        attackHitboxTimer = 10;

        attackCooldown = 34;

        // Twice the former travel distance (16 frames at the same dash speed).
        bruiserDashTimer = 16;

        bruiserDashHitEnemies = new Set();

        checkBruiserStrike(42, 82);

        return;

    }

    if(playerClass === "stealth") {

        fireNinjaShurikens();

        return;

    }

    attackTimer = 15;

    attackHitboxTimer = 8;

    attackCooldown = 30;


    checkAttackHit(25);

}


// ======================================================
// NORMAL ATTACK HIT
// ======================================================

function updateBow() {

    if(bowHeld && !shieldRaised) {

        bowCharge = Math.min(bowCharge + 1, maxBowCharge);

    }

    if(bowCooldown > 0) bowCooldown--;

}


function releaseBow() {

    if(!bowHeld) return;

    bowHeld = false;

    if(shieldRaised) {

        bowCharge = 0;

        return;

    }

    if(bowCooldown > 0 || (gameState !== "playing" && gameState !== "lobby")) {

        bowCharge = 0;

        return;

    }

    let power = bowCharge / maxBowCharge;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    arrows.push({

        x: centerX,

        y: centerY,

        vx: Math.cos(player.angle) * (6 + power * 6) * PROJECTILE_SPEED_MULTIPLIER,

        vy: Math.sin(player.angle) * (6 + power * 6) * PROJECTILE_SPEED_MULTIPLIER,

        angle: player.angle,

        // Fully charged damage was 70; its new 56 maximum is 20% lower.
        damage: Math.round(22 + power * 34),

        life: 70

function damageEnemy(enemy, amount, scoreValue, deathEffect) {

    }

    enemy.health -= amount * build.damageMultiplier * bruiserRage;

    // Any damage breaks Frost immediately.
    enemy.frozenTimer = 0;

    enemy.hitFlash = 12;

    screenShake = Math.max(screenShake, 3);

    if(enemy.health <= 0) {

        enemy.health = 0;

        enemy.alive = false;

        if(deathEffect === "ash") {

            let centerX = enemy.x + enemy.width / 2;

            let centerY = enemy.y + enemy.height / 2;

            for(let particle = 0; particle < 12; particle++) {

            }

        if(enemy.type === "slimePawn") {

            slimePuddles.push({room: enemy.room, x: enemy.x - 8, y: enemy.y - 6, width: enemy.width + 16, height: enemy.height + 12, life: 360});

            let king = enemies.find(function(candidate) { return candidate.alive && candidate.type === "slimeKing" && candidate.room === enemy.room; });

            if(king) king.spawnCooldown = Math.max(king.spawnCooldown || 0, 300);

        }

        score += scoreValue || (enemy.type === "mage" ? 175 : 100);

    }

function updateMageFire() {

    mageConeActive = false;

    if(playerClass !== "mage") return;

    if(mageFireCooldown > 0) mageFireCooldown--;

    if(mageExhaustionTimer > 0) mageExhaustionTimer--;

    let isCasting = mouse.down && attackPressActive && !shieldRaised && magePower > 0 && mageExhaustionTimer <= 0;

    if(!isCasting) {

        magePower = Math.min(magePowerMax, magePower + 0.5);

        return;

    }

    mageConeActive = true;

    magePower = Math.max(0, magePower - 0.85);

    // Empty mana causes a deliberate three-second magic lockout (180 frames at 60 FPS).
    if(magePower === 0) {

        mageExhaustionTimer = 180;

        mageConeActive = false;

        return;

    }

    if(mageFireCooldown > 0) return;

    let centerX = player.x + player.width / 2;

    let centerY = player.y + player.height / 2;

    let coneHalfAngle = Math.PI * 25 / 360;

    let candidates = enemies.filter(function(enemy) {

        if(!enemy.alive || enemy.room !== currentRoom) return false;

        let enemyCenterX = enemy.x + enemy.width / 2;

        let enemyCenterY = enemy.y + enemy.height / 2;

        let dx = enemyCenterX - centerX;

        let dy = enemyCenterY - centerY;

        if(mageAttackMode === 3) {

            // Lightning is a narrow, straight beam rather than a cone.
            let forward = dx * Math.cos(player.angle) + dy * Math.sin(player.angle);

            let lateral = Math.abs(-dx * Math.sin(player.angle) + dy * Math.cos(player.angle));

            return forward >= 0 && forward <= 380 && lateral <= 18 &&

                hasClearShot(centerX, centerY, enemyCenterX, enemyCenterY);

        }

        return Math.hypot(dx, dy) <= 155 &&

            Math.abs(normalizeAngle(Math.atan2(dy, dx) - player.angle)) <= coneHalfAngle &&

            hasClearShot(centerX, centerY, enemyCenterX, enemyCenterY);

    });

    candidates.sort(function(a, b) {

        if(mageAttackMode === 3) {

            return (a.x - centerX) * Math.cos(player.angle) + (a.y - centerY) * Math.sin(player.angle) -

                ((b.x - centerX) * Math.cos(player.angle) + (b.y - centerY) * Math.sin(player.angle));

        }

        return Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y);

    });

    if(mageAttackMode === 1) {

        for(let enemy of candidates) damageEnemy(enemy, 18);

    }

    else if(mageAttackMode === 2) {

        for(let enemy of candidates) {

            damageEnemy(enemy, 5);

            if(enemy.alive && !enemy.freezeImmune) enemy.frozenTimer = 180;

        }

    }

    else if(candidates.length > 0) {

        let hitEnemies = [candidates[0]];

        let points = [{x: centerX, y: centerY}];

        damageEnemy(candidates[0], 11);

        points.push({x: candidates[0].x + candidates[0].width / 2, y: candidates[0].y + candidates[0].height / 2});

        // Three total targets (the primary plus two bounces) triple Lightning's hit.
        while(hitEnemies.length < 3) {

            let previous = hitEnemies[hitEnemies.length - 1];

            let previousX = previous.x + previous.width / 2;

            let previousY = previous.y + previous.height / 2;

            let next = enemies.filter(function(enemy) {

                return enemy.alive && enemy.room === currentRoom && !hitEnemies.includes(enemy) &&

                    Math.hypot(enemy.x + enemy.width / 2 - previousX, enemy.y + enemy.height / 2 - previousY) <= 170 &&

                    hasClearShot(previousX, previousY, enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);

            }).sort(function(a, b) {

                return Math.hypot(a.x - previousX, a.y - previousY) - Math.hypot(b.x - previousX, b.y - previousY);

            })[0];

            if(!next) break;

            damageEnemy(next, 11);

            hitEnemies.push(next);

            points.push({x: next.x + next.width / 2, y: next.y + next.height / 2});

        }

        lightningChains.push({points: points, life: 7});

    }

    mageFireCooldown = mageFireCooldownMax;

}

            }

        }

        if(hitWall || pellet.life <= 0 || pellet.x < 0 || pellet.x > canvas.width || pellet.y < 0 || pellet.y > canvas.height) shotgunPellets.splice(i, 1);

    }


    for(let i = energyBlasts.length - 1; i >= 0; i--) {

        let blast = energyBlasts[i];

        blast.x += blast.vx;

        blast.y += blast.vy;

        blast.life--;

        if(pointHitsWall(blast.x, blast.y)) {

            explosions.push({x: blast.x, y: blast.y, life: 18});

            energyBlasts.splice(i, 1);

            continue;

        }

        for(let enemy of enemies) {

            if(!enemy.alive || enemy.room !== currentRoom || blast.hitEnemies.has(enemy)) continue;

            let hitX = Math.max(enemy.x, Math.min(blast.x, enemy.x + enemy.width));

            let hitY = Math.max(enemy.y, Math.min(blast.y, enemy.y + enemy.height));

            if(Math.hypot(blast.x - hitX, blast.y - hitY) < 15) {

                damageEnemy(enemy, 45, 150);

                blast.hitEnemies.add(enemy);

            }

        }

        if(blast.life <= 0 || blast.x < 0 || blast.x > canvas.width || blast.y < 0 || blast.y > canvas.height) energyBlasts.splice(i, 1);

    }


    for(let i = fireballs.length - 1; i >= 0; i--) {

        let fireball = fireballs[i];

        fireball.x += fireball.vx;

        fireball.y += fireball.vy;

        fireball.life--;

        let hit = pointHitsWall(fireball.x, fireball.y);

        for(let enemy of enemies) {

            if(hit || !enemy.alive || enemy.room !== currentRoom) continue;

            let hitX = Math.max(enemy.x, Math.min(fireball.x, enemy.x + enemy.width));

            let hitY = Math.max(enemy.y, Math.min(fireball.y, enemy.y + enemy.height));

            if(Math.hypot(fireball.x - hitX, fireball.y - hitY) < 8) {

                damageEnemy(enemy, 12);

                hit = true;

            }

        }

        if(hit || fireball.life <= 0 || fireball.x < 0 || fireball.x > canvas.width || fireball.y < 0 || fireball.y > canvas.height) fireballs.splice(i, 1);

    }


    for(let i = explosions.length - 1; i >= 0; i--) {

        explosions[i].life--;

        if(explosions[i].life <= 0) explosions.splice(i, 1);

    }


    for(let i = enemyProjectiles.length - 1; i >= 0; i--) {

        let bolt = enemyProjectiles[i];

        let centerX = player.x + player.width / 2;

        let centerY = player.y + player.height / 2;

        if(bolt.effect === "homing") {

            let aim = Math.atan2(centerY - bolt.y, centerX - bolt.x);

            let speed = Math.hypot(bolt.vx, bolt.vy);

            bolt.vx += (Math.cos(aim) * speed - bolt.vx) * 0.055;

            bolt.vy += (Math.sin(aim) * speed - bolt.vy) * 0.055;

        }

        if(bolt.effect === "gravity" && Math.hypot(centerX - bolt.x, centerY - bolt.y) < 170 && playerClass !== "owen") {

            let pull = Math.atan2(bolt.y - centerY, bolt.x - centerX);

            player.x += Math.cos(pull) * 0.65;

            player.y += Math.sin(pull) * 0.65;

        }

        if(bolt.effect === "boomerang" && bolt.life < 55 && bolt.originX !== undefined) {

            let returnAngle = Math.atan2(bolt.originY - bolt.y, bolt.originX - bolt.x);

            let returnSpeed = Math.hypot(bolt.vx, bolt.vy);

            bolt.vx = Math.cos(returnAngle) * returnSpeed;

            bolt.vy = Math.sin(returnAngle) * returnSpeed;

        }

        bolt.x += bolt.vx;

        bolt.y += bolt.vy;

        bolt.life--;

        let hitWall = getCurrentRoomWalls().some(function(wall) {

            return bolt.x >= wall.x && bolt.x <= wall.x + wall.width && bolt.y >= wall.y && bolt.y <= wall.y + wall.height;

        });

        let toBoltX = bolt.x - centerX;

        let toBoltY = bolt.y - centerY;

        let forward = toBoltX * Math.cos(player.angle) + toBoltY * Math.sin(player.angle);

        let lateral = Math.abs(-toBoltX * Math.sin(player.angle) + toBoltY * Math.cos(player.angle));

        // A raised shield parries a nearby projectile only in the direction faced.
        // Parry only during the first 0.25 seconds of a shield raise, and only
        // for a projectile within 0.5 ft of the shield directly in front.
        if(shieldRaised && parryTimer > 0 && forward > 0 && forward < 56 && lateral < 32) {

            enemyProjectiles.splice(i, 1);

            parryShineTimer = 12;

            continue;

        }

        if(assassinClone && Math.hypot(bolt.x - (assassinClone.x + assassinClone.width / 2), bolt.y - (assassinClone.y + assassinClone.height / 2)) < 18) {

            assassinClone = null;

            enemyProjectiles.splice(i, 1);

            continue;

        }

        if(!bolt.alreadyHitPlayer && !(playerClass === "musketeer" && musketeerSmokeTimer > 0) && !(playerClass === "stealth" && ninjaInvisibilityTimer > 0) && Math.hypot(bolt.x - centerX, bolt.y - centerY) < 18) {

            if(damagePlayer(bolt.damage || 22)) {

                applyEnemyBoltEffect(bolt.effect);

                if(bolt.effect === "ouchFire") ouchFireTimer = 180;

            }

            resolveEnemyBoltImpact(bolt);

            if(bolt.effect === "piercing" && !bolt.alreadyHitPlayer) {

                bolt.alreadyHitPlayer = true;

                continue;

            }

            enemyProjectiles.splice(i, 1);

            continue;

        }

        if(hitWall && bolt.effect === "ricochet" && (bolt.bounces || 0) < 3) {

            bolt.vx *= -1;

            bolt.vy *= -1;

            bolt.bounces = (bolt.bounces || 0) + 1;

            bolt.x -= bolt.vx;

            bolt.y -= bolt.vy;

            continue;

        }

        if(hitWall || bolt.life <= 0 || bolt.x < 0 || bolt.x > canvas.width || bolt.y < 0 || bolt.y > canvas.height) {

            resolveEnemyBoltImpact(bolt);

            enemyProjectiles.splice(i, 1);

        }

    }

    for(let i = reflectedProjectiles.length - 1; i >= 0; i--) {

        let beam = reflectedProjectiles[i];

        beam.x += beam.vx;

        beam.y += beam.vy;

        beam.life--;

        let hit = pointHitsWall(beam.x, beam.y);

        for(let enemy of enemies) {

            if(hit || !enemy.alive || enemy.room !== currentRoom) continue;

            let hitX = Math.max(enemy.x, Math.min(beam.x, enemy.x + enemy.width));

            let hitY = Math.max(enemy.y, Math.min(beam.y, enemy.y + enemy.height));

            if(Math.hypot(beam.x - hitX, beam.y - hitY) < 10) {

                damageEnemy(enemy, beam.damage, 140);

                hit = true;

            }

        }

        if(hit || beam.life <= 0 || beam.x < 0 || beam.x > canvas.width || beam.y < 0 || beam.y > canvas.height) reflectedProjectiles.splice(i, 1);

    }

}


function checkAttackHit(damage = 25) {


    let range = 55;


    for(let enemy of enemies) {


        if(!enemy.alive) {

            continue;

        }


        if(enemy.room !== currentRoom) {

            continue;

        }

        let enemyCenterX =

            enemy.x +

            enemy.width / 2;


        let enemyCenterY =

            enemy.y +

            enemy.height / 2;


        let playerCenterX =

            player.x +

            player.width / 2;


        let playerCenterY =

            player.y +

            player.height / 2;


        let dx =

            enemyCenterX -

            playerCenterX;


        let dy =

            enemyCenterY -

            playerCenterY;


        let distance =

            Math.sqrt(

                dx * dx +

                dy * dy

            );


        if(distance > range) {

            continue;

        }


        let angleToEnemy =

            Math.atan2(

                dy,

                dx

            );


        let angleDifference =

            Math.abs(

                normalizeAngle(

                    angleToEnemy -

                    player.angle

                )

            );


        // 100 degree sword sweep

        if(

            angleDifference <

            Math.PI * 0.55

        ) {

            damageEnemy(enemy, damage);

        }

    }

}


// ======================================================
// DASH ATTACK HIT
// ======================================================

function checkDashHit() {

    if(playerClass !== "hero" && playerClass !== "bruiser") return;


    for(let enemy of enemies) {


        if(!enemy.alive) {

            continue;

        }


        if(enemy.room !== currentRoom) {

            continue;

        }

        if(dashHitEnemies.has(enemy)) {

            continue;

        }


        let distance =

            Math.hypot(

                (

                    enemy.x -

                    player.x

                ),

                (

                    enemy.y -

                    player.y

                )

            );


        if(distance < 70) {

            dashHitEnemies.add(enemy);

            damageEnemy(enemy, dashDamage, 200);

        }

    }

}


// ======================================================
// NORMALIZE ANGLE
// ======================================================

function normalizeAngle(angle) {

    while(angle > Math.PI) {

        angle -= Math.PI * 2;

    }


    while(angle < -Math.PI) {

        angle += Math.PI * 2;

    }


    return angle;

}

function checkItems() {

            chest.collected = true;

            if(chest.rare && chest.reward === "heal") {

            }

            }

    for(let shrine of healingShrines) {

        if(shrine.room === currentRoom && !shrine.used && checkCollision(player, shrine)) {

            shrine.used = true;

            player.health = Math.min(player.maxHealth, player.health + 45);

        }

    }


    if(

        currentRoom === keyRoom &&

        !key.collected &&

        checkCollision(player, key)

    ) {

        key.collected = true;

        hasKey = true;

        score += 100;

    }


    if(

        currentRoom === treasureRoom &&

        !treasure.collected &&

        checkCollision(player, treasure)

    ) {

        treasure.collected = true;

        treasureCollected = true;

        score += 500;

    }

    let shrine = shrineRooms[currentRoom];

    if(shrine && !shrine.visited && checkCollision(player, shrine)) {

        shrine.visited = true;

        shrineChoices = getClassBuffChoices();

        gameState = "blessing";

        return;

    }


    let roomEncountersHere = roomEncounters.filter(function(encounter) { return encounter.room === currentRoom; });

    if(roomEncountersHere.length === 0) return;

    for(let roomEncounter of roomEncountersHere) {

    if(roomEncounter.type === "boss") {

        let boss = enemies.find(function(enemy) { return enemy.isBoss && enemy.room === currentRoom; });

        if(boss && !boss.alive) roomEncounter.used = true;

        return;

    }

    if(roomEncounter.used || !checkCollision(player, roomEncounter)) continue;

    if(roomEncounter.type === "shrine") {

        player.health = Math.min(player.maxHealth, player.health + 50);

        score += 75;

        roomEncounter.used = true;

    }

    else if(roomEncounter.type === "trader") {

        activeTrader = roomEncounter;

    }

    else if(roomEncounter.type === "evilShrine") {

        damagePlayer(25);

        score += 275;

        roomEncounter.used = true;

    }

    else if(roomEncounter.type === "cache") {

        let cacheGold = randomBetween(20, 50);

        gold += cacheGold;

        score += cacheGold;

        roomEncounter.used = true;

    }

    }

}

function updateTraps() {

    for(let index = slimePuddles.length - 1; index >= 0; index--) {

}

// ======================================================
// ENEMY AI
// ======================================================

function hasClearShot(fromX, fromY, toX, toY) {

    let steps = Math.ceil(Math.hypot(toX - fromX, toY - fromY) / 4);

    for(let step = 1; step < steps; step++) {

        let progress = step / steps;

        let x = fromX + (toX - fromX) * progress;

        let y = fromY + (toY - fromY) * progress;

        for(let wall of getCurrentRoomWalls()) {

            if(x >= wall.x && x <= wall.x + wall.width && y >= wall.y && y <= wall.y + wall.height) {

                return false;

            }

        }

    }

    return true;

}


function enemyCanHitPlayer(enemy, target = player) {

    let enemyCenterX = enemy.x + enemy.width / 2;

    let enemyCenterY = enemy.y + enemy.height / 2;

    let playerCenterX = target.x + target.width / 2;

    let playerCenterY = target.y + target.height / 2;

    let dx = playerCenterX - enemyCenterX;

    let dy = playerCenterY - enemyCenterY;

    let distance = Math.hypot(dx, dy);

    // A 70-degree attack cone means the player must be in front of the enemy
    // at the instant its swing lands, not merely touching any side of it.
    let facingDifference = Math.abs(Math.atan2(Math.sin(Math.atan2(dy, dx) - enemy.attackAngle), Math.cos(Math.atan2(dy, dx) - enemy.attackAngle)));

    return distance <= enemy.attackRange + player.width / 2 && facingDifference <= Math.PI * 70 / 360;

}


function moveEnemyWithWallCollision(enemy, moveX, moveY) {

    let oldX = enemy.x;

    enemy.x += moveX;

    if(getCurrentWalls().some(function(wall) { return checkCollision(enemy, wall); })) {

        enemy.x = oldX;

    }

    let oldY = enemy.y;

    enemy.y += moveY;

    if(getCurrentWalls().some(function(wall) { return checkCollision(enemy, wall); })) {

        enemy.y = oldY;

    }

    if(enemy.x !== oldX || enemy.y !== oldY) enemy.runTimer = 6;

}


function spawnSlimePawn(king) {

    let offsets = [{x: -48, y: 6}, {x: 48, y: 6}, {x: 0, y: 48}, {x: 0, y: -42}];

    let offset = offsets.find(function(candidate) {

        let pawn = {x: king.x + king.width / 2 + candidate.x - 11, y: king.y + king.height / 2 + candidate.y - 11, width: 22, height: 22};

        return !getCurrentWalls().some(function(wall) { return checkCollision(pawn, wall); });

    });

    if(!offset) return false;

    enemies.push({x: king.x + king.width / 2 + offset.x - 11, y: king.y + king.height / 2 + offset.y - 11, width: 22, height: 22, speed: 1.25, health: 42, maxHealth: 42, room: king.room, type: "slimePawn", hitFlash: 0, alive: true, attackCooldown: 35, attackTimer: 0, attackRange: 54});

    return true;

}


function findSlimeKingLanding(king, target) {

    let desiredX = Math.max(25, Math.min(710, target.x - 18));

    let desiredY = Math.max(30, Math.min(500, target.y - 18));

    // Walk backward from the target toward the King's current clear tile until the full body fits.
    for(let step = 0; step <= 12; step++) {

        let progress = step / 12;

        let candidate = {x: desiredX + (king.x - desiredX) * progress, y: desiredY + (king.y - desiredY) * progress, width: king.width, height: king.height};

        if(!getCurrentWalls().some(function(wall) { return checkCollision(candidate, wall); })) return candidate;

    }

    return {x: king.x, y: king.y};

}


function updateSlimeKing(king, target) {

    if(king.spawnCooldown > 0) king.spawnCooldown--;

    let pawnsAlive = enemies.filter(function(enemy) { return enemy.alive && enemy.room === king.room && enemy.type === "slimePawn"; }).length;

    if(pawnsAlive < 2 && king.spawnCooldown <= 0) {

        // Only start the summon cooldown when a clear spawn position was found.
        // This prevents a blocked room layout from putting the fight into a bad state.
        king.spawnCooldown = spawnSlimePawn(king) ? 120 : 20;

    }

    if(king.jumpTimer > 0) {

        king.jumpTimer--;

        let progress = 1 - king.jumpTimer / 36;

        king.x = king.jumpStartX + (king.jumpTargetX - king.jumpStartX) * progress;

        king.y = king.jumpStartY + (king.jumpTargetY - king.jumpStartY) * progress;

        if(king.jumpTimer === 0) {

            let kingCenterX = king.x + king.width / 2;

            let kingCenterY = king.y + king.height / 2;

            explosions.push({x: kingCenterX, y: kingCenterY, life: 24});

            screenShake = Math.max(screenShake, 14);

            // The leap is powerful but gives a fair dodge window.  It must also
            // strike the Ninja clone when one is active rather than the hidden player.
            let targetCenterX = target.x + target.width / 2;

            let targetCenterY = target.y + target.height / 2;

            if(Math.hypot(targetCenterX - kingCenterX, targetCenterY - kingCenterY) <= 100) {

                if(target === player) damagePlayer(25);

                else assassinClone = null;

            }

        }

        return;

    }

    if(king.attackCooldown > 0) {

        king.attackCooldown--;

        return;

    }

    king.jumpStartX = king.x;

    king.jumpStartY = king.y;

    let landing = findSlimeKingLanding(king, target);

    king.jumpTargetX = landing.x;

    king.jumpTargetY = landing.y;

    king.jumpTimer = 36;

    king.attackCooldown = 180;

}


function updateSlimePawn(pawn, target) {

    let pawnCenterX = pawn.x + pawn.width / 2;

    let pawnCenterY = pawn.y + pawn.height / 2;

    let targetCenterX = target.x + target.width / 2;

    let targetCenterY = target.y + target.height / 2;

    let dx = targetCenterX - pawnCenterX;

    let dy = targetCenterY - pawnCenterY;

    let distance = Math.hypot(dx, dy) || 1;

    pawn.angle = Math.atan2(dy, dx);

    if(distance > 46) moveEnemyWithWallCollision(pawn, dx / distance * pawn.speed, dy / distance * pawn.speed);

    if(pawn.attackTimer > 0) pawn.attackTimer--;

    if(pawn.attackCooldown > 0) pawn.attackCooldown--;

    if(distance <= pawn.attackRange && pawn.attackCooldown <= 0) {

        pawn.attackTimer = 12;

        pawn.attackCooldown = 50;

        if(target === player) damagePlayer(14);

        else assassinClone = null;

    }

}

function updateEnemies() {


    if(gameState !== "playing") {

        return;

    }


    for(let enemy of enemies) {


        if(!enemy.alive) {

            continue;

        }


        if(enemy.room !== currentRoom) {

            continue;

        }

        if(enemy.frozenTimer > 0) {

            enemy.frozenTimer--;

            if(enemy.hitFlash > 0) enemy.hitFlash--;

            continue;

        }


        let target = assassinClone && assassinClone.life > 0 ? assassinClone : player;

        // Smoke and Ninja invisibility prevent enemies from acquiring the real player.
        if(target === player && ((playerClass === "musketeer" && musketeerSmokeTimer > 0) || (playerClass === "stealth" && ninjaInvisibilityTimer > 0))) {

            if(enemy.attackCooldown > 0) enemy.attackCooldown--;

            if(enemy.hitFlash > 0) enemy.hitFlash--;

            continue;

        }

        if(enemy.stunTimer > 0) {

            enemy.stunTimer--;

            if(enemy.hitFlash > 0) enemy.hitFlash--;

            continue;

        }

        if(enemy.type === "slimeKing") {

            updateSlimeKing(enemy, target);

            if(enemy.hitFlash > 0) enemy.hitFlash--;

            continue;

        }

        if(enemy.type === "slimePawn") {

            updateSlimePawn(enemy, target);

            if(enemy.hitFlash > 0) enemy.hitFlash--;

            continue;

        }

        let dx =

            target.x -

            enemy.x;


        let dy =

            target.y -

            enemy.y;


        let distance =

            Math.sqrt(

                dx * dx +

                dy * dy

        );


        if(enemy.type === "mage") {

            // Mages prefer a comfortable casting distance instead of charging in.

            if(enemy.attackTimer <= 0 && distance > 300) {

                moveEnemyWithWallCollision(enemy, (dx / distance) * enemy.speed * 1.25, (dy / distance) * enemy.speed * 1.25);

            }

            if(enemy.attackTimer <= 0 && distance < 225) {

                moveEnemyWithWallCollision(enemy, -(dx / distance) * enemy.speed * 1.45, -(dy / distance) * enemy.speed * 1.45);

            }

            if(enemy.attackTimer <= 0 && distance >= 225 && distance <= 300) {

                let strafe = Math.sin(Date.now() * 0.003 + enemy.x) >= 0 ? 1 : -1;

                moveEnemyWithWallCollision(enemy, -dy / distance * enemy.speed * 0.55 * strafe, dx / distance * enemy.speed * 0.55 * strafe);

            }

            let mageCenterX = enemy.x + enemy.width / 2;

            let mageCenterY = enemy.y + enemy.height / 2;

            let playerCenterX = target.x + target.width / 2;

            let playerCenterY = target.y + target.height / 2;

            if(distance <= enemy.attackRange && enemy.attackCooldown <= 0 && hasClearShot(mageCenterX, mageCenterY, playerCenterX, playerCenterY)) {

                enemy.attackTimer = 24;

                enemy.attackCooldown = ENEMY_ATTACK_COOLDOWN;

            }

            if(enemy.attackTimer > 0) {

                enemy.attackTimer--;

                if(enemy.attackTimer === 12) {

                    let angle = Math.atan2(dy, dx);

                    enemyProjectiles.push({

                        x: enemy.x + enemy.width / 2,

                        y: enemy.y + enemy.height / 2,

                        vx: Math.cos(angle) * enemy.projectileSpeed,

                        vy: Math.sin(angle) * enemy.projectileSpeed,

                        damage: Math.round(enemy.projectileDamage * ENEMY_DAMAGE_MULTIPLIER),

                        color: enemy.projectileColor,

                        effect: enemy.effect,

                        life: 115

                    });

                }

            }

            if(enemy.attackCooldown > 0) enemy.attackCooldown--;

            if(enemy.hitFlash > 0) enemy.hitFlash--;

            continue;

        }


        // Non-mage enemies now fight from range as well, so survival is about
        // dodging and blocking shots instead of absorbing contact damage.
        if(enemy.attackTimer <= 0 && distance > 290) {

            moveEnemyWithWallCollision(enemy, (dx / distance) * enemy.speed * 1.2, (dy / distance) * enemy.speed * 1.2);

        }

        if(enemy.attackTimer <= 0 && distance < 205) {

            moveEnemyWithWallCollision(enemy, -(dx / distance) * enemy.speed * 1.2, -(dy / distance) * enemy.speed * 1.2);

        }

        if(enemy.attackTimer <= 0 && distance >= 205 && distance <= 290) {

            let strafe = Math.sin(Date.now() * 0.003 + enemy.y) >= 0 ? 1 : -1;

            moveEnemyWithWallCollision(enemy, -dy / distance * enemy.speed * 0.42 * strafe, dx / distance * enemy.speed * 0.42 * strafe);

        }

        let enemyCenterX = enemy.x + enemy.width / 2;

        let enemyCenterY = enemy.y + enemy.height / 2;

        let targetCenterX = target.x + target.width / 2;

        let targetCenterY = target.y + target.height / 2;

        if(distance <= 420 && enemy.attackCooldown <= 0 && hasClearShot(enemyCenterX, enemyCenterY, targetCenterX, targetCenterY)) {

            enemy.attackTimer = 18;

            enemy.attackCooldown = ENEMY_ATTACK_COOLDOWN;

        }

        if(enemy.attackTimer > 0) {

            enemy.attackTimer--;

            if(enemy.attackTimer === 8) {

                let angle = Math.atan2(dy, dx);

                let baseDamage = enemy.damageByHealth ? enemy.projectileDamage + (1 - player.health / player.maxHealth) * 18 : enemy.projectileDamage;

                let damage = Math.round(baseDamage * ENEMY_DAMAGE_MULTIPLIER);

                enemyProjectiles.push({x: enemyCenterX, y: enemyCenterY, originX: enemyCenterX, originY: enemyCenterY, vx: Math.cos(angle) * enemy.projectileSpeed, vy: Math.sin(angle) * enemy.projectileSpeed, damage: damage, color: enemy.projectileColor, effect: enemy.effect, life: enemy.effect === "boomerang" ? 125 : 105});

            }

        }


        if(enemy.attackCooldown > 0) {

            enemy.attackCooldown--;

        }


        if(enemy.hitFlash > 0) {

            enemy.hitFlash--;

        }

    }

}


// ======================================================
// DAMAGE PLAYER
// ======================================================

function damagePlayer(amount = 15) {

    // Owen's DEV status makes him fully immune to damage, including traps and boss attacks.
    if(playerClass === "owen") return false;

    // Mage dashes are an evasive blink: no damage can land until the dash ends.
    if(playerClass === "mage" && dashTimer > 0) {

        return false;

    }


    if(damageCooldown > 0) {

        return false;

    }


    // Bruiser, Cyborg and Mage have sturdy shields; Stealth trades defense for speed.
    // Cyborg's shield is also active for the duration of a powered thruster burst.
    if(shieldRaised || (playerClass === "cyborg" && cyborgThrusterActive && cyborgFuel > 0)) {

        let block = playerClass === "hero" ? 0.5 : playerClass === "stealth" ? 0.25 : 0.75;

        amount *= 1 - Math.min(0.9, block + build.shieldBonus);

    }

    player.health -= amount;

    damageCooldown = 48;

    screenShake = 10;


    if(player.health <= 0) {

        player.health = 0;

        deathTimer = 100;

        gameState = "dying";

    }

    return true;

}


// ======================================================
// DAMAGE COOLDOWN
// ======================================================

function updateDamageCooldown() {

    if(parryTimer > 0) parryTimer--;

    if(parryShineTimer > 0) parryShineTimer--;

    if(bruiserChargeCooldown > 0) bruiserChargeCooldown--;

    for(let index = bruiserShockwaves.length - 1; index >= 0; index--) {

        bruiserShockwaves[index].life--;

        if(bruiserShockwaves[index].life <= 0) bruiserShockwaves.splice(index, 1);

    }

    for(let enemy of enemies) {

        if(enemy.pulseTimer > 0) enemy.pulseTimer--;

        if(enemy.runTimer > 0) enemy.runTimer--;

    }

    if(musketeerOverheatTimer > 0) musketeerOverheatTimer--;

    if(musketeerTeleportCooldown > 0) musketeerTeleportCooldown--;

    if(musketeerSmokeTimer > 0) musketeerSmokeTimer--;

    if(playerSlowTimer > 0) playerSlowTimer--;

    if(playerBleedTimer > 0) {

        playerBleedTimer--;

        if(playerBleedTimer % 45 === 0) damagePlayer(3);

    }

    if(playerBurnTimer > 0) {

        playerBurnTimer--;

        if(playerBurnTimer % 40 === 0) damagePlayer(3);

    }

    if(playerFreezeTimer > 0) playerFreezeTimer--;

    if(darknessTimer > 0) darknessTimer--;

    for(let index = toxicClouds.length - 1; index >= 0; index--) {

        let cloud = toxicClouds[index];

        cloud.life--;

        if(cloud.room === currentRoom && checkCollision(player, cloud)) playerSlowTimer = Math.max(playerSlowTimer, 30);

        if(cloud.life <= 0) toxicClouds.splice(index, 1);

    }

    if(ouchFireTimer > 0) ouchFireTimer--;

    if(ninjaInvisibilityTimer > 0) ninjaInvisibilityTimer--;

    if(assassinClone) {

        assassinClone.life--;

        if(assassinClone.life <= 0) assassinClone = null;

    }


    if(damageCooldown > 0) {

        damageCooldown--;

    }


    if(screenShake > 0) {

        screenShake--;

    }

    if(movementLightning > 0) {

        movementLightning--;

    }

}


// ======================================================
// COBBLESTONE FLOOR
// ======================================================

function drawFloor() {

    // Square 16px tiles and a restricted palette keep the dungeon readable at a glance.
    ctx.fillStyle = "#20263a";

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for(let y = 16; y < canvas.height; y += 16) {

        for(let x = 16; x < canvas.width; x += 16) {

            let shade = (x / 16 + y / 16) % 3;

            ctx.fillStyle = shade === 0 ? "#303a52" : shade === 1 ? "#2b3449" : "#263047";

            ctx.fillRect(x, y, 14, 14);

            ctx.fillStyle = "#46516a";

            ctx.fillRect(x, y, 14, 2);

            ctx.fillStyle = "#1b2234";

            ctx.fillRect(x, y + 12, 14, 2);

        }

    }

    for(let pool of waterPools[currentRoom] || []) {

        ctx.fillStyle = "#174c70";

        ctx.fillRect(pool.x, pool.y, pool.width, pool.height);

        ctx.fillStyle = "#276f95";

        ctx.fillRect(pool.x + 4, pool.y + 4, pool.width - 8, 5);

        ctx.fillStyle = "#65b9d4";

        for(let wave = 0; wave < pool.width - 10; wave += 18) {

            let offset = (Math.floor(Date.now() / 240) + wave / 18) % 2 === 0 ? 0 : 3;

            ctx.fillRect(pool.x + 6 + wave, pool.y + 15 + offset, 10, 2);

        }

    }

}


// ======================================================
// WALLS
// ======================================================

function drawWalls() {


    for(let wall of rooms[currentRoom] || []) {


        ctx.fillStyle = "#17202c";


        ctx.fillRect(

            wall.x,

            wall.y,

            wall.width,

            wall.height

        );


        ctx.fillStyle = "#53627a";


        ctx.fillRect(

            wall.x,

            wall.y,

            wall.width,

            4

        );


        ctx.fillStyle = "#0d131d";


        ctx.fillRect(

            wall.x,

            wall.y +

            wall.height -

            5,

            wall.width,

            4

        );

        // Chunky stone blocks make walls read as classic 8-bit dungeon cover.
        ctx.fillStyle = "#344258";

        for(let blockY = wall.y + 6; blockY < wall.y + wall.height - 5; blockY += 12) {

            let offset = Math.floor((blockY - wall.y) / 12) % 2 ? 6 : 0;

            for(let blockX = wall.x + 4 - offset; blockX < wall.x + wall.width - 3; blockX += 12) {

                ctx.fillRect(blockX, blockY, 9, 8);

            }

        }

    }

}


// ======================================================
// TORCHES
// ======================================================

function drawTorches() {


    let roomTorches =

        torches[currentRoom];


    let flicker =

        Math.sin(

            Date.now() *

            0.01

        ) * 2;


    for(let torch of roomTorches) {


        let x = torch.x;

        let y = torch.y;


        ctx.fillStyle = "#777";


        ctx.fillRect(

            x - 5,

            y - 5,

            10,

            10

        );


        ctx.fillStyle = "#5a3218";


        ctx.fillRect(

            x - 4,

            y - 4,

            8,

            20

        );


        ctx.fillStyle =

            "rgba(255,150,30,0.4)";


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            16 +

            flicker,

            0,

            Math.PI * 2

        );


        ctx.fill();


        ctx.fillStyle = "#ff9d22";


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            8 +

            flicker,

            0,

            Math.PI * 2

        );


        ctx.fill();


        ctx.fillStyle = "#fff1a8";


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            4,

            0,

            Math.PI * 2

        );


        ctx.fill();

    }

}


// ======================================================
// DOORS
// ======================================================

function drawDoors() {

    function drawWoodenDoor(x, y, width, height) {

        ctx.fillStyle = "#3f2113";

        ctx.fillRect(x, y, width, height);

        ctx.fillStyle = "#8a4a24";

        ctx.fillRect(x + 3, y + 3, width - 6, height - 6);

        ctx.strokeStyle = "#c28343";

        ctx.lineWidth = 2;

        for(let plank = 1; plank < 5; plank++) {

            let plankY = y + plank * height / 5;

            ctx.beginPath();

            ctx.moveTo(x + 3, plankY);

            ctx.lineTo(x + width - 3, plankY);

            ctx.stroke();

        }

        ctx.fillStyle = "#e1b355";

        ctx.fillRect(x + width / 2 - 3, y + height / 2, 6, 6);

    }

    if(currentRoom > 1) drawWoodenDoor(0, 230, 50, 140);

    if(currentRoom < roomCount) drawWoodenDoor(750, 230, 50, 140);

}


// ======================================================
// KEY

function drawKey() {

    return;


    if(

        currentRoom !== keyRoom ||

        key.collected

    ) {

        return;

    }


    ctx.strokeStyle = "gold";

    ctx.lineWidth = 5;


    ctx.beginPath();


    ctx.arc(

        key.x + 7,

        key.y + 7,

    );

    ctx.beginPath();


    ctx.moveTo(

        key.x + 13,

        key.y + 7

    );


    ctx.lineTo(

        key.x + 28,

        key.y + 7

    );


    ctx.stroke();


    ctx.lineWidth = 1;

}

function drawTreasure() {

function drawEncounter() {

    let roomEncountersHere = roomEncounters.filter(function(encounter) { return encounter.room === currentRoom && !encounter.used; });

    for(let encounter of roomEncountersHere) {

    let cx = encounter.x + encounter.width / 2;

    let cy = encounter.y + encounter.height / 2;

    ctx.save();

    ctx.textAlign = "center";

    if(encounter.type === "shrine") {

        ctx.fillStyle = "#77d7ff";

        ctx.shadowColor = "#3bbcff";

        ctx.shadowBlur = 16;

        ctx.fillRect(encounter.x + 6, encounter.y + 7, 22, 27);

        ctx.fillStyle = "#e8fbff";

        ctx.fillRect(cx - 3, encounter.y + 11, 6, 17);

        ctx.fillRect(cx - 8, encounter.y + 16, 16, 6);

        ctx.fillStyle = "white";

        ctx.fillText("SHRINE: +50 HP", cx, encounter.y - 8);

    }

    else if(encounter.type === "evilShrine") {

        ctx.fillStyle = "#882952";

        ctx.shadowColor = "#df1c63";

        ctx.shadowBlur = 18;

        ctx.beginPath();

        ctx.moveTo(cx, encounter.y + 2);

        ctx.lineTo(encounter.x + 31, encounter.y + 32);

        ctx.lineTo(encounter.x + 3, encounter.y + 32);

        ctx.fill();

        ctx.fillStyle = "#ff5295";

        ctx.fillText("EVIL SHRINE: +275 / -25 HP", cx, encounter.y - 8);

    }

    else if(encounter.type === "trader") {

        // A rag-wrapped elder trader, visually related to the starting-room guide.
        ctx.fillStyle = "#322837";

        ctx.fillRect(encounter.x + 5, encounter.y + 15, 24, 19);

        ctx.fillStyle = "#6d5a48";

        ctx.fillRect(encounter.x + 7, encounter.y + 17, 20, 14);

        ctx.fillStyle = "#caa982";

        ctx.fillRect(encounter.x + 9, encounter.y + 6, 14, 11);

        ctx.fillStyle = "#d9d4c4";

        ctx.fillRect(encounter.x + 7, encounter.y + 3, 18, 5);

        ctx.fillRect(encounter.x + 10, encounter.y + 15, 11, 4);

        ctx.fillStyle = "#342d35";

        ctx.fillRect(encounter.x + 11, encounter.y + 10, 2, 2);

        ctx.fillRect(encounter.x + 17, encounter.y + 10, 2, 2);

        ctx.fillStyle = "#8b6948";

        ctx.fillRect(encounter.x + 27, encounter.y + 7, 2, 27);

        ctx.fillRect(encounter.x + 25, encounter.y + 6, 6, 3);

        ctx.fillStyle = "#b29269";

        ctx.fillRect(encounter.x + 5, encounter.y + 22, 4, 3);

        ctx.fillRect(encounter.x + 21, encounter.y + 27, 5, 3);

        ctx.fillStyle = "white";

        ctx.fillText("WANDERING TRADER", cx, encounter.y - 8);

    }

    else if(encounter.type === "cache") {

        ctx.fillRect(encounter.x + 4, encounter.y + 8, 26, 7);

    }

    else {

        ctx.fillStyle = "#ff5050";

        ctx.font = "bold 15px Arial";

        ctx.fillText("BOSS", cx, encounter.y - 10);

    }

    ctx.restore();

}

}

function drawTraps() {

    for(let trap of traps) {

        if(trap.room !== currentRoom) continue;

        ctx.save();

        // Recessed floor plate until someone steps on it, then the spikes snap out briefly.
        ctx.fillStyle = "#1c2632";

        ctx.fillRect(trap.x, trap.y, trap.width, trap.height);

        ctx.fillStyle = "#536171";

        ctx.fillRect(trap.x + 3, trap.y + 3, trap.width - 6, trap.height - 6);

        if(trap.activeTimer > 0) {

            ctx.shadowColor = "#e9f5ff";

            ctx.shadowBlur = 10;

        }

        ctx.fillStyle = "#eff8ff";

        for(let spike = 0; spike < 4 && trap.activeTimer > 0; spike++) {

            let spikeX = trap.x + spike * 7 + 1;

            ctx.beginPath();

            ctx.moveTo(spikeX, trap.y + 27);

            ctx.lineTo(spikeX + 3, trap.y + 27 - extension);

            ctx.lineTo(spikeX + 6, trap.y + 27);

            ctx.fill();

        }

        ctx.restore();

    }

}

function drawNewEnemy(enemy) {

    let x = enemy.x, y = enemy.y;

    const designs = {
        bonecaster: ["#e8e3cf", "#63bcff"], bloodCultist: ["#5c1724", "#ef4453"], eye: ["#8e609b", "#e6d6ff"],
        plagueRat: ["#557542", "#94ff55"], flameWraith: ["#256fb5", "#ff8a35"], shadowArcher: ["#20202a", "#976cff"],
        crystalCrawler: ["#315e78", "#82f6ff"], voidPriest: ["#2d1e49", "#090914"], mimicMage: ["#9b652d", "#ffdc5a"],
        frostWitch: ["#bcdff0", "#f1ffff"], cursedKnight: ["#3a3d50", "#ff3d4d"], lantern: ["#55545c", "#ffcc54"],
        rottingShaman: ["#557348", "#94d968"], hive: ["#6d5b21", "#ffe761"], bloodOrb: ["#8f2636", "#ff5a67"], jester: ["#713b78", "#ff80d6"], plagueMinion: ["#3b6437", "#a6ef72"]
    };

    let palette = designs[enemy.type];

    if(palette) {

        let body = palette[0], glow = palette[1];

        ctx.fillStyle = enemy.hitFlash > 0 ? "#ffffff" : body;

        ctx.shadowColor = glow;

        ctx.shadowBlur = 8;

        if(enemy.type === "eye") {

            ctx.fillRect(x + 3, y + 8, enemy.width - 6, enemy.height - 14);

            ctx.fillRect(x + enemy.width / 2 - 7, y + 13, 14, 9);

            ctx.fillStyle = "#12101b";

            ctx.fillRect(x + enemy.width / 2 - 2, y + 14, 4, 7);

            for(let small = 0; small < 3; small++) ctx.fillRect(x + small * 12 + 2, y + (small % 2) * 6, 4, 4);

        } else if(enemy.type === "plagueRat" || enemy.type === "crystalCrawler") {

            ctx.fillRect(x + 5, y + 9, enemy.width - 9, enemy.height - 12);

            for(let leg = 0; leg < 4; leg++) ctx.fillRect(x + 5 + leg * 7, y + enemy.height - 7, 4, 7);

            ctx.fillStyle = glow;

            ctx.fillRect(x + enemy.width - 12, y + 10, 5, 5);

            ctx.fillRect(x + 8, y + 5, 7, 5);

        } else if(enemy.type === "bloodOrb" || enemy.type === "hive") {

            ctx.beginPath();

            ctx.arc(x + enemy.width / 2, y + enemy.height / 2, Math.min(enemy.width, enemy.height) / 2 - 3, 0, Math.PI * 2);

            ctx.fill();

            ctx.fillStyle = glow;

            ctx.fillRect(x + enemy.width / 2 - 4, y + enemy.height / 2 - 4, 8, 8);

            if(enemy.type === "hive") for(let bug = 0; bug < 5; bug++) ctx.fillRect(x + (bug * 7) % enemy.width, y + 3 + (bug % 3) * 8, 3, 3);

            ctx.strokeStyle = "#85858c";

            ctx.strokeRect(x + 5, y + 8, enemy.width - 10, enemy.height - 10);

            ctx.fillStyle = glow;

            ctx.fillRect(x + 9, y + 13, enemy.width - 18, 12);

            ctx.fillStyle = "#17131b";

            ctx.fillRect(x + enemy.width / 2 - 2, y + 16, 4, 4);

        } else {

            ctx.fillRect(x + 5, y + 16, enemy.width - 10, enemy.height - 18);

            ctx.fillStyle = glow;

            ctx.fillRect(x + 10, y + 10, 4, 3);

            if(enemy.type === "bloodCultist" || enemy.type === "voidPriest" || enemy.type === "frostWitch") ctx.fillRect(x + 4, y + 1, enemy.width - 8, 5);

            if(enemy.type === "shadowArcher") { ctx.strokeStyle = glow; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + enemy.width - 4, y + 22, 9, -Math.PI / 2, Math.PI / 2); ctx.stroke(); }

            if(enemy.type === "bonecaster" || enemy.type === "rottingShaman") { ctx.fillStyle = glow; ctx.fillRect(x + enemy.width - 3, y + 14, 2, 20); }

        }

        ctx.restore();

    } else if(enemy.type === "demonSpawn") {

        let flap = Math.sin(Date.now() * 0.02) * 5;

function drawSlimePuddles() {

    for(let cloud of toxicClouds) {

        if(cloud.room !== currentRoom) continue;

        ctx.save();

        ctx.globalAlpha = Math.min(0.55, cloud.life / 180);

        ctx.fillStyle = "#5cae3c";

        ctx.shadowColor = "#91ef5e";

        ctx.shadowBlur = 12;

        ctx.beginPath();

        ctx.arc(cloud.x + cloud.width / 2, cloud.y + cloud.height / 2, cloud.width / 2, 0, Math.PI * 2);

        ctx.fill();

        ctx.restore();

    }

    for(let puddle of slimePuddles) {

        if(puddle.room !== currentRoom) continue;

        ctx.save();

        ctx.globalAlpha = Math.min(0.78, puddle.life / 120);

        ctx.fillStyle = "#2c8755";

        ctx.fillRect(puddle.x, puddle.y + 6, puddle.width, puddle.height - 10);

        ctx.fillStyle = "#69d878";

        ctx.fillRect(puddle.x + 7, puddle.y + 5, puddle.width - 15, 5);

        ctx.fillStyle = "#b0ff9e";

        ctx.fillRect(puddle.x + 10, puddle.y + 9, 7, 2);

        ctx.restore();

    }

}

function drawEnemies() {


    for(let enemy of enemies) {


        if(

            enemy.room !== currentRoom ||

            !enemy.alive

        ) {

            continue;

        }


        if(enemy.runTimer > 0) {

            ctx.save();

            ctx.translate(0, Math.sin(Date.now() * 0.035 + enemy.x) * 2);

        }

        if(enemy.type === "mage") {

            drawMage(enemy);

        }

        else if(["skeletalMage", "slimeKin", "skeletonArcher", "demonSpawn", "bonecaster", "bloodCultist", "eye", "plagueRat", "flameWraith", "shadowArcher", "crystalCrawler", "voidPriest", "mimicMage", "frostWitch", "cursedKnight", "lantern", "rottingShaman", "hive", "bloodOrb", "jester", "plagueMinion"].includes(enemy.type)) {

            drawNewEnemy(enemy);

        }

        else if(enemy.type === "slimeKing") {

            drawSlimeKing(enemy);

        }

        else if(enemy.type === "slimePawn") {

            drawSlimePawn(enemy);

        }

        else if(enemy.type === "boss") {

            drawBoss(enemy);

        }

        else if(enemy.type === "raider") {

            drawRaider(enemy);

        }

        else if(enemy.type === "slime") {

            drawSlime(enemy);

        }

        else {

            drawOrc(enemy);

        }

        if(enemy.runTimer > 0) ctx.restore();

        if(enemy.frozenTimer > 0) {

            ctx.fillStyle = "rgba(130, 220, 255, 0.45)";

            ctx.fillRect(enemy.x - 2, enemy.y - 2, enemy.width + 4, enemy.height + 4);

            ctx.strokeStyle = "#c9f6ff";

            ctx.strokeRect(enemy.x - 2, enemy.y - 2, enemy.width + 4, enemy.height + 4);

        }

        if(enemy.pulseTimer > 0) {

            ctx.fillStyle = "rgba(61, 192, 255, " + (enemy.pulseTimer / 18) + ")";

            ctx.fillRect(enemy.x - 2, enemy.y - 2, enemy.width + 4, enemy.height + 4);

        }


        // Health bar

        ctx.fillStyle = "black";


        ctx.fillRect(

            enemy.x,

            enemy.y - 10,

            enemy.width,

            5

        );


        ctx.fillStyle = "red";


        ctx.fillRect(

            enemy.x,

            enemy.y - 10,

            enemy.width *

            (

                enemy.health /

                enemy.maxHealth

            ),

            5

        );


        // Attack animation

        if(enemy.attackTimer > 0) {


            let centerX =

                enemy.x +

                enemy.width / 2;


            let centerY =

                enemy.y +

                enemy.height / 2;


            ctx.strokeStyle =

                enemy.attackTimer > 12

                    ? "orange"

                    : "red";


            ctx.lineWidth = 4;


            ctx.beginPath();


            ctx.arc(

                centerX,

                centerY,

                28 +

                (

                    25 -

                    enemy.attackTimer

                ),

                0,

                Math.PI * 2

            );


            ctx.stroke();


            ctx.lineWidth = 1;

        }

    }

}

function drawPlayer() {
